.gs.labelsnote":"按钮名称可能因你的 Google 账户语言而略有不同。","sync.gs.s1":"登录 Google 后打开 {link}，会新建一个 Apps Script 项目。","sync.gs.s2":"删除示例代码，粘贴 Kakitori 同步脚本。","sync.gs.scriptaria":"Kakitori 同步脚本","sync.gs.copy":"复制脚本","sync.gs.s3":"点击「部署」，然后点「新建部署」。类型选择「网页应用」。把「执行身份」设为「我」，「谁有权访问」设为「所有人」，然后点击「部署」。","sync.gs.s4":"Google 请求授权时选择允许。如果提示 Google 尚未验证此应用，点击「高级」，再点击转至该项目的链接。这是你自己的脚本。","sync.gs.s5":"复制以 /exec 结尾的网页应用网址，粘贴到这里。","sync.gs.urlaria":"网页应用网址","sync.gs.other":"已经在另一部手机上设置过？在第 5 步粘贴那部手机的同步地址即可。","sync.choose.intro":"让 Android 手机和 iPhone 上的进度保持一致，重装应用也不会丢失。两种方式都免费。","sync.usegh":"使用 GitHub","sync.usegs":"使用 Google","sync.choose.note":"GitHub 会保存到你账户中的私有仓库。Google 通过你添加到账户里的一个小脚本保存。","sync.gh.badrepo":"请按 your-username/kakitori-progress 的格式输入仓库。","sync.gh.badtoken":"请粘贴 GitHub 生成的令牌，它通常以 github_pat_ 开头。","sync.gh.on":"GitHub 同步已开启。","sync.gh.onpublic":"GitHub 同步已开启。这个仓库是公开的，任何人都能看到你的进度。你可以在 GitHub 的仓库设置中把它改为私有。","sync.gs.copied":"脚本已复制。","sync.gs.selectscript":"请选中脚本并复制。","sync.gs.devurl":"这是以 /dev 结尾的测试网址。请使用「部署」后得到的、以 /exec 结尾的网页应用网址。","sync.gs.badurl":"请粘贴 Apps Script 的网页应用网址。它以 https://script.google.com 开头，以 /exec 结尾。","sync.gs.on":"Google 同步已开启。","sync.synced":"已同步。","sync.addrcopied":"同步地址已复制。","sync.addrselect":"请选中下面的地址并复制。","sync.offtoast":"这部手机上的 {svc} 同步已关闭。保存在 {svc} 中的进度仍然保留。","err.offline":"你现在处于离线状态。恢复联网后 Kakitori 会自动同步。","err.timeout":"{svc} 响应超时。Kakitori 稍后会重试。","err.conflict":"另一部手机正在同时保存。点「立即同步」再试一次。","err.unreadable":"无法读取已保存的进度。请先在下面生成备份码，然后关闭同步并重新设置。","err.gh.network":"无法连接 GitHub。请检查网络后重试。","err.gh.401":"GitHub 不接受这个令牌。它可能已过期，或者粘贴时被截断了。请新建一个令牌再粘贴。","err.gh.ratelimit":"GitHub 要求 Kakitori 放慢请求速度。一小时内同步会恢复正常。","err.gh.403":"这个令牌无权修改 {repo}。请确认它可以访问这个仓库，且 “Contents” 设为 “Read and write”。","err.gh.404":"Kakitori 找不到 {repo}。请检查拼写，并确认令牌已获得这个仓库的访问权限。","err.gh.owner":"请在仓库名前加上你的 GitHub 用户名，例如 your-username/kakitori-progress。","err.gh.other":"GitHub 报告了一个问题（错误 {code}）。请稍后再试。","err.gs.network":"无法连接你的同步脚本。请确认部署的「谁有权访问」设为「所有人」，并且复制的是以 /exec 结尾的网页应用网址。","err.gs.other":"你的同步脚本 一个圈。读 ha。","ひ":"来自「比」的草书：一道宽宽的弧，像笑起来的嘴。读 hi。","ふ":"来自「不」的草书：四个分开的笔画。读 fu。","へ":"来自「部」右边「阝」的草书：只剩一个小山尖。读 he。","ほ":"来自「保」的草书：像 は，但右边多一横。读 ho。","ま":"来自「末」的草书：两横被一竖穿过，下面绕个圈。读 ma。","み":"来自「美」的草书：一个带尾巴的圈，被一笔斜着穿过。读 mi，接近「美」měi。","む":"来自「武」的草书：十字、一个圈，再加一点。读 mu。","め":"来自「女」的草书：两笔交叉，再绕一个圈。读 me。","も":"来自「毛」的草书：一个钩加两横，就像「毛」。读 mo，接近「毛」máo。","や":"来自「也」的草书：一道弯、一点和一长笔。读 ya，接近「也」yě。","ゆ":"来自「由」的草书：一个圈被一竖穿过。读 yu，接近「由」yóu。","よ":"来自「与」（與）的草书：一短横，一竖下面绕个圈。读 yo。","ら":"来自「良」的草书：一点在一道弯的上面。读 ra，接近「良」liáng。","り":"来自「利」的草书：两笔，右边那笔更长，像立刀旁。读 ri，接近「利」lì。","る":"来自「留」的草书：像 ろ，但最后绕一个小圈。读 ru，接近「留」liú。","れ":"来自「礼」（禮）的草书：一竖，右边一笔向外舒展。读 re。","ろ":"来自「呂」（吕）的草书：像 る，但没有收尾的小圈。读 ro。","わ":"来自「和」的草书：一竖，右边一道大开口的弯。读 wa。","を":"来自「遠」（远）的草书：三笔缠绕在一起。读 o，几乎只用作宾语助词。","ん":"来自「无」的草书：像手写的「n」，带个小尾巴。读 n。","ア":"取自「阿」的左边「阝」。读 a，和「阿」ā 一样。","イ":"取自「伊」的左边「亻」。读 i，接近「伊」yī。","ウ":"取自「宇」上面的「宀」。读 u，和 う 同源。","エ":"取自「江」右边的「工」。读 e。","オ":"取自「於」左边「方」的变形。读 o。","カ":"取自「加」左边的「力」。读 ka，和 か 同源。","キ":"取自「幾」，和 き 同源，只是写成直线。读 ki。","ク":"取自「久」的前两笔。读 ku。","ケ":"取自「介」的变形。读 ke。","コ":"取自「己」的上半部分，像个开口的框。读 ko。","サ":"取自「散」的左上部分。读 sa。","シ":"取自「之」：左边两点，长笔从下往上挑。ツ 的长笔则从上往下撇。读 shi。","ス":"取自「須」的一部分：一横，加一撇带一点。读 su。","セ":"取自「世」，和 せ 同源，但少了一只脚。读 se。","ソ":"取自「曽」（曾）上面的两点：一点，加一长撇从上往下。ン 的长笔则从下往上挑。读 so。","タ":"取自「多」的上半部分「夕」。读 ta。","チ":"取自「千」：一撇、一横、一竖带弯。读 chi。","ツ":"取自「川」：三笔都从上往下落。シ 的长笔则从下往上挑。读 tsu。","テ":"取自「天」：两横加一撇。读 te。","ト":"取自「止」的上半部分。读 to。","ナ":"取自「奈」上面的「大」，写成十字加一撇。读 na。","ニ":"取自「仁」右边的「二」。读 ni，日语里「二」也读 ni。","ヌ":"取自「奴」右边的「又」。读 nu。","ネ":"取自「祢」左边的「礻」。读 ne。","ノ":"取自「乃」的第一笔。读 no。","ハ":"取自「八」。读 ha。","ヒ":"取自「比」的右半边。读 hi。","フ":"取自「不」的前两笔。读 fu。","ヘ":"取自「部」右边的「阝」，和 へ 写法一样。读 he。","ホ":"取自「保」右下的「木」。读 ho。","マ":"取自「末」的变形：一个折笔加一点。读 ma。","ミ":"取自「三」：三笔斜着写。读 mi。","ム":"取自「牟」上面的「厶」。读 mu。","メ":"取自「女」的后两笔，交叉成 X。读 me。","モ":"取自「毛」，和 も 同源，写成直线。读 mo。","ヤ":"取自「也」，和 や 同源。读 ya。","ユ":"取自「由」的一部分，像一个躺着的方形 U。读 yu。","ヨ":"取自「與」的一部分，像反写的 E。读 yo。","ラ":"取自「良」的上半部分。读 ra。","リ":"取自「利」右边的「刂」，和 り 同源。读 ri。","ル":"取自「流」的右下部分。读 ru。","レ":"取自「礼」右边的那一笔，像打了个钩 ✓。读 re。","ロ":"取自「呂」（吕）里的「口」。读 ro。","ワ":"取自「和」右边「口」的变形。读 wa。","ヲ" 份。","set.display":"顯示","set.language":"語言","set.lang.auto":"自動（{name}）","set.theme":"主題","theme.auto":"自動","theme.light":"淺色","theme.dark":"深色","set.themenote":"「自動」跟隨裝置的淺色或深色設定。","set.romaji":"在日語旁顯示羅馬字","set.review":"複習計畫","set.reviewnote":"你答對得越多，Kakitori 安排的複習間隔就越長：10 分鐘，然後 1 天、3 天、一週，甚至更久。如果想更頻繁地複習，可以設定一個上限。","set.gaplabel":"每個假名和動詞至少多久複習一次","gap.0":"由 Kakitori 決定（最長 3 個月）","gap.1440":"每天","gap.4320":"每 3 天","gap.10080":"每週","gap.20160":"每 2 週","gap.43200":"每月","gap.toast":"最長間隔：{label}。","gap.moved.other":"{n} 個複習已提前。","gap.auto":"Kakitori 會自動安排複習間隔。","rem.title":"提醒","rem.toggle":"每天提醒我練習","rem.time":"時間","rem.note":"如果你當天已經練習過，Kakitori 就不會提醒；提醒時還會告訴你有多少待複習。","rem.blocked":"Kakitori 的通知已關閉。請在手機設定中開啟，然後重新開啟提醒。","rem.opensettings":"開啟通知設定","rem.test":"傳送測試通知","rem.ios":"iPhone 上的網頁應用程式無法自行安排通知。想每天被提醒，可以對 Siri 說：「每天晚上 7 點提醒我練日語。」也可以在「提醒事項」App 裡設定重複提醒。","rem.set":"已設定提醒：{time}。","rem.moved":"提醒已改為 {time}。","rem.off":"每日提醒已關閉。","rem.fail":"無法設定提醒，請重試。","rem.testsent":"測試通知已傳送。","notif.title":"該練習了","notif.one":"有 1 個待複習。花幾分鐘就能記得更牢。","notif.many":"有 {n} 個待複習。花幾分鐘就能記得更牢。","notif.none":"花幾分鐘寫寫假名，記得更牢。","notif.channel":"練習提醒","sync.title":"同步","sync.claude.on":"你的進度儲存在 Claude 帳戶中，無論在哪裡用 Claude 開啟 Kakitori 都能接著學。","sync.claude.off":"進度儲存在這個瀏覽器裡。登入後在 Claude 中開啟 Kakitori，即可同步到你的帳戶。","sync.claude.phones":"手機 App透過 GitHub 或 Google 單獨同步。要在手機 App和這個版本之間轉移進度，請使用下面的備份碼。","sync.busy":"正在與 {svc} 同步…","sync.ok":"{ago}已與 {svc} 同步。","sync.connected":"已連結 {svc}。","ago.now":"剛剛","ago.min.other":"{n} 分鐘前","ago.h.other":"{n} 小時前","ago.day.other":"{n} 天前","sync.gh.where":"正在儲存到 GitHub 上的 {repo}。要同步另一部手機，請在那部手機上用同一個儲存庫和權杖設定 GitHub 同步。","sync.gs.where":"要同步另一部手機，請把同一個同步地址貼上到它的 Google 同步設定中。拿到這個地址的人都能查看和修改你的進度，請妥善保管。","sync.gs.addr":"同步地址","sync.now":"立即同步","sync.copyaddr":"複製同步地址","sync.off":"關閉","sync.offarm":"再點一次以關閉","sync.gh.title":"透過 GitHub 同步","sync.gh.intro":"你的進度會儲存到你 GitHub 帳戶中的一個私有儲存庫。設定大約需要三分鐘。","sync.gh.labelsnote":"GitHub 的介面是英文的，所以下面的按鈕名稱保留英文。","sync.gh.s1":"建立一個名為 {name} 的 const LANGS=[['en','English'],['es','Español'],['fr','Français'],['de','Deutsch'],['hi','हिन्दी'],['zh-Hans','简体中文'],['zh-Hant','繁體中文']];
let LANG='en', PR=null;
function detectLang(){
  const list=(navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language||'en'];
  for(const l of list){
    const x=String(l).toLowerCase();
    if(x.startsWith('zh')) return /hant|-tw|-hk|-mo/.test(x) ? 'zh-Hant' : 'zh-Hans';
    const b=x.split('-')[0];
    if(I18N[b]) return b;
  }
  return 'en';
}
function langName(code){ const f=LANGS.find(l=>l[0]===code); return f ? f[1] : code; }
function applyLang(){
  const want=S.set.lang;
  LANG = (want && want!=='auto' && I18N[want]) ? want : detectLang();
  document.documentElement.lang = LANG;
  try{ PR=new Intl.PluralRules(LANG); }catch(e){ PR=new Intl.PluralRules('en'); }
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent=t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>{ el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  pushNotifyText();
}
function t(k, v){
  const L=I18N[LANG] && I18N[LANG].ui;
  let str = (L && L[k]!=null) ? L[k] : I18N.en.ui[k];
  if(str==null){ try{ console.warn('Kakitori: missing text', k); }catch(e){} str=k; }
  if(v) str=str.replace(/\{(\w+)\}/g, (m,n)=> v[n]!=null ? v[n] : m);
  return str;
}
// Plural-aware: picks k.one / k.other (or whatever the language needs) from the count n.
function tn(k, n, v){
  const L=(I18N[LANG] && I18N[LANG].ui) || {};
  let cat=PR ? PR.select(n) : (n===1?'one':'other');
  if(L[k+'.'+cat]==null && I18N.en.ui[k+'.'+cat]==null) cat='other';
  return t(k+'.'+cat, Object.assign({n}, v||{}));
}

const H2R={'あ':'a','い':'i','う':'u','え':'e','お':'o','か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko','が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go','さ':'sa','し':'shi','す':'su','せ':'se','そ':'so','ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo','た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to','だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do','な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no','は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho','ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo','ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po','ま':'ma','み':'mi','む':'mu','め':'me','も':'mo','や':'ya','ゆ':'yu','よ':'yo','ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro','わ':'wa','を':'wo','ん':'n','ぁ':'a','ぃ':'i','ぅ':'u','ぇ':'e','ぉ':'o'};
function kataToHira(s){ return s.replace(/[\u30A1-\u30F6]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60)); }
function toRomaji(str){
  const s=kataToHira(str); const syl=[];
  for(let i=0;i<s.length;i++){
    const c=s[i], n=s[i+1];
    if(c==='っ'){ syl.push('*'); continue; }
    if(c==='ー'){ syl.push('-'); continue; }
    let r=H2R[c];
    if(r===undefined){ syl.push(c); continue; }
    if(n && 'ゃゅょ'.includes(n) && r.length>1 && r.endsWith('i')){
      const v={'ゃ':'a','ゅ':'u','ょ':'o'}[n]; const b=r.slice(0,-1);
      r=(b==='sh'||b==='ch'||b==='j')? b+v : b+'y'+v; i++;
    }
    syl.push(r);
  }
  let out='';
  for(let i=0;i<syl.length;i++){
    if(syl[i]==='*'){ const nx=syl[i+1]||''; out += nx.startsWith('ch') ? 't' : (/^[a-z]/.test(nx) ? nx[0] : ''); }
    else out+=syl[i];
  }
  return out;
}
const R2H=(()=>{
  const m={}; const V='aiueo';
  const B={'':'あいうえお',k:'かきくけこ',g:'がぎぐげご',s:'さしすせそ',z:'ざじずぜぞ',t:'たちつてと',d:'だぢづでど',n:'なにぬねの',h:'はひふへほ',b:'ばびぶべぼ',p:'ぱぴぷぺぽ',m:'まみむめも',r:'らりるれろ'};
  for(const c in B) for(let i=0;i<5;i++) m[c+V[i]]=B[c][i];
  Object.assign(m,{ya:'や',yu:'ゆ',yo:'よ',wa:'わ',wo:'を',shi:'し',chi:'ち',tsu:'つ',fu:'ふ',ji:'じ',
    sha:'しゃ',shu:'しゅ',sho:'しょ',she:'しぇ',sya:'しゃ',syu:'しゅ',syo:'しょ',cha:'ちゃ',chu:'ちゅ',cho:'ちょ',che:'ちぇ',
    tya:'ちゃ',tyu:'ちゅ',tyo:'ちょ',cya:'ちゃ',cyu:'ちゅ',cyo:'ちょ',ja:'じゃ',ju:'じゅ',jo:'じょ',je:'じぇ',jya:'じゃ',jyu:'じゅ',jyo:'じょ',
    zya:'じゃ',zyu:'じゅ',zyo:'じょ',dya:'ぢゃ',dyu:'ぢゅ',dyo:'ぢょ',
    xa:'ぁ',xi:'ぃ',xu:'ぅ',xe:'ぇ',xo:'ぉ',la:'ぁ',li:'ぃ',lu:'ぅ',le:'ぇ',lo:'ぉ',
    xya:'ゃ',xyu:'ゅ',xyo:'ょ',lya:'ゃ',lyu:'ゅ',lyo:'ょ',xtu:'っ',ltu:'っ',xtsu:'っ',ltsu:'っ'});
  for(const c of ['k','g','n','h','b','p','m','r']){ const i=B[c][1]; m[c+'ya']=i+'ゃ'; m[c+'yu']=i+'ゅ'; m[c+'yo']=i+'ょ'; }
  return m;
})();
function toKana(str){
  const s=str.toLowerCase(); let out='', i=0;
  while(i<s.length){
    const c=s[i], n1=s[i+1];
    if(!/[a-z'\-]/.test(c)){ out+=c; i++; continue; }
    if(c==='-'){ out+='ー'; i++; continue; }
    if(c==="'"){ i++; continue; }
    if(c==='n'){
      if(n1===undefined){ out+='ん'; i++; continue; }
      if(n1==="'"){ out+='ん'; i+=2; continue; }
      if(n1==='n'){ const n2=s[i+2]; out+='ん'; i += (n2!==undefined && 'aiueoy'.includes(n2)) ? 1 : 2; continue; }
      if(!'aiueoy'.includes(n1)){ out+='ん'; i++; continue; }
    }
    if(c===n1 && /[bcdfghjkmpqrstvwxyz]/.test(c)){ out+='っ'; i++; continue; }
    if(c==='t' && n1==='c'){ out+='っ'; i++; continue; }
    let hit=false;
    for(let L=4;L>=1;L--){ const k=s.substr(i,L); if(k.length===L && R2H[k]){ out+=R2H[k]; i+=L; hit=true; break; } }
    if(!hit){ out+=c; i++; }
  }
  return out;
}

const I_ROW={'う':'い','く':'き','ぐ':'ぎ','す':'し','つ':'ち','ぬ':'に','ぶ':'び','む':'み','る':'り'};
const A_ROW={'う':'わ','く':'か','ぐ':'が','す':'さ','つ':'た','ぬ':'な','ぶ':'ば','む':'ま','る':'ら'};
function tePart(last, iku, ta){
  const T=ta?'た':'て', D=ta?'だ':'で';
  if(iku) return 'っ'+T;
  if('うつる'.includes(last)) return 'っ'+T;
  if('むぶぬ'.includes(last)) return 'ん'+D;
  if(last==='く') return 'い'+T;
  if(last==='ぐ') return 'い'+D;
  if(last==='す') return 'し'+T;
  return T;
}
function conjWord(w, type, iku, form, isReading){
  let ms, ns, te, ta;
  if(type==='r'){ const b=w.slice(0,-1); ms=b; ns=b; te=b+'て'; ta=b+'た'; }
  else if(type==='u'){ const b=w.slice(0,-1), l=w.slice(-1); ms=b+I_ROW[l]; ns=b+A_ROW[l]; te=b+tePart(l,iku,false); ta=b+tePart(l,iku,true); }
  else if(type==='s'){ const b=w.slice(0,-2); ms=b+'し'; ns=b+'し'; te=b+'して'; ta=b+'した'; }
  else { if(isReading){ ms='き'; ns='こ'; te='きて'; ta='きた'; } else { const b=w.slice(0,-1); ms=b; ns=b; te=b+'て'; ta=b+'た'; } }
  switch(form){
    case 'dict': return w;
    case 'masu': return ms+'ます';
    case 'mashita': return ms+'ました';
    case 'masen': return ms+'ません';
    case 'masendeshita': return ms+'ませんでした';
    case 'nai': return ns+'ない';
    case 'ta': return ta;
    case 'nakatta': return ns+'なかった';
    case 'te': return te;
    case 'mashou': return ms+'ましょう';
    case 'tai': return ms+'たい';
  }
  return w;
}
function conj(v, form){ return {k:conjWord(v.k, v.t, v.iku, form, v.k===v.r), r:conjWord(v.r, v.t, v.iku, form, true)}; }
function formOk(v, fid){ return !(v.nv && NV_SKIP.includes(fid)); }
function wrongs(v, fid){
  const out=[]; const r=v.r; const c=conj(v,fid).r;
  if(v.t==='u'){
    out.push(conjWord(r,'r',false,fid,true));
    if(fid==='te'||fid==='ta'){
      const b=r.slice(0,-1), l=r.slice(-1);
      ['う','む','く','ぐ','す'].forEach(alt=>{ if(alt!==l) out.push(b+tePart(alt,false,fid==='ta')); });
      if(v.iku) out.push(b+tePart('く',false,fid==='ta'));
    }
    if(r.slice(-1)==='う' && (fid==='nai'||fid==='nakatta')) out.push(r.slice(0,-1)+'あ'+(fid==='nai'?'ない':'なかった'));
  } else if(v.t==='r'){
    out.push(conjWord(r,'u',false,fid,true));
  } else if(v.t==='k'){
    const rest=c.slice(1); ['く','こ','き'].forEach(s=>out.push(s+rest));
  } else {
    const p=r.slice(0,-2); const rest=c.slice(p.length+1); ['さ','す'].forEach(s=>out.push(p+s+rest));
  }
  return [...new Set(out)].filter(x=>x!==c);
}

async function flushRemote(){
  clearTimeout(rTimer); rTimer=null;
  if(!remoteRef) return;
  if(rWriting){ rDirty=true; return; }
  rWriting=true;
  try{ await remoteRef.set({json:JSON.stringify(S), t:S.t}); }
  catch(e){
    const code=e&&e.code;
    if(code==='unavailable' || code==='resource_exhausted'){ setTimeout(queueRemote, 4000+Math.random()*4000); }
    else { remoteRef=null; synced=false; }
  }
  rWriting=false;
  if(rDirty){ rDirty=false; flushRemote(); }
}
async function connectRemote(){
  try{
    if(!window.claude || typeof window.claude.use!=='function') return;
    const [db,user]=await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const ref=db.doc('data/users/'+id+'/progress');
    const snap=await ref.get();
    remoteRef=ref; synced=true;
    let rs=null;
    if(snap.exists){ const d=snap.data()||{}; try{ rs=JSON.parse(d.json); }catch(e){} }
    if(rs){
      const merged=mergeStates(S, rs);
      if(!sameProgress(merged, S)){ S=merged; writeLocal(); resetRuntime(); render(); }
      if(!sameProgress(merged, rs)) flushRemote();
    } else if(S.t>0) flushRemote();
    if(S.set.tab==='progress' || S.set.tab==='settings') render();
  }catch(e){}
}

/* ================= Merging progress from two devices ================= */
function pd(s){ if(!s) return 0; const a=String(s).split('-').map(Number); return (a[0]||0)*10000+(a[1]||0)*100+(a[2]||0); }
function mergeStates(a, b){
  const o=JSON.parse(JSON.stringify(a));
  o.srs={};
  const A=a.srs||{}, B=b.srs||{};
  new Set([...Object.keys(A), ...Object.keys(B)]).forEach(k=>{
    const x=A[k], y=B[k];
    o.srs[k] = !x ? y : !y ? x : (y.n>x.n || (y.n===x.n && y.d>x.d)) ? y : x;
  });
  o.verbs=Math.max(a.verbs||0, b.verbs||0);
  o.forms=Math.max(a.forms||1, b.forms||1);
  const newer=(b.t||0)>(a.t||0)?b:a, older=newer===a?b:a;
  o.recent=Object.assign({}, older.recent||{}, newer.recent||{});
  o.off=(newer.off||[]).slice();
  const da=a.day||{}, dbb=b.day||{};
  if(pd(da.date)===pd(dbb.date)) o.day={date:da.date||'', count:Math.max(da.count||0, dbb.count||0), streak:Math.max(da.streak||0, dbb.streak||0)};
  else o.day=Object.assign({}, pd(da.date)>pd(dbb.date)?da:dbb);
  o.t=Math.max(a.t||0, b.t||0);
  o.set=Object.assign({}, a.set||{});
  return migrate(o);
}
function canon(v){
  if(Array.isArray(v)) return '['+v.map(canon).join(',')+']';
  if(v && typeof v==='object') return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';
  return JSON.stringify(v===undefined?null:v);
}
function progressOf(st){ return {srs:st.srs||{}, verbs:st.verbs||0, forms:st.forms||1, recent:st.recent||{}, off:st.off||[], day:st.day||{}}; }
function sameProgress(a, b){ return canon(progressOf(a))===canon(progressOf(b)); }

const G={kind:'', url:'', token:'', owner:'', repo:'', sha:'', pushed:'', last:0, lastTry:0, status:'', err:'', busy:false, again:false, againFull:false, timer:null};
try{
  const c=JSON.parse(localStorage.getItem(SYNC_LS)||'null');
  if(c && c.kind){ Object.assign(G, {kind:c.kind, url:c.url||'', token:c.token||'', owner:c.owner||'', repo:c.repo||'', last:c.last||0}); }
  else { const g=JSON.parse(localStorage.getItem(OLD_GS_LS)||'null'); if(g && g.url){ G.kind='google'; G.url=g.url; G.last=g.last||0; } }
}catch(e){}
function syncOn(){ return G.kind==='google' ? !!G.url : G.kind==='github' ? !!(G.token && G.owner && G.repo) : false; }
function syncName(){ return G.kind==='github' ? 'GitHub' : 'Google'; }
function syncStore(){
  try{
    if(syncOn()) localStorage.setItem(SYNC_LS, JSON.stringify({kind:G.kind, url:G.url, token:G.token, owner:G.owner, repo:G.repo, last:G.last}));
    else localStorage.removeItem(SYNC_LS);
    localStorage.removeItem(OLD_GS_LS);
  }catch(e){}
}
function syncReset(){ clearTimeout(G.timer); Object.assign(G, {kind:'', url:'', token:'', owner:'', repo:'', sha:'', pushed:'', last:0, status:'', err:'', timer:null}); }
function normScriptUrl(v){
  v=String(v||'').trim().replace(/[?#].*$/,'');
  return /^https:\/\/script\.google\.com\/(?:a\/macros\/[^\/]+|macros)\/s\/[A-Za-z0-9_-]{20,}\/exec$/.test(v) ? v : '';
}
function parseRepo(v){
  v=String(v||'').trim().replace(/^https?:\/\/(www\.)?github\.com\//i,'').replace(/\.git$/i,'').replace(/\/+$/,'');
  let m=v.match(/^([A-Za-z0-9](?:[A-Za-z0-9-]{0,38}))\/([A-Za-z0-9._-]{1,100})$/); if(m) return {owner:m[1], repo:m[2]};
  m=v.match(/^([A-Za-z0-9._-]{1,100})$/); if(m) return {owner:'', repo:m[1]};
  return null;
}
function gsQueue(ms){ if(!syncOn()) return; clearTimeout(G.timer); G.timer=setTimeout(()=>{ G.timer=null; gsync(false); }, ms||4000); }
// ---- Google: a small Apps Script the person deploys in their own account
async function gsCall(body){
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(), 25000);
  let res;
  try{
    res = body
      ? await fetch(G.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body, cache:'no-store', redirect:'follow', signal:ctl.signal})
      : await fetch(G.url+'?r='+Date.now(), {cache:'no-store', redirect:'follow', signal:ctl.signal});
  } catch(e){ throw new Error(ctl.signal.aborted?'timeout':'network'); }
  finally{ clearTimeout(to); }
  if(!res.ok) throw new Error('http');
  let j; try{ j=JSON.parse(await res.text()); }catch(e){ throw new Error('notjson'); }
  if(!j || !j.ok) throw new Error('script:'+((j&&j.error)||'unknown'));
  return j;
}
// ---- GitHub: one file in a private repository, through the contents API
async function ghFetch(path, opt){
  opt=opt||{};
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(), 25000);
  const headers=Object.assign({'Accept':'application/vnd.github+json', 'Authorization':'Bearer '+G.token}, opt.headers||{});
  try{ return await fetch('https://api.github.com'+path, {method:opt.method||'GET', headers, body:opt.body, cache:'no-store', signal:ctl.signal}); }
  catch(e){ throw new Error(ctl.signal.aborted?'timeout':'network'); }
  finally{ clearTimeout(to); }
}
function ghErr(res){
  if((res.status===403 || res.status===429) && res.headers.get('x-ratelimit-remaining')==='0') return new Error('gh:ratelimit');
  return new Error('gh:'+res.status);
}
function ghRepoPath(){ return '/repos/'+encodeURIComponent(G.owner)+'/'+encodeURIComponent(G.repo); }
async function ghGet(){
  const res=await ghFetch(ghRepoPath()+'/contents/'+GH_FILE);
  if(res.status===404){ G.sha=''; return ''; }
  if(!res.ok) throw ghErr(res);
  const j=await res.json();
  if(j.encoding!=='base64' || typeof j.content!=='string') throw new Error('unreadable');
  G.sha=j.sha||'';
  try{ return atob(j.content.replace(/\s+/g,'')); }catch(e){ throw new Error('unreadable'); }
}
async function ghPut(data){
  const body={message:'Update Kakitori progress', content:btoa(data)};
  if(G.sha) body.sha=G.sha;
  const res=await ghFetch(ghRepoPath()+'/contents/'+GH_FILE, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  if(res.status===409 || res.status===422) throw new Error('conflict');
  if(!res.ok) throw ghErr(res);
  const j=await res.json(); G.sha=(j && j.content && j.content.sha) || '';
}
// ---- shared
async function remoteRead(){ if(G.kind==='github') return await ghGet(); const r=await gsCall(null); return r.data||''; }
async function remoteWrite(st){
  const payload=Object.assign(progressOf(st), {t:st.t||Date.now(), v:1});
  const data=await encodeState(payload);
  if(G.kind==='github') await ghPut(data); else await gsCall(JSON.stringify({t:payload.t, data}));
}
function syncErrText(e){
  const m=String(e&&e.message||e), gh=G.kind==='github';
  const repo=(G.owner?G.owner+'/':'')+G.repo, svc=syncName();
  if(m==='network' && !navigator.onLine) return t('err.offline');
  if(m==='timeout') return t('err.timeout', {svc});
  if(m==='conflict') return t('err.conflict');
  if(m==='unreadable') return t('err.unreadable');
  if(gh){
    if(m==='network') return t('err.gh.network');
    if(m==='gh:401') return t('err.gh.401');
    if(m==='gh:ratelimit') return t('err.gh.ratelimit');
    if(m==='gh:403') return t('err.gh.403', {repo});
    if(m==='gh:404') return t('err.gh.404', {repo});
    if(m==='gh:owner') return t('err.gh.owner');
    return t('err.gh.other', {code:m.replace(/^gh:/,'')});
  }
  if(m==='network' || m==='notjson' || m==='http') return t('err.gs.network');
  return t('err.gs.other', {code:m.replace(/^script:/,'')});
}
async function encodeState(obj){
  const raw=new TextEncoder().encode(JSON.stringify(obj));
  try{ if(typeof CompressionStream==='function') return 'RENSHU1Z:'+b64(await pipe(raw, new CompressionStream('gzip'))); }catch(e){}
  return 'RENSHU1:'+b64(raw);
}
// full=true reads the other phones' progress first. full=false only pushes this phone's changes,
// and on GitHub skips the read when nothing else has written since (the file's sha still matches).
async function gsync(full){
  full = full!==false;
  if(!syncOn()) return false;
  if(G.busy){ G.again=true; if(full) G.againFull=true; return false; }
  clearTimeout(G.timer); G.timer=null;
  if(!full && G.pushed && G.pushed===canon(progressOf(S))) return true;
  G.busy=true; G.lastTry=Date.now(); G.status='busy'; paintSync();
  let ok=false;
  try{
    for(let attempt=0; ; attempt++){
      try{
        if(!full && G.kind==='github' && G.sha){
          await remoteWrite(S);
          G.pushed=canon(progressOf(S));
        } else {
          const data=await remoteRead();
          const remote = data ? await readBackup(data) : null;
          if(data && !remote) throw new Error('unreadable');
          const merged = remote ? mergeStates(S, remote) : S;
          if(remote && !sameProgress(merged, S)){
            S=merged; writeLocal(); queueRemote();
            renderToday(); if(S.set.tab==='progress') render();
          }
          if(!remote || !sameProgress(merged, remote)) await remoteWrite(merged);
          G.pushed=canon(progressOf(merged));
        }
        break;
      } catch(e){
        if(e.message==='conflict' && attempt<2){ full=true; G.sha=''; continue; }
        throw e;
      }
    }
    G.last=Date.now(); G.status='ok'; G.err=''; syncStore(); ok=true;
  } catch(e){ G.status='err'; G.err=syncErrText(e); }
  G.busy=false; paintSync();
  if(G.again){ const f=G.againFull; G.again=false; G.againFull=false; setTimeout(()=>gsync(f), 1500); }
  return ok;
}
function ago(when){
  const sec=Math.round((Date.now()-when)/1000);
  if(sec<45) return t('ago.now');
  const m=Math.round(sec/60); if(m<60) return tn('ago.min', m);
  const h=Math.round(m/60); if(h<24) return tn('ago.h', h);
  return tn('ago.day', Math.round(h/24));
}
function syncStateHtml(){
  const svc=syncName();
  if(G.status==='busy') return {cls:'busy', text:t('sync.busy', {svc})};
  if(G.status==='err') return {cls:'err', text:G.err};
  return {cls:'ok', text: G.last ? t('sync.ok', {svc, ago:ago(G.last)}) : t('sync.connected', {svc})};
}
function paintSync(){
  const el=$('#gs-state'); if(!el) return;
  const st=syncStateHtml(); el.className='gs-state '+st.cls; el.textContent=st.text;
}
setInterval(()=>{ if(S.set.tab==='settings' && G.status==='ok') paintSync(); }, 30000);
const SYNC_SCRIPT = "// Kakitori sync. Keeps your Kakitori progress in your own Google account.\n// Paste this into a new Apps Script project (script.new), then\n// Deploy > New deployment > Web app, Execute as: Me, Who has access: Anyone.\n// Paste the Web app URL (ending in /exec) into Kakitori > Settings > Google sync.\n\nvar CHUNK = 8000; // Script properties hold up to 9 KB per value.\n\nfunction doGet(e) {\n  return handle_(null);\n}\n\nfunction doPost(e) {\n  return handle_(e && e.postData ? e.postData.contents : '');\n}\n\nfunction handle_(body) {\n  var lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    var props = PropertiesService.getScriptProperties();\n    var all = props.getProperties();\n    var oldCount = Number(all.n || 0);\n\n    if (body) {\n      var msg = JSON.parse(body);\n      var data = String(msg.data || '');\n      if (!data) return json_({ ok: false, error: 'empty' });\n      var count = Math.ceil(data.length / CHUNK);\n      var update = { n: String(count), t: String(Number(msg.t) || Date.now()) };\n      for (var i = 0; i < count; i++) update['c' + i] = data.substr(i * CHUNK, CHUNK);\n      props.setProperties(update);\n      for (var j = count; j < oldCount; j++) props.deleteProperty('c' + j);\n      return json_({ ok: true, t: Number(update.t) });\n    }\n\n    var parts = [];\n    for (var k = 0; k < oldCount; k++) parts.push(all['c' + k] || '');\n    return json_({ ok: true, t: Number(all.t || 0), data: parts.join('') });\n  } catch (err) {\n    return json_({ ok: false, error: String(err && err.message || err) });\n  } finally {\n    lock.releaseLock();\n  }\n}\n\nfunction json_(obj) {\n  return ContentService.createTextOutput(JSON.stringify(obj))\n    .setMimeType(ContentService.MimeType.JSON);\n}\n";
async function copyText(text, el){
  let ok=false;
  try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); ok=true; } }catch(e){}
  if(!ok && el){ try{ el.focus(); el.select(); ok=document.execCommand('copy'); }catch(e){} }
  return ok;
}

const IV=[1, 10, 1440, 4320, 10080, 23040, 50400, 129600]; // minutes
function ivLabel(m){ if(m<60) return tn('iv.min', m); if(m<1440) return tn('iv.h', Math.round(m/60)); return tn('iv.day', Math.round(m/1440)); }
// Longest gap allowed between reviews, in minutes (0 = no limit). Set in Settings → Review schedule.
const GAP_OPTS=[0,1440,4320,10080,20160,43200];
function capIv(m){ const c=+S.set.maxGap||0; return c ? Math.min(m, c) : m; }
function nextIv(key, g){ const s=S.srs[key]; const b=s?s.b:0; if(g===0) return IV[0]; return capIv(IV[Math.min(IV.length-1, b+g)]); }
function grade(key, g){
  const s=S.srs[key]||{b:0,d:0,n:0,c:0};
  s.n++; if(g>0) s.c++;
  s.b = g===0 ? 0 : Math.min(IV.length-1, s.b+g);
  s.d = Date.now()+capIv(IV[s.b])*60000;
  S.srs[key]=s; tickDay(); save();
}
function tickDay(){
  const t=today();
  if(S.day.date!==t){
    const y=dayStr(new Date(Date.now()-864e5));
    S.day.streak = (S.day.date===y) ? (S.day.streak||0)+1 : 1;
    S.day.date=t; S.day.count=0;
  }
  S.day.count++;
}
function pickKey(keys, avoid, randomFresh){
  const now=Date.now(); let c=keys.filter(k=>k!==avoid); if(!c.length) c=keys;
  const due=[], fresh=[], later=[];
  for(const k of c){ const s=S.srs[k]; if(!s) fresh.push(k); else if(s.d<=now) due.push(k); else later.push(k); }
  if(due.length){ due.sort((a,b)=>S.srs[a].d-S.srs[b].d); return rnd(due.slice(0,3)); }
  if(fresh.length) return randomFresh ? rnd(fresh) : fresh[0];
  later.sort((a,b)=>(S.srs[a].b-S.srs[b].b)||(S.srs[a].d-S.srs[b].d));
  return rnd(later.slice(0,Math.min(4,later.length)));
}
function level(key){ const s=S.srs[key]; if(!s) return 0; if(s.b>=4) return 3; if(s.b>=2) return 2; return 1; }

/* ----- Write ----- */
const N_PTS=24;
const tplCache={};
function tplPts(ch){
  if(tplCache[ch]) return tplCache[ch];
  const mp=document.getElementById('mp');
  const res=STROKES[ch].p.map(d=>{ mp.setAttribute('d',d); const L=mp.getTotalLength(); const pts=[]; for(let i=0;i<N_PTS;i++){ const p=mp.getPointAtLength(L*i/(N_PTS-1)); pts.push([p.x,p.y]); } return pts; });
  tplCache[ch]=res; return res;
}
function resample(pts,n){
  if(pts.length<2) return Array.from({length:n},()=>pts[0].slice());
  const d=[0]; for(let i=1;i<pts.length;i++) d.push(d[i-1]+Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
  const Lt=d[d.length-1]; if(Lt<1e-6) return Array.from({length:n},()=>pts[0].slice());
  const out=[]; let j=0;
  for(let k=0;k<n;k++){ const t=Lt*k/(n-1); while(j<d.length-2 && d[j+1]<t) j++; const sg=(d[j+1]-d[j])||1; const a=Math.min(1,Math.max(0,(t-d[j])/sg)); out.push([pts[j][0]+(pts[j+1][0]-pts[j][0])*a, pts[j][1]+(pts[j+1][1]-pts[j][1])*a]); }
  return out;
}
function normAll(strokes){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  strokes.forEach(s=>s.forEach(([x,y])=>{ x0=Math.min(x0,x); y0=Math.min(y0,y); x1=Math.max(x1,x); y1=Math.max(y1,y); }));
  const w=x1-x0, h=y1-y0, sc=Math.max(w,h,1e-3), cx=x0+w/2, cy=y0+h/2;
  return strokes.map(s=>s.map(([x,y])=>[(x-cx)/sc+.5,(y-cy)/sc+.5]));
}
function sdist(a,b){ let t=0; for(let i=0;i<a.length;i++) t+=Math.hypot(a[i][0]-b[i][0], a[i][1]-b[i][1]); return t/a.length; }
const TH=0.14;
function compareStrokes(user, ch){
  const tpl=tplPts(ch), need=tpl.length;
  if(!user.length) return {pass:false, marks:null, msg:t('cmp.model', {strokes:tn('strokes', need)})};
  if(user.length!==need) return {pass:false, marks:null, msg:t('cmp.count', {strokes:tn('strokes', need), n:user.length})};
  const U=normAll(user.map(s=>resample(s,N_PTS))), T=normAll(tpl);
  const marks=[]; let first=-1, reason='';
  const plen=a=>{ let len=0; for(let k=1;k<a.length;k++) len+=Math.hypot(a[k][0]-a[k-1][0], a[k][1]-a[k-1][1]); return len; };
  for(let i=0;i<need;i++){
    const th = plen(T[i])<0.3 ? TH*1.45 : TH;
    if(sdist(U[i],T[i])<th){ marks.push(true); continue; }
    marks.push(false);
    if(first<0){
      first=i;
      if(sdist(U[i].slice().reverse(),T[i])<TH) reason='dir';
      else { const j=T.findIndex((tt,k)=>k!==i && sdist(U[i],tt)<TH); reason = j>=0 ? 'order:'+j : 'shape'; }
    }
  }
  if(first<0) return {pass:true, marks, msg: need>1 ? t('cmp.allright', {n:need}) : t('cmp.oneright')};
  const n=first+1; let msg;
  if(reason==='dir') msg=t('cmp.dir', {n});
  else if(reason.startsWith('order')) msg=t('cmp.order', {n, m:+reason.split(':')[1]+1});
  else msg=t('cmp.off', {n});
  return {pass:false, marks, msg};
}
function nextWrite(pool){
  const keys=pool.map(it=>'kw:'+it.ch);
  setWrite(pickKey(keys, W.key, false));
}
function setWrite(k){
  W.key=k; W.item=KBY[k.slice(3)]; W.strokes=[]; W.cur=null; W.checked=false; W.marks=null; W.msg=''; W.verdict='';
  W.showHint=false; W.isNew=!S.srs[k]; W.introPlayed=false; W.orderShown=false; W.anim=(W.anim||0)+1; W.suggest=null;
}
function guideOn(){ return S.set.trace || W.isNew; }
function renderWrite(stage,pool){

    </div>

    <div class="cell-wrap"><div class="cell" id="cell">

      <button class="tool" data-act="trace" aria-pressed="${S.set.trace}">${esc(t('trace'))}</button>
      <button class="tool" data-act="order">${esc(t('order'))}</button>
    </div>
    <p class="feedback ${W.verdict}" aria-live="polite">${esc(W.msg)}</p>
    <div class="actions">${W.checked
      ? `<button class="btn bad${W.suggest===0?' suggest':''}" data-act="wgrade" data-g="0">${esc(t('missed'))}</button><button class="btn good${W.suggest===1?' suggest':''}" data-act="wgrade" data-g="1">${esc(t('gotit'))}</button>`
      : `<button class="btn primary" data-act="check">${esc(t(W.strokes.length?'check':'showme'))}</button>`}</div>`;
  mountCanvas();
}
function mountCanvas(){
  const cell=$('#cell'), cv=$('#ink'); if(!cell||!cv) return;
  W.cv=cv; W.ctx=cv.getContext('2d');
  const size=()=>{ const r=cell.getBoundingClientRect(); if(!r.width) return; const dpr=window.devicePixelRatio||1; cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); W.sc=cv.width/109; drawInk(); };
  size();
  W.ro=new ResizeObserver(size); W.ro.observe(cell);
  cv.addEventListener('pointerdown', pDown);
  cv.addEventListener('pointermove', pMove);
  cv.addEventListener('pointerup', pUp);
  cv.addEventListener('pointercancel', pUp);
  cv.addEventListener('contextmenu', e=>e.preventDefault());
  renderGuide();
  if(W.checked) renderAnswer();
  else if(W.isNew && !W.introPlayed){ W.introPlayed=true; playOrder(); }
}
function guidePaths(cls){ const d=STROKES[W.item.ch]; return d.p.map(p=>`<path class="${cls}" d="${p}"/>`).join(''); }
function guideNums(){ const d=STROKES[W.item.ch]; return d.n.map((p,i)=>`<text x="${p[0]}" y="${p[1]}">${i+1}</text>`).join(''); }
function renderGuide(){
  const g=$('#guide'); if(!g) return;
  if(W.checked){ g.innerHTML=''; return; }
  g.innerHTML = guideOn() ? guidePaths('g')+guideNums() : '';
}
function playOrder(){
  const g=W.checked ? $('#answer') : $('#guide'); if(!g||!W.item) return;
  const token=++W.anim; const d=STROKES[W.item.ch];
  g.innerHTML = d.p.map(p=>`<path class="anim" d="${p}"/>`).join('');
  W.orderShown=true;
  const paths=[...g.querySelectorAll('path')];
  const addNum=i=>{ const t=document.createElementNS('http://www.w3.org/2000/svg','text'); t.setAttribute('x',d.n[i][0]); t.setAttribute('y',d.n[i][1]); t.textContent=i+1; g.appendChild(t); };
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ paths.forEach((p,i)=>addNum(i)); return; }
  paths.forEach(p=>{ const L=p.getTotalLength(); p.style.strokeDasharray=L; p.style.strokeDashoffset=L; });
  let t=200;
  paths.forEach((p,i)=>{
    const L=p.getTotalLength(); const dur=Math.max(380, L*9);
    setTimeout(()=>{ if(token!==W.anim) return; p.style.transition=`stroke-dashoffset ${dur}ms ease-in-out`; p.style.strokeDashoffset='0'; addNum(i); }, t);
    t+=dur+200;
  });
}
function renderAnswer(){
  const a=$('#answer'); if(!a) return;
  const d=STROKES[W.item.ch];
  a.innerHTML = d.p.map(p=>`<path d="${p}"/>`).join('') + d.n.map((p,i)=>`<text x="${p[0]}" y="${p[1]}">${i+1}</text>`).join('');
}
function evPt(e){ const r=W.cv.getBoundingClientRect(); return [(e.clientX-r.left)*109/r.width, (e.clientY-r.top)*109/r.height]; }
function pDown(e){
  if(W.checked || W.cur) return;
  if(e.pointerType==='mouse' && e.button!==0) return;
  e.preventDefault();
  try{ W.cv.setPointerCapture(e.pointerId); }catch(_){}
  W.pid=e.pointerId; W.cur=[evPt(e)]; W.strokes.push(W.cur);
  if(W.orderShown && !guideOn()){ W.anim++; W.orderShown=false; $('#guide').innerHTML=''; }
  else if(W.orderShown){ W.anim++; W.orderShown=false; renderGuide(); }
  drawInk();
  const btn=$('[data-act="check"]'); if(btn) btn.textContent=t('check');
}
function pMove(e){
  if(!W.cur || e.pointerId!==W.pid) return;
  e.preventDefault();
  const evs=(e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
  evs.forEach(ev=>W.cur.push(evPt(ev)));
  drawInk();
}
function pUp(e){ if(!W.cur || e.pointerId!==W.pid) return; W.cur=null; W.pid=null; drawInk(); }
function drawInk(){
  if(!W.ctx||!W.sc) return;
  const c=W.ctx, s=W.sc; c.clearRect(0,0,W.cv.width,W.cv.height);
  const cs=getComputedStyle(document.documentElement);
  const ink=cs.getPropertyValue('--ink').trim(), warn=cs.getPropertyValue('--warn').trim();
  c.lineCap='round'; c.lineJoin='round'; c.lineWidth=4.4*s;
  (W.strokes||[]).forEach((st,i)=>{
    c.strokeStyle=c.fillStyle=(W.marks && W.marks[i]===false)?warn:ink;
    if(st.length===1){ c.beginPath(); c.arc(st[0][0]*s, st[0][1]*s, 2.2*s, 0, Math.PI*2); c.fill(); return; }
    c.beginPath(); c.moveTo(st[0][0]*s, st[0][1]*s);
    for(let j=1;j<st.length-1;j++){ const mx=(st[j][0]+st[j+1][0])/2, my=(st[j][1]+st[j+1][1])/2; c.quadraticCurveTo(st[j][0]*s, st[j][1]*s, mx*s, my*s); }
    const last=st[st.length-1]; c.lineTo(last[0]*s, last[1]*s); c.stroke();
  });
}

/* ----- Quiz ----- */
function makeKanaChoices(it,pool){
  const ok=x=>x.s===it.s && x.ch!==it.ch && x.r!==it.r;
  const same=pool.filter(ok);
  const picks=[];
  const add=x=>{ if(x && !picks.includes(x) && !picks.some(p=>p.r===x.r) && picks.length<3) picks.push(x); };
  shuffle(same.filter(x=>(CONF[it.ch]||'').includes(x.ch))).slice(0,2).forEach(add);
  shuffle(same).forEach(add);
  if(picks.length<3) shuffle(KANA.filter(x=>ok(x) && BASIC_ROWS.includes(x.row))).forEach(add);
  return shuffle([it,...picks]);
}
function nextQuiz(pool){
  clearTimeout(Q.timer);
  const keys=pool.map(it=>'kr:'+it.ch);
  const k=pickKey(keys, Q.key, true);
  Q.key=k; Q.item=KBY[k.slice(3)]; Q.choices=makeKanaChoices(Q.item,pool); Q.picked=null;
}
function renderQuiz(stage,pool){
  if(!Q.item || !pool.includes(Q.item) || !Q.choices) nextQuiz(pool);
  const it=Q.item; const k2r=S.set.dir==='k2r'; const done=Q.picked!=null;
  const prompt = k2r ? ja(it.ch,'glyph') : `<span class="sound-big">${esc(it.r)}</span><span class="in-script">${esc(t(it.s==='h'?'in.h':'in.k'))}</span>`;
  const choices = Q.choices.map((c,i)=>{
    let cls=''; if(done){ if(c===it) cls=' right'; else if(i===Q.picked) cls=' wrong'; }
    return `<button class="choice${cls}" data-act="qpick" data-i="${i}" ${done?'disabled':''}>${k2r?esc(c.r):ja(c.ch)}</button>`;
  }).join('');
  let after='';
  if(done){
    const right=Q.choices[Q.picked]===it;
    after = right ? `<p>${t('quiz.yes',{kana:ja(it.ch), r:esc(it.r)})}</p>` : `<p>${t('quiz.no',{kana:ja(it.ch), r:esc(it.r)})}${esc(t('mn.sep'))}${esc(mnemonic(it))}</p><button class="btn primary wide" data-act="qnext">${esc(t('next'))}</button>`;
  }
  stage.innerHTML = `
    ${seg('dir',[['k2r',t('dir.k2r')],['r2k',t('dir.r2k')]],S.set.dir,'small')}
    <div class="qcard">${prompt}</div>
    <div class="choices">${choices}</div>
    <div class="after" aria-live="polite">${after}</div>`;
}

/* ----- Drill ----- */
function activeForms(){ return FORMS.slice(0,S.forms).filter(f=>!S.off.includes(f.id)); }
function drillKeys(){
  const fs=activeForms(); const keys=[];
  for(let i=0;i<S.verbs;i++) for(const f of fs){ if(formOk(VERBS[i],f.id)) keys.push(`vf:${i}:${f.id}`); }
  return keys;
}
function makeVerbChoices(v,fid){
  const c=conj(v,fid).r; const picks=[];
  const add=x=>{ if(x && x!==c && !picks.includes(x) && picks.length<3) picks.push(x); };
  const wr=shuffle(wrongs(v,fid));
  const near=shuffle(FORMS.slice(0,Math.max(S.forms,4)).filter(f=>f.id!==fid && formOk(v,f.id)).map(f=>conj(v,f.id).r));
  const far=shuffle(FORMS.filter(f=>f.id!==fid && formOk(v,f.id)).map(f=>conj(v,f.id).r));
  add(wr[0]); near.forEach(add); wr.forEach(add); far.forEach(add);
  return shuffle([c,...picks]);
}
function nextDrill(){
  let keys=drillKeys(); if(!keys.length){ D.key=null; return; }
  const newest=FORMS[S.forms-1].id;
  if(!S.off.includes(newest) && Math.random()<0.4){ const nk=keys.filter(k=>k.endsWith(':'+newest)); if(nk.length) keys=nk; }
  const k=pickKey(keys, D.key, true);
  const [,vi,fid]=k.split(':');
  D.key=k; D.vi=+vi; D.fid=fid; D.choices=makeVerbChoices(VERBS[D.vi],fid); D.picked=null; D.done=false; D.ok=null; D.typed='';
}
function unlockStatus(){
  if(S.forms>=FORMS.length) return null;
  const cur=FORMS[S.forms-1], nxt=FORMS[S.forms];
  const rec=(S.recent[cur.id]||[]).slice(-UNLOCK_N);
  const right=rec.reduce((a,b)=>a+b,0);
  return {cur,nxt,rec,right};
}
function maybeUnlock(){
  const u=unlockStatus(); if(!u) return;
  if(u.rec.length>=UNLOCK_N && u.right>=UNLOCK_OK){ S.forms++; save(); toast(t('unlocked',{form:fName(u.nxt)+' '+u.nxt.jp})); }
}
function rule(v,fid){
  const l=v.r.slice(-1), T=v.t;
  const suf={masu:'ます',mashita:'ました',masen:'ません',masendeshita:'ませんでした',mashou:'ましょう',tai:'たい'}[fid];
  if(suf){
    if(T==='r') return t('rule.ru', {ru:J('る'), suf:J(suf)});
    if(T==='u') return t('rule.u.i', {l:J(l), i:J(I_ROW[l]), suf:J(suf)});
    if(T==='s') return t('rule.then', {a:J('する'), b:J('し'), suf:J(suf)});
    return t('rule.then', {a:J('くる'), b:J('き'), suf:J(suf)});
  }
  if(fid==='nai'||fid==='nakatta'){
    const s2=fid==='nai'?'ない':'なかった';
    const tail = fid==='nakatta' ? t('rule.nakatta', {nai:ja('ない'), nakatta:ja('なかった')}) : '';
    if(T==='r') return t('rule.ru', {ru:J('る'), suf:J(s2)})+tail;
    if(T==='u') return t('rule.u.a', {l:J(l), a:J(A_ROW[l]), suf:J(s2)}) + (l==='う' ? t('rule.u.wa', {u:ja('う'), wa:ja('わ'), aa:ja('あ')}) : '');
    if(T==='s') return t('rule.becomes', {a:J('する'), b:J('し'+s2)});
    return t('rule.becomes', {a:J('くる'), b:J('こ'+s2)});
  }
  if(fid==='te'||fid==='ta'){
    const ta=fid==='ta';
    if(T==='r') return t('rule.ru', {ru:J('る'), suf:J(ta?'た':'て')});
    if(T==='s') return t('rule.becomes', {a:J('する'), b:J(ta?'した':'して')});
    if(T==='k') return t('rule.becomes', {a:J('くる'), b:J(ta?'きた':'きて')});
    if(v.iku) return t('rule.iku', {iku:ja('行く'), right:J(ta?'いった':'いって'), wrong:ja(ta?'いいた':'いいて')});
    const grp='うつる'.includes(l)?'うつる':'むぶぬ'.includes(l)?'むぶぬ':l;
    return t('rule.u.te', {ends:[...grp].map(x=>ja(x)).join(' '), te:J(tePart(l,false,ta))});
  }
  return '';
}
function renderDrill(stage){
  if(S.verbs===0){ stage.innerHTML=`<div class="empty"><p class="lead">${esc(t('drill.empty'))}</p><button class="btn primary" data-act="set" data-k="vmode" data-v="learn">${esc(t('drill.golearn'))}</button></div>`; return; }
  if(!D.key || !drillKeys().includes(D.key)) nextDrill();
  const u=unlockStatus();
  const strip = FORMS.slice(0,S.forms).map(f=>`<button class="chip" data-act="formtoggle" data-f="${f.id}" aria-pressed="${!S.off.includes(f.id)}">${esc(fName(f))} ${ja(f.jp)}</button>`).join('')
    + (u?`<button class="chip next" data-act="unlockinfo">${esc(t('drill.next',{form:fName(u.nxt)}))}</button>`:'');
  const unlockNote = u ? `<p class="unlock-note"><span>${esc(t('drill.unlocknote',{next:fName(u.nxt), ok:UNLOCK_OK, n:UNLOCK_N, cur:fName(u.cur)}))}</span><span class="meter" aria-label="${esc(t('drill.meter',{n:u.right}))}">${Array.from({length:UNLOCK_N},(_,i)=>`<i class="${i<u.rec.length && u.rec[i]?'on':''}"></i>`).join('')}</span>${R.unlockAsk?`<button class="btn small ghost" data-act="unlocknow">${esc(t('drill.unlocknow'))}</button>`:''}</p>` : '';
  if(!D.key){ stage.innerHTML=`<div class="strip">${strip}</div>${unlockNote}<div class="empty"><p class="lead">${esc(t('drill.noforms'))}</p></div>`; return; }
  const v=VERBS[D.vi], f=FBY[D.fid], ans=conj(v,D.fid);
  let body='';
  if(!D.done){
    if(S.set.input==='choose'){
      body = `<div class="choices">${D.choices.map((c,i)=>`<button class="choice${c.length>6?' long':''}" data-act="dpick" data-i="${i}">${ja(c)}${S.set.romaji?`<span class="rom">${esc(toRomaji(c))}</span>`:''}</button>`).join('')}</div>`;
    } else {
      body = `<div class="type-row"><input id="ans" data-inp="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="${esc(t('drill.typeph'))}" aria-label="${esc(t('drill.youranswer'))}" value="${esc(D.typed)}"><button class="btn primary" data-act="dcheck">${esc(t('check'))}</button></div><div class="preview" lang="ja" id="preview">${esc(toKana(D.typed))}</div>`;
    }
  } else {
    if(S.set.input==='choose'){
      body = `<div class="choices">${D.choices.map((c,i)=>{ let cls=''; if(c===ans.r) cls=' right'; else if(i===D.picked) cls=' wrong'; return `<button class="choice${cls}${c.length>6?' long':''}" disabled>${ja(c)}${S.set.romaji?`<span class="rom">${esc(toRomaji(c))}</span>`:''}</button>`; }).join('')}</div>`;
    }
    const typedK = toKana(D.typed||'');
    const verdict = D.ok ? esc(t('drill.correct')) : (S.set.input==='type' ? t('drill.wrote',{kana:ja(typedK||t('drill.nothing'))}) : esc(t('drill.notquite')));
    body += `<div class="result ${D.ok?'ok':'off'}">
      <p class="verdict">${verdict}</p>
      <p class="ans-line">${ja(ans.k,'ans-big')} ${ans.k!==ans.r?ja(ans.r):''} ${rom(ans.r)}</p>
      <p class="rule">${rule(v,D.fid)}</p></div>
      <div class="next-row"><button class="btn primary wide" data-act="dnext" id="dnext">${esc(t('next'))}</button></div>`;
  }
  stage.innerHTML = `
    <div class="strip" role="group" aria-label="${esc(t('drill.forms'))}">${strip}</div>

    <div class="bar">${seg('input',[['choose',t('input.choose')],['type',t('input.type')]],S.set.input,'small')}</div>

}
function drillAnswer(ok){
  D.done=true; D.ok=ok;

  const r=S.recent[D.fid]||(S.recent[D.fid]=[]); r.push(ok?1:0); if(r.length>20) r.splice(0,r.length-20);

function drillCheckTyped(){
  const inp=$('#ans'); if(inp) D.typed=inp.value;
  if(!D.typed.trim()) { toast(t('drill.typefirst')); return; }

  const ans=conj(VERBS[D.vi],D.fid);
  D.focusNext=true;
  drillAnswer(a===ans.r || a===ans.k);
}

function verbMatches(v,q){

}
function verbTable(v){

/* ================= Progress ================= */
function renderProgress(v){
  const isToday=S.day.date===today();
  const y=dayStr(new Date(Date.now()-864e5));
  const streak=(isToday||S.day.date===y)?S.day.streak:0;
  const sc=S.set.pscript, pre=S.set.pskill==='w'?'kw:':'kr:';
  let grid=''; let due=0; const counts=[0,0,0,0]; const now=Date.now();
  ROWS.forEach((row,ri)=>{
    const chars=[...(sc==='k'?row.k:row.h)];
    const cols = chars.length===5 ? [1,2,3,4,5] : [1,3,5];
    if(row.id==='ga') grid+='<div class="kgap"></div>';
    chars.forEach((ch,i)=>{
      const it=KBY[ch], lv=level(pre+ch), st=S.srs[pre+ch];
      counts[lv]++; if(st && st.d<=now) due++;
      grid+=`<button class="kc l${lv}" data-act="kopen" data-ch="${ch}" style="grid-column:${cols[i]}" aria-label="${esc(t('prog.cell',{ch, r:it.r, level:lvName(lv)}))}"><span class="kg" lang="ja">${ch}</span>${S.set.romaji?`<span class="kr">${it.r}</span>`:''}</button>`;
    });
  });
  const legend=`<ul class="lv-legend" aria-label="${esc(t('prog.legend',{skill:t(S.set.pskill==='w'?'writing':'reading'), script:t(sc==='k'?'script.k':'script.h')}))}">${[0,1,2,3].map(i=>`<li><i class="sw l${i}" aria-hidden="true"></i>${esc(lvName(i))} <b>${counts[i]}</b></li>`).join('')}</ul>`;
  const forms=FORMS.map((f,i)=>{
    let st;
    if(i>=S.forms) st=t('prog.locked');
    else { const r=S.recent[f.id]||[]; st = r.length ? t('prog.pct',{p:Math.round(100*r.reduce((a,b)=>a+b,0)/r.length), n:r.length}) : t('prog.notyet'); }
    return `<li><span>${esc(fName(f))} ${ja(f.jp)}</span><span class="st">${esc(st)}</span></li>`;
  }).join('');
  const nToday=isToday?S.day.count:0;
  const a=tn('prog.reviews', nToday, {n:`<b>${nToday}</b>`});
  const line = streak>1 ? t('prog.line2',{a, b:tn('prog.streak', streak, {n:`<b>${streak}</b>`})}) : t('prog.line1',{a});
  v.innerHTML = `
    <section class="p-sec"><h2>${esc(t('prog.today'))}</h2>
      <p class="stat-line">${line}</p></section>
    <section class="p-sec"><h2>${esc(t('prog.kana'))}</h2>
      <div class="bar">${seg('pscript',[['h',t('script.h')],['k',t('script.k')]],sc,'small')}${seg('pskill',[['r',t('reading')],['w',t('writing')]],S.set.pskill,'small')}</div>
      ${legend}
      <p class="k-note">${due?tn('prog.due', due, {n:`<b>${due}</b>`})+t('mn.sep'):''}${esc(t('prog.note'))}</p>
      <div class="kgrid">${grid}</div></section>
    <section class="p-sec"><h2>${esc(t('prog.verbs'))}</h2>
      <p class="stat-line">${t('prog.verbsline',{n:`<b>${S.verbs}</b>`, total:VERBS.length})}</p>
      <ul class="fprog">${forms}</ul></section>
`;
}

const reducedMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function statBlock(key,label){
  const s=S.srs[key], lv=level(key);
  let txt;
  if(!s) txt=t('stat.notyet');
  else {
    const m=(s.d-Date.now())/60000;
    txt=tn('stat.seen', s.n, {c:s.c})+t('mn.sep')+(m<=0 ? t('stat.due') : t('stat.next',{iv:ivLabel(Math.max(1,Math.round(m)))}));
  }
  return `<div class="sh-stat"><b>${esc(label)}</b>${s?`<span class="lvchip l${lv}">${esc(lvName(lv))}</span>`:''}<p>${esc(txt)}</p></div>`;
}
function sheetOrder(g, ch){ strokeAnim(g, ch, 'sheetAnim'); }
function strokeAnim(g, ch, key){
  const token=++R[key]; const d=STROKES[ch];
  g.innerHTML=d.p.map(p=>`<path d="${p}"/>`).join('');
  const paths=[...g.querySelectorAll('path')];
  const addNum=i=>{ const t=document.createElementNS('http://www.w3.org/2000/svg','text'); t.setAttribute('x',d.n[i][0]); t.setAttribute('y',d.n[i][1]); t.textContent=i+1; g.appendChild(t); };
  if(reducedMotion()){ paths.forEach((p,i)=>addNum(i)); return; }
  paths.forEach(p=>{ const L=p.getTotalLength(); p.style.strokeDasharray=L; p.style.strokeDashoffset=L; });
  let t=250;

const ROOT=document.documentElement;

function effectiveDark(){ const a=ROOT.getAttribute('data-theme'); return a==='dark' || (a!=='light' && darkMQ.matches); }

function paintThemeChrome(){

  else if(cur!==t){ hostTheme=cur; ROOT.setAttribute('data-theme', t); }

/* ================= Backup ================= */
function b64(bytes){ let s=''; for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(s); }
function unb64(str){ const s=atob(str); const a=new Uint8Array(s.length); for(let i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }
async function pipe(bytes, stream){ const out=new Response(new Blob([bytes]).stream().pipeThrough(stream)); return new Uint8Array(await out.arrayBuffer()); }
async function makeBackup(){
  const raw=new TextEncoder().encode(JSON.stringify(Object.assign({}, S, {set:Object.assign({}, S.set)})));
  try{ if(typeof CompressionStream==='function') return 'RENSHU1Z:'+b64(await pipe(raw, new CompressionStream('gzip'))); }catch(e){}
  return 'RENSHU1:'+b64(raw);
}
async function readBackup(code){
  try{
    code=code.replace(/\s+/g,'');
    let bytes;
    if(code.startsWith('RENSHU1Z:')){ bytes=await pipe(unb64(code.slice(9)), new DecompressionStream('gzip')); }
    else if(code.startsWith('RENSHU1:')){ bytes=unb64(code.slice(8)); }
    else return null;
    const o=JSON.parse(new TextDecoder().decode(bytes));
    return (o && typeof o==='object' && o.srs) ? o : null;
  }catch(e){ return null; }
}

    if(!S.set.rows.includes(it.row)){ const set=new Set(S.set.rows); set.add(it.row); S.set.rows=ROWS.map(r=>r.id).filter(x=>set.has(x)); }
    if(S.set.script!=='b' && S.set.script!==it.s) S.set.script=it.s;
    S.set.tab='kana'; R.rowsOpen=false; Q.item=null;
    if(b.dataset.m==='w'){ S.set.kmode='write'; setWrite('kw:'+it.ch); }
    else { S.set.kmode='cards'; C.key='kr:'+it.ch; C.item=it; C.flipped=false; }
    closeSheet(true); save(); render(); window.scrollTo(0,0);
  },
  reset(){
    if(!R.resetArm){ R.resetArm=true; render(); setTimeout(()=>{ if(R.resetArm){ R.resetArm=false; if(S.set.tab==='progress') render(); } }, 4000); return; }
    R.resetArm=false; const keep=S.set; S=freshState(); S.set=Object.assign(S.set, keep); S.set.tab='settings';
    resetRuntime(); save(); toast(t('start.done')); render();
  }
};
const INP={
  ans(t){ D.typed=t.value; const p=$('#preview'); if(p) p.textContent=toKana(t.value); },
  q(t){ R.query=t.value; R.open=null; $('#vlist').innerHTML=lookList(); }
};
const CHG={
  romaji(el){ S.set.romaji=el.checked; writeLocal(); render(); const c=$('[data-chg="romaji"]'); if(c) c.focus({preventScroll:true}); },
  lang(el){ S.set.lang=el.value||'auto'; applyLang(); writeLocal(); render(); const c=$('#set-lang'); if(c) c.focus({preventScroll:true}); },
  maxgap(el){
    const v=+el.value||0; S.set.maxGap=v;
    if(v){
      const lim=Date.now()+v*60000; let moved=0;
      for(const k in S.srs){ const x=S.srs[k]; if(x && x.d>lim){ x.d=lim; moved++; } }
      toast(t('gap.toast',{label:t('gap.'+v)})+(moved?t('mn.sep')+tn('gap.moved', moved):''));
    } else toast(t('gap.auto'));
    save(); render(); const c=$('#set-gap'); if(c) c.focus({preventScroll:true});
  },
  remon(el){
    if(!HAS_REM) return;
    const tv=(($('#rem-time')||{}).value||'19:00').split(':'); const h=+tv[0]||0, m=+tv[1]||0;
    pushNotifyText();
    let r; try{ r=NATIVE.setReminder(el.checked, h, m); }catch(e){ r='error'; }
    R.remErr='';
    if(r==='scheduled') toast(t('rem.set',{time:fmtTime(h,m)}));
    else if(r==='off') toast(t('rem.off'));
    else if(r==='asking') R.remBusy=true;
    else if(r==='blocked') R.remErr=remBlocked();
    else R.remErr=t('rem.fail');
    render(); const c=$('#rem-on'); if(c && !c.disabled) c.focus({preventScroll:true});
  },
  remtime(el){
    if(!HAS_REM) return;
    const tv=String(el.value||'').split(':'); if(tv.length<2) return;
    const h=+tv[0], m=+tv[1]; if(!Number.isFinite(h) || !Number.isFinite(m)) return;
    const st=remState(); let r; try{ r=NATIVE.setReminder(st.on && !st.blocked, h, m); }catch(e){ r='error'; }
    if(r==='scheduled') toast(t('rem.moved',{time:fmtTime(h,m)}));
  }
};

document.addEventListener('click', e=>{
  const tab=e.target.closest('.tabs button');
  if(tab){ if(S.set.tab!==tab.dataset.tab){ S.set.tab=tab.dataset.tab; R.rowsOpen=false; save(); render(); window.scrollTo(0,0); } return; }
  const b=e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const fn=ACT[b.dataset.act]; if(fn) fn(b,e);
});
document.addEventListener('input', e=>{ const t=e.target; if(t.dataset && t.dataset.inp && INP[t.dataset.inp]) INP[t.dataset.inp](t); });
document.addEventListener('change', e=>{ const t=e.target; if(t.dataset && t.dataset.chg && CHG[t.dataset.chg]) CHG[t.dataset.chg](t); });

applyTheme();
render();
nativeStudyPush();
connectRemote();
if(!S.set.tour) setTimeout(()=>{ if(R.tour==null) openTour(0); }, 350);
if(syncOn()) setTimeout(()=>gsync(true), 800);
try{ if(IS_APP && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
})();
</script>
</body>
</html>
