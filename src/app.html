<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kakitori</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#EDF0EE; --surface:#FAFBFA; --sunk:#E0E5E2; --ink:#1A2130; --ink-2:#465063; --ink-3:#7A8496; --line:#CBD3CF;
  --grid:#79AC96; --grid-faint:#B9D6C9; --guide:#98A2B3;
  --ai:#2B4878; --ai-ink:#FFFFFF; --ai-soft:#DCE4F1;
  --pen:#C1372C; --pen-soft:#F5DDD9; --good:#2D6E44; --good-ink:#FFFFFF; --good-soft:#D8EADC; --warn:#B26A00;
  --lv0-line:#7E8A85; --lv1:#9CB3DD; --lv1-ink:#1A2130; --lv2:#698AC7; --lv2-ink:#1A2130; --lv3:#2B4878; --lv3-ink:#FFFFFF;
  --scrim:rgba(8,12,18,.5);
  --kana:"Klee One","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --ui:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10141B; --surface:#181E28; --sunk:#222A36; --ink:#E6E9EF; --ink-2:#AEB6C4; --ink-3:#7B8495; --line:#2B3442;
    --grid:#4E8471; --grid-faint:#2C4A40; --guide:#5B6577;
    --ai:#93ACE2; --ai-ink:#0E1420; --ai-soft:#223150;
    --pen:#F0796C; --pen-soft:#3A2225; --good:#7DC28F; --good-ink:#0E1A12; --good-soft:#1C3024; --warn:#E3A23B;
    --lv0-line:#56637A; --lv1:#344F81; --lv1-ink:#E6E9EF; --lv2:#5A84D4; --lv2-ink:#0E1420; --lv3:#B8D2FF; --lv3-ink:#0E1420;
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10141B; --surface:#181E28; --sunk:#222A36; --ink:#E6E9EF; --ink-2:#AEB6C4; --ink-3:#7B8495; --line:#2B3442;
  --grid:#4E8471; --grid-faint:#2C4A40; --guide:#5B6577;
  --ai:#93ACE2; --ai-ink:#0E1420; --ai-soft:#223150;
  --pen:#F0796C; --pen-soft:#3A2225; --good:#7DC28F; --good-ink:#0E1A12; --good-soft:#1C3024; --warn:#E3A23B;
  --lv0-line:#56637A; --lv1:#344F81; --lv1-ink:#E6E9EF; --lv2:#5A84D4; --lv2-ink:#0E1420; --lv3:#B8D2FF; --lv3-ink:#0E1420;
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
:root:lang(zh-Hans){--ui:"PingFang SC","Noto Sans SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif}
:root:lang(zh-Hant){--ui:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
:root:lang(hi){--ui:"Noto Sans Devanagari","Kohinoor Devanagari","Nirmala UI","Mangal",system-ui,sans-serif}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.tabs,.kc,.flash{-webkit-touch-callout:none}
@supports (-webkit-touch-callout:none){input,textarea{font-size:16px!important}}
[lang="ja"]{font-family:var(--kana)}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:0 16px calc(88px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 0 8px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand-jp{font-size:22px;font-weight:600}
.brand-en{font-size:14px;color:var(--ink-2)}
.today{font-size:13px;color:var(--ink-2);text-align:right}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:none;padding:6px 0 8px;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--ink-3);min-height:58px;position:relative}
.tab-glyph{font-size:19px;line-height:1.35}
.tabs button[aria-current="page"]{color:var(--ai)}
.tabs button[aria-current="page"] .tab-glyph{font-weight:600}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;background:var(--ai);border-radius:2px}

.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px;max-width:100%}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 12px;font-size:14px;color:var(--ink-2);min-height:36px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 0 0 1px var(--line)}
.seg.modes{display:flex;width:100%}
.seg.modes button{flex:1;font-size:15px}
.seg.small button{font-size:13px;padding:4px 10px;min-height:32px}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:8px 0}
.rows-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:42px;padding:0 12px;display:inline-flex;gap:8px;align-items:center;font-size:14px}
.rows-btn .rows-sum{font-size:17px;letter-spacing:.08em}
.muted{color:var(--ink-2)}
.rows-panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
.rows-panel h3{font-size:13px;font-weight:500;color:var(--ink-2);margin:0 0 6px}
.rowchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.rowchip{min-width:44px;min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:20px}
.rowchip[aria-pressed="true"]{background:var(--ai);color:var(--ai-ink);border-color:var(--ai)}
.presets{display:flex;gap:6px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:16px}
.btn.primary{background:var(--ai);border-color:var(--ai);color:var(--ai-ink)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--good-ink)}
.btn.bad{background:var(--pen-soft);border-color:transparent;color:var(--pen)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ai);padding:0 8px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn.suggest{outline:3px solid var(--ink);outline-offset:2px}

.prompt{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 0}
.pl{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.sound{font-size:44px;line-height:1.05;font-weight:700}
.in-script{font-size:14px;color:var(--ink-2);margin-top:6px}
.pl .in-script{margin-top:0}
.new-tag{display:inline-block;margin-left:6px;padding:0 8px;border-radius:999px;background:var(--pen-soft);color:var(--pen);font-size:12px;font-weight:500}
.hint{margin:4px 0 0;font-size:15px;color:var(--ink-2);max-width:60ch}
.cell-wrap{display:flex;justify-content:center;margin:10px 0 8px}
.cell{position:relative;width:min(100%,max(240px,40vh),360px);aspect-ratio:1/1;background:var(--surface);border:2px solid var(--grid);border-radius:3px}
.cell svg,.cell canvas{position:absolute;inset:0;width:100%;height:100%}
.cell svg{pointer-events:none}
.cell .grid line{stroke:var(--grid-faint);stroke-width:.7;stroke-dasharray:2.4 2.4}
.cell canvas{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:crosshair}
.guide path{fill:none;stroke:var(--guide);stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round;opacity:.42}
.guide path.anim{stroke:var(--ink-3);opacity:.8}
.guide text{fill:var(--ink-3);font-size:7px;font-family:var(--ui)}
.answer path{fill:none;stroke:var(--pen);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.answer text{fill:var(--pen);font-size:8px;font-weight:700;font-family:var(--ui)}
.answer text.flag{font-size:10px}
.tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tool{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;font-size:14px;min-height:38px}
.tool[aria-pressed="true"]{background:var(--ai-soft);border-color:var(--ai);color:var(--ai)}
.tool:disabled{opacity:.4;cursor:default}
.feedback{min-height:1.5em;text-align:center;margin:8px 0;font-size:15px}
.feedback.ok{color:var(--good)}
.feedback.off{color:var(--pen)}
.actions{display:flex;gap:10px}
.actions .btn{flex:1}

.flash{display:block;width:100%;border:0;padding:0;background:none;perspective:1200px;margin-top:12px;text-align:center}
.flash-inner{position:relative;height:min(48vh,330px);transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:6px}
.face.back{transform:rotateY(180deg)}
.face .corner{position:absolute;top:10px;left:14px;font-size:13px;color:var(--ink-3)}
.glyph{font-size:clamp(108px,30vw,156px);line-height:1}
.glyph.sm{font-size:64px}
.sound-big{font-size:40px;font-weight:700;line-height:1.1}
.mn{margin:6px 0 0;color:var(--ink-2);font-size:15px;max-width:34ch}
.other{margin:4px 0 0;font-size:14px;color:var(--ink-3)}
.other [lang="ja"]{font-size:20px;color:var(--ink)}
.tap-note{text-align:center;color:var(--ink-3);font-size:14px;margin:10px 0 0}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.grades .btn{flex-direction:column;gap:0;line-height:1.2;min-height:54px;padding:0 6px}
.grades small{font-size:12px;font-weight:400;opacity:.8}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-height:min(30vh,220px);display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:12px;padding:16px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.choice{min-height:64px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:22px;padding:8px;line-height:1.25}
.choice [lang="ja"]{font-size:24px}
.choice .rom{display:block;font-size:13px}
.choice.long [lang="ja"]{font-size:18px}
.choice.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.choice.wrong{background:var(--pen-soft);border-color:var(--pen);color:var(--pen)}
.choice:disabled{cursor:default}
.after{margin-top:12px;min-height:3em}
.after p{margin:0 0 10px;color:var(--ink-2)}

.vcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-top:12px}
.vk{font-size:40px;font-weight:600;line-height:1.15}
.vr{font-size:17px;color:var(--ink-2);margin-left:8px}
.rom{color:var(--ink-3);font-size:.9em;font-family:var(--ui)}
.vp-mean{color:var(--ink-2);margin-top:2px}
.vp-to{margin-top:14px;padding-top:12px;border-top:1px dashed var(--grid);display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.form-name{font-weight:700;font-size:19px}
.form-jp{font-size:19px;color:var(--ai)}
.form-gloss{width:100%;color:var(--ink-3);font-size:14px}
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 6px;margin:10px -16px 0;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 12px;font-size:13px;white-space:nowrap;min-height:34px;color:var(--ink-2)}
.chip [lang="ja"]{font-size:14px}
.chip[aria-pressed="true"]{background:var(--ai-soft);border-color:var(--ai);color:var(--ai)}
.chip.next{border-style:dashed;color:var(--ink-3);background:transparent}
.unlock-note{font-size:13px;color:var(--ink-2);margin:2px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.meter{display:inline-flex;gap:2px;vertical-align:middle}
.meter i{width:7px;height:7px;border-radius:2px;background:var(--sunk)}
.meter i.on{background:var(--good)}
.type-row{display:flex;gap:8px;margin-top:12px}
.type-row input{flex:1;min-width:0;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:18px;background:var(--surface)}
.preview{min-height:1.7em;font-size:21px;margin-top:6px;color:var(--ai)}
.result{margin-top:12px;padding:12px 16px;border-radius:6px;border-left:4px solid var(--good);background:var(--good-soft)}
.result.off{border-left-color:var(--pen);background:var(--pen-soft)}
.verdict{margin:0;font-weight:700}
.result.ok .verdict{color:var(--good)}
.result.off .verdict{color:var(--pen)}
.ans-line{margin:4px 0 0}
.ans-big{font-size:28px;font-weight:600}
.rule{margin:6px 0 0;font-size:14px;color:var(--ink-2)}
.next-row{margin-top:12px}

.lead{font-size:17px;max-width:46ch}
.empty{padding:28px 4px;display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.learn-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.learn-head p{margin:0;color:var(--ink-2);font-size:14px}
.meaning{font-size:28px;font-weight:700;line-height:1.2}
.gtag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;border:1px solid currentColor;font-family:var(--ui)}
.gtag.r{color:var(--ai)} .gtag.u{color:var(--good)} .gtag.s,.gtag.k{color:var(--pen)}
.ex{margin:6px 0 0;font-size:15px;color:var(--ink-2)}
.ex [lang="ja"]{font-size:20px;color:var(--ink)}
.trap{margin:4px 0 0;font-size:13px;color:var(--pen)}
.batch{list-style:none;padding:0;margin:12px 0}
.batch li{padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:baseline}
.batch .vk{font-size:30px}
.batch .bmeta{font-size:15px}
.batch .bmeta div{color:var(--ink-2)}

.search{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface);margin-top:12px}
.vlist{list-style:none;margin:6px 0 0;padding:0}
.vrow{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:0 12px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 2px}
.vrow .vk-s{font-size:22px;font-weight:600}
.vrow .meta{color:var(--ink-2);font-size:14px;line-height:1.35}
.vrow .meta .r{color:var(--ink)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:middle}
.scroll-x{overflow-x:auto;margin:0 -16px;padding:0 16px}
.ctable{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 14px}
.ctable th,.ctable td{text-align:left;padding:6px 8px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.ctable th{font-weight:500;color:var(--ink-2)}
.ctable td [lang="ja"]{font-size:17px}
.ctable .rom{display:block;font-size:12px}
.ctable.wide td,.ctable.wide th{white-space:nowrap;padding-right:14px}
.ctable.te td:nth-child(-n+2){white-space:nowrap}
details.rules{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;margin-top:12px}
details.rules summary{min-height:48px;display:flex;align-items:center;font-weight:500;cursor:pointer}
details.rules h3{font-size:15px;margin:14px 0 4px}
details.rules p{margin:0 0 8px;font-size:15px;color:var(--ink-2);max-width:62ch}
details.rules .scroll-x{margin:0 -14px;padding:0 14px}

.p-sec{margin-top:20px}
.p-sec h2{font-size:18px;margin:0 0 8px}
.p-sec .bar{margin:0 0 8px}
.stat-line{margin:0;color:var(--ink-2)}
.stat-line b{color:var(--ink);font-size:20px}
.k-note{margin:8px 0 0;font-size:13px;color:var(--ink-2);max-width:52ch}
.kgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px;max-width:420px}
.kc{aspect-ratio:1/1.06;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;border-radius:8px;border:1.5px dashed var(--lv0-line);background:transparent;color:var(--ink-2)}
.kc .kg{font-size:22px;line-height:1.15}
.kc .kr{font-size:12px;line-height:1.1;font-family:var(--ui)}
.kc:active{transform:scale(.95)}
.kc.l1{background:var(--lv1);border:1.5px solid var(--lv1);color:var(--lv1-ink)}
.kc.l2{background:var(--lv2);border:1.5px solid var(--lv2);color:var(--lv2-ink)}
.kc.l3{background:var(--lv3);border:1.5px solid var(--lv3);color:var(--lv3-ink)}
.lv-legend{display:grid;grid-template-columns:repeat(2,max-content);gap:6px 24px;margin:2px 0 0;padding:0;list-style:none;font-size:14px;color:var(--ink-2)}
@media (min-width:480px){.lv-legend{grid-template-columns:repeat(4,max-content)}}
.lv-legend li{display:flex;align-items:center;gap:6px}
.lv-legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.sw{flex:none;width:16px;height:16px;border-radius:4px;border:1.5px dashed var(--lv0-line)}
.sw.l1{background:var(--lv1);border:1.5px solid var(--lv1)} .sw.l2{background:var(--lv2);border:1.5px solid var(--lv2)} .sw.l3{background:var(--lv3);border:1.5px solid var(--lv3)}
.kgap{grid-column:1/-1;height:6px}
.fprog{list-style:none;padding:0;margin:8px 0 0}
.fprog li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.fprog .st{color:var(--ink-2);font-size:14px;white-space:nowrap}
.switch{display:flex;gap:10px;align-items:center;min-height:44px}
.switch input{width:20px;height:20px;accent-color:var(--ai)}
.credit{font-size:13px;color:var(--ink-3);margin:4px 0 0}
.top-r{display:flex;align-items:center;gap:10px}
.gear{flex:none;width:44px;height:44px;margin-right:-8px;border:0;border-radius:50%;background:transparent;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center}
.gear svg{width:22px;height:22px}
.gear[aria-pressed="true"]{background:var(--ai-soft);color:var(--ai)}
.back-btn{display:inline-flex;align-items:center;gap:2px;min-height:44px;margin-left:-8px;padding:0 10px 0 4px;border:0;background:none;color:var(--ai);font-size:16px;font-weight:500}
.back-btn svg{width:22px;height:22px}
.set-title{font-size:20px;font-weight:700}
.set-sec{margin-top:22px}
.set-sec h2{font-size:18px;margin:0 0 6px}
.set-sec p{max-width:60ch}
.set-sec .note{margin:6px 0 0;font-size:14px;color:var(--ink-2)}
.steps{margin:12px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:15px;max-width:60ch}
.steps li::marker{font-weight:700;color:var(--ai)}
.steps a{color:var(--ai);font-weight:500}
.field-row{display:flex;gap:8px;margin-top:12px}
.field-row input{flex:1;min-width:0;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--surface);font-size:15px}
.gs-state{margin:8px 0 0;padding:10px 12px;border-radius:10px;font-size:15px;border-left:4px solid var(--line);background:var(--surface)}
.gs-state.ok{border-left-color:var(--good)}
.gs-state.err{border-left-color:var(--pen);background:var(--pen-soft)}
.gs-state.busy{border-left-color:var(--ai)}
.script-box{height:120px}
.bk{width:100%;min-height:96px;margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);font:13px/1.4 ui-monospace,monospace;color:var(--ink);word-break:break-all;resize:vertical}
.bk-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

.lvchip{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;border:1.5px dashed var(--lv0-line);background:transparent;color:var(--ink);vertical-align:1px;margin-left:6px}
.lvchip.l1{background:var(--lv1);border:1.5px solid var(--lv1);color:var(--lv1-ink)} .lvchip.l2{background:var(--lv2);border:1.5px solid var(--lv2);color:var(--lv2-ink)} .lvchip.l3{background:var(--lv3);border:1.5px solid var(--lv3);color:var(--lv3-ink)}
.sheet-bg{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.sheet-bg.on{opacity:1}
.sheet{width:100%;max-width:560px;max-height:calc(100% - 24px);overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(28px);transition:transform .24s cubic-bezier(.2,.7,.2,1)}
.sheet-bg.on .sheet{transform:none}
.sh-top{display:flex;align-items:center;gap:16px}
.sh-glyph{font-size:84px;line-height:1;min-width:92px;text-align:center}
.sh-rom{font-size:34px;font-weight:700;line-height:1.1}
.sh-meta{font-size:14px;color:var(--ink-2);margin-top:4px}
.sh-other{border:1px solid var(--line);background:var(--paper);border-radius:10px;min-height:36px;padding:0 10px;font-size:14px;color:var(--ink-2);margin-top:6px}
.sh-other [lang="ja"]{font-size:20px;color:var(--ink)}
.sh-close{margin-left:auto;align-self:flex-start;flex:none;width:44px;height:44px;border:0;border-radius:50%;background:var(--sunk);font-size:24px;line-height:1;color:var(--ink-2)}
.sh-mn{margin:12px 0 0;font-size:15px;color:var(--ink-2)}
.sh-mid{display:grid;grid-template-columns:136px 1fr;gap:16px;margin-top:14px;align-items:start}
.sh-cell{position:relative;width:136px;aspect-ratio:1;border:2px solid var(--grid);border-radius:3px;background:var(--paper)}
.sh-cell svg{position:absolute;inset:0;width:100%;height:100%}
.sh-cell .grid line{stroke:var(--grid-faint);stroke-width:.7;stroke-dasharray:2.4 2.4}
.sh-cell .order path{fill:none;stroke:var(--ink);stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round}
.sh-cell .order text{fill:var(--pen);font-size:9px;font-weight:700;font-family:var(--ui)}
.sh-strokes{display:flex;align-items:center;justify-content:space-between;width:136px;margin-top:4px;font-size:14px;color:var(--ink-2)}
.sh-stat{margin-bottom:12px}
.sh-stat p{margin:2px 0 0;font-size:14px;color:var(--ink-2)}
.sh-actions{display:flex;gap:10px;margin-top:14px}
.sh-actions .btn{flex:1;padding:0 10px}
@media (max-width:359px){.sh-mid{grid-template-columns:1fr}}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;min-height:44px}
.sel,.time-in{min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--surface);color:var(--ink);font-size:16px;max-width:100%}
.sel{flex:1 1 220px}
.tour-bg{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));opacity:0;transition:opacity .2s}
.tour-bg.on{opacity:1}
.tour{width:100%;max-width:400px;max-height:100%;overflow:auto;background:var(--surface);border-radius:18px;padding:12px 18px 14px;transform:translateY(14px);transition:transform .24s cubic-bezier(.2,.7,.2,1);touch-action:pan-y}
.tour-bg.on .tour{transform:none}
.tour-top{display:flex;justify-content:space-between;align-items:center;min-height:40px}
.tour-vis{height:176px;display:flex;align-items:center;justify-content:center;gap:16px;background:var(--paper);border-radius:12px;margin:4px 0 14px;overflow:hidden;padding:0 12px}
.tour-step.in{animation:tourIn .22s ease-out}
@keyframes tourIn{from{opacity:0;transform:translateX(var(--tour-dx,12px))}to{opacity:1;transform:none}}
.tour-title{font-size:22px;line-height:1.25;margin:0 0 6px;text-wrap:balance}
.tour-text{margin:0;color:var(--ink-2);font-size:15px;line-height:1.5;min-height:6em}
.tour-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.tour-foot .btn{min-height:44px;white-space:nowrap}
.tour-foot .next{margin-left:auto}
.tour-dots{display:flex;gap:6px}
.tour-dots i{width:7px;height:7px;border-radius:4px;background:var(--line);transition:width .2s}
.tour-dots i.on{width:20px;background:var(--ai)}
.t-cell{position:relative;width:132px;height:132px;flex:none;border:2px solid var(--grid);border-radius:3px;background:var(--surface)}
.t-cell svg{position:absolute;inset:0;width:100%;height:100%}
.t-cell .grid line{stroke:var(--grid-faint);stroke-width:.7;stroke-dasharray:2.4 2.4}
.t-cell .order path{fill:none;stroke:var(--ink);stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round}
.t-cell .order text{fill:var(--pen);font-size:9px;font-weight:700;font-family:var(--ui)}
.t-prompt{display:flex;flex-direction:column;align-items:flex-start}
.t-prompt .sound{font-size:40px}
.t-card{width:104px;height:132px;flex:none;border:1px solid var(--line);border-radius:8px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.t-card .g{font-size:52px;line-height:1}
.t-card .r{font-size:22px;font-weight:700}
.t-grades{display:flex;flex-direction:column;gap:6px;width:112px}
.t-grades span{display:flex;justify-content:space-between;align-items:center;border-radius:8px;padding:5px 9px;font-size:13px;font-weight:500;background:var(--surface);border:1px solid var(--line)}
.t-grades span small{font-weight:400;opacity:.8}
.t-grades .a{background:var(--pen-soft);border-color:transparent;color:var(--pen)}
.t-grades .e{background:var(--good);border-color:var(--good);color:var(--good-ink)}
.t-verbs{display:flex;flex-direction:column;gap:8px;align-items:stretch;width:100%;max-width:300px}
.t-verbs div{display:flex;align-items:baseline;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.t-verbs [lang="ja"]{font-size:20px}
.t-verbs small{font-size:13px;color:var(--ink-2);text-align:right}
.t-verbs .lock{border-style:dashed;color:var(--ink-3)}
.t-prog{display:flex;flex-direction:column;align-items:center;gap:10px}
.t-prog .row{display:grid;grid-template-columns:repeat(4,52px);gap:6px}
.t-prog .kc{min-height:0;height:56px;aspect-ratio:auto;pointer-events:none}
.t-prog .lv-legend{font-size:13px;gap:4px 18px}
.toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;transition:opacity .25s,transform .25s;pointer-events:none;z-index:20;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.measure{position:absolute;width:0;height:0;overflow:hidden;visibility:hidden}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

cess set to Read and write. Click Generate token, then copy the token.","sync.gh.tokenpage":"GitHub's new token page","sync.gh.s3":"Paste your repository and the token here.","sync.gh.repo":"Repository","sync.gh.repoph":"your-username/kakitori-progress","sync.gh.token":"Token","sync.gh.private":"The token stays on this phone. Keep it private, and don't paste it into chats or emails.","sync.gh.other":"Already set up on your other phone? Use the same repository and token. GitHub shows a token only once, so if you didn't keep it, make another one the same way.","sync.gs.title":"Sync with Google","sync.gs.intro":"Your progress goes into a small script in your Google account. Setup takes about five minutes and is easiest on a computer.","sync.gs.labelsnote":"","sync.gs.s1":"Open {link} while signed in to Google. It makes a new Apps Script project.","sync.gs.s2":"Delete the sample code and paste the Kakitori sync script.","sync.gs.scriptaria":"Kakitori sync script","sync.gs.copy":"Copy the script","sync.gs.s3":"Click Deploy, then New deployment. Choose the type Web app. Set Execute as to Me and Who has access to Anyone, then click Deploy.","sync.gs.s4":"Allow access when Google asks. If it says Google hasn't verified this app, click Advanced, then Go to the project. It's your own script.","sync.gs.s5":"Copy the Web app URL, which ends in /exec, and paste it here.","sync.gs.urlaria":"Web app URL","sync.gs.other":"Already set up on another phone? Paste that phone's sync address in step 5.","sync.choose.intro":"Keep your progress the same on your Android phone and iPhone, and safe if you reinstall. Both options are free.","sync.usegh":"Use GitHub","sync.usegs":"Use Google","sync.choose.note":"GitHub saves to a private repository in your account. Google saves through a small script you add to your account.","sync.gh.badrepo":"Enter the repository as your-username/kakitori-progress.","sync.gh.badtoken":"Paste the token from GitHub. It usually starts with github_pat_.","sync.gh oss the shaft and a curl at the bottom.","く":"A beak opening to the right: a cuckoo calling ku.","け":"A post, then a bar with a long tail: a keg with a tap.","こ":"Two short worms lying parallel: a cozy couple.","さ":"Like き with one bar taken away. Sa: subtract a bar.","し":"One long fishhook: she is fishing.","す":"A bar with a loop swinging down the middle: a swing.","せ":"A long bar on two legs, one curving: a settee bench.","そ":"One zigzag stroke ending in a wave: sewing thread.","た":"A t on the left and こ on the right: ta.","ち":"A cross over a backwards 5: a cheerleader, arms out.","つ":"One rolling wave: a tsunami.","て":"A bar curling down: an outstretched hand (te means hand).","と":"A thorn poking into a toe.","な":"A cross plus a knotted loop: a knot in a rope.","に":"A stick beside two short lines: a knee next to こ.","ぬ":"め with a loop at the end: noodles twirled on a fork.","ね":"A stick and a wavy body ending in a curl: a cat's tail (neko).","の":"One swirl, like a no-entry sign drawn in a single stroke.","は":"Like け, but the right side ends in a loop: ha ha, a big belly laugh.","ひ":"A wide grin with a dimple: hee hee.","ふ":"Four scattered strokes: Mount Fuji with clouds around it.","へ":"A single mountain peak: shout hey from the top.","ほ":"は with an extra bar on top: a house with one more floor.","ま":"Two bars and a loop at the bottom: mama holding a baby.","み":"A loop with a trailing tail, crossed by a slash: a music note, mi.","む":"A cross, a loop and a dot: a cow's head going moo.","め":"Crossed strokes forming an eye (me means eye).","も":"A fishhook with two bars: catch more fish.","や":"A curved horn, a dot and a long slash: a yak's horn.","ゆ":"A loop with a line running through it: a fish swimming in a U.","よ":"A yo-yo hanging from a short bar.","ら":"A short tick over a curve: a rabbit sitting, one ear up.","り":"Two reeds standing, the right one longer.","る":"ろ with a loop at the end: a road ending in a roundabout.","れ":"Like ね, but the end kicks out instead of curling: a leg kicking.","ろ":"A winding road: る without the loop.","わ":"Like ね, but it ends in an open round belly: wa, wide.","を":"A person swinging a bat: whoa!","ん":"A lowercase n with a tail.","ア":"An axe: a hooked blade and a handle.","イ":"A person leaning on a post: an easel.","ウ":"う with a roof: a cap over a box.","エ":"An elevator shaft between two floors.","オ":"A cross with a slash: an oar dipping into water.","カ":"か without the spark: just the karate chop.","キ":"き in straight lines: a key with two bars.","ク":"A hook with a short tick: a cook's ladle.","ケ":"A slanted K shape: ke.","コ":"Two sides of a box: a corner.","サ":"A bar held up by two posts, one curving: a saddle.","シ":"Two dots, then a stroke rising from the bottom left: she smiles. (ツ falls from the top.)","ス":"A bar, then a slash with a kick: a sumo wrestler's stance.","セ":"せ with one leg removed.","ソ":"A dot, then a long stroke falling from the top: a sewing needle. (ン rises from the bottom.)","タ":"ク with a stroke inside: a taco with filling.","チ":"ち straightened out: a cheerleader holding a pole.","ツ":"Two dots, then a long stroke falling from the top right: tsunami spray. (シ rises.)","テ":"Two bars and a drooping stroke: a telephone pole.","ト":"A totem pole with one branch.","ナ":"A cross with a long leaning leg: a knife.","ニ":"Two lines: ni means two.","ヌ":"ス with a slash through it: noodles caught by chopsticks.","ネ":"A dot, a fold and two legs: a nest on a branch.","ノ":"One slash: No!","ハ":"Two strokes spreading apart: ha, a puff of breath.","ヒ":"A bar with a bending line: the heel of a shoe.","フ":"One folded stroke: the top of Mount Fuji.","ヘ":"Same as へ: a mountain peak.","ホ":"A cross with two little legs: a holy cross.","マ":"A fold with a dot: mama's apron pocket.","ミ":"Three lines: mittsu, three.","ム":"A pointed nose with a nostril: a cow, moo.","メ":"An X marks your eye (me).","モ":"Two bars and a hook: more bars than も has curves.","ヤ":"や in straight lines: a yak's horn.","ユ":"A U-turn s f":"Desactivar","sync.offarm":"Toca otra vez para desactivar","sync.gh.title":"Sincronizar con GitHub","sync.gh.intro":"Tu progreso se guarda en un repositorio privado de tu cuenta de GitHub. Se configura en unos tres minutos.","sync.gh.labelsnote":"GitHub está en inglés, así que los nombres de sus botones aparecen en inglés.","sync.gh.s1":"Crea un repositorio privado llamado {name}. Abre {link}, escribe el nombre, elige «Private», marca «Add a README file» y pulsa «Create repository».","sync.gh.s2":"Crea un token que solo pueda acceder a ese repositorio. Abre {link} y llámalo Kakitori. En «Repository access», elige «Only select repositories» y selecciona kakitori-progress. En «Permissions», dale acceso «Contents» con «Read and write». Pulsa «Generate token» y copia el token.","sync.gh.tokenpage":"la página de tokens de GitHub","sync.gh.s3":"Pega aquí tu repositorio y el token.","sync.gh.repo":"Repositorio","sync.gh.repoph":"tu-usuario/kakitori-progress","sync.gh.token":"Token","sync.gh.private":"El token se queda en este teléfono. Mantenlo en privado y no lo pegues en chats ni correos.","sync.gh.other":"¿Ya lo configuraste en tu otro teléfono? Usa el mismo repositorio y token. GitHub solo muestra un token una vez; si no lo guardaste, crea otro igual.","sync.gs.title":"Sincronizar con Google","sync.gs.intro":"Tu progreso se guarda en un pequeño script de tu cuenta de Google. Se configura en unos cinco minutos y es más fácil desde un ordenador.","sync.gs.labelsnote":"Los nombres de los botones pueden variar un poco según el idioma de tu cuenta de Google.","sync.gs.s1":"Abre {link} con tu cuenta de Google. Se crea un proyecto nuevo de Apps Script.","sync.gs.s2":"Borra el código de ejemplo y pega el script de sincronización de Kakitori.","sync.gs.scriptaria":"Script de sincronización de Kakitori","sync.gs.copy":"Copiar el script","sync.gs.s3":"Pulsa Implementar y luego Nueva implementación. Elige el tipo Aplicación web. En «Ejecutar como» pon Yo y en «Quién tiene acceso» pon Cualquier usuario; luego pulsa Implementar.","sync.gs.s4":"Permite el acceso cuando Google lo pida. Si dice que Google no ha verificado esta aplicación, pulsa Configuración avanzada y luego Ir al proyecto. Es tu propio script.","sync.gs.s5":"Copia la URL de la aplicación web, que termina en /exec, y pégala aquí.","sync.gs.urlaria":"URL de la aplicación web","sync.gs.other":"¿Ya lo configuraste en otro teléfono? Pega su dirección de sincronización en el paso 5.","sync.choose.intro":"Mantén tu progreso igual en tu Android y tu iPhone, y a salvo si reinstalas. Las dos opciones son gratis.","sync.usegh":"Usar GitHub","sync.usegs":"Usar Google","sync.choose.note":"GitHub guarda en un repositorio privado de tu cuenta. Google guarda mediante un pequeño script que añades a tu cuenta.","sync.gh.badrepo":"Escribe el repositorio así: tu-usuario/kakitori-progress.","sync.gh.badtoken":"Pega el token de GitHub. Normalmente empieza por github_pat_.","sync.gh.on":"Sincronización con GitHub activada.","sync.gh.onpublic":"Sincronización con GitHub activada. Ese repositorio es público, así que cualquiera puede ver tu progreso. Puedes hacerlo privado en sus ajustes de GitHub.","sync.gs.copied":"Script copiado.","sync.gs.selectscript":"Selecciona el script y cópialo.","sync.gs.devurl":"Esa es una URL de prueba que termina en /dev. Usa la URL de la aplicación web de Implementar, que termina en /exec.","sync.gs.badurl":"Pega la URL de la aplicación web de Apps Script. Empieza por https://script.google.com y termina en /exec.","sync.gs.on":"Sincronización con Google activada.","sync.synced":"Sincronizado.","sync.addrcopied":"Dirección copiada.","sync.addrselect":"Selecciona la dirección de abajo y cópiala.","sync.offtoast":"Sincronización con {svc} desactivada en este teléfono. Tu progreso guardado en {svc} sigue ahí.","err.offline":"No tienes conexión. Kakitori sincronizará cuando vuelvas a estar en línea.","err.timeout":"{svc} tardó demasiado en responder. Kakitori lo volverá a in azo: una cuchara en un yogur. Yo de yogur.","ら":"Un puntito sobre una curva: una rana sentada antes de saltar. Ra de rana.","り":"Dos trazos, el de la derecha más largo: un río que baja junto a su orilla. Ri de río.","る":"Como ろ, pero con un rulo al final. Ru de rulo.","れ":"Un palo y un trazo que se estira hacia fuera: un remo que sale del agua. Re de remo.","ろ":"Como る, pero sin rulo: una roca que baja rodando en zigzag. Ro de roca.","わ":"Un palo y una gran curva abierta: un perro que ladra «¡guau!». Wa de guau.","を":"Tres trazos que se enroscan. Se lee «o» y casi solo se usa como partícula de complemento directo.","ん":"Parece una «n» escrita a mano con colita.","ア":"Un gancho arriba y un palo que cae: un arpón. A de arpón.","イ":"Una ramita inclinada apoyada en un poste. I de inclinada.","ウ":"Como う, pero recta y con techito: la uva, ahora bajo techo.","エ":"Dos barras unidas por un poste: una viga vista de frente. E de edificio.","オ":"Una cruz con una pierna inclinada: alguien que dice «¡oh!» y tropieza.","カ":"Como か, pero sin la chispa: solo el bumerán.","キ":"き en líneas rectas: la llave del quiosco, versión cuadrada.","ク":"Un gancho con una marquita: una cuchara de cocina vista de lado. Ku de cuchara.","ケ":"Una «k» inclinada y sin cerrar: ke.","コ":"Dos lados de una caja abierta: un cofre sin tapa. Ko de cofre.","サ":"Una barra sobre dos palos, uno curvado: un sable apoyado en dos ganchos. Sa de sable.","シ":"Dos puntos a la izquierda y un trazo que sube desde abajo: un guiño y un «shh». En ツ, el trazo largo baja desde arriba.","ス":"Una barra y una diagonal con patadita: alguien que se sube a una silla. Su de subir.","セ":"Como せ, pero con una pata menos.","ソ":"Un puntito y un trazo largo que cae desde arriba: una gota de sopa que resbala. En ン, el trazo largo sube desde abajo.","タ":"Como ク, con un trazo dentro: una taza con su cucharilla. Ta de taza.","チ":"Una barra, y una cruz con pierna: el chico de ち con un bastón. Chi de chico.","ツ":"Tres trazos que caen desde ar "Synchroniser avec GitHub","sync.gh.intro":"Tes progrès vont dans un dépôt privé de ton compte GitHub. La configuration prend environ trois minutes.","sync.gh.labelsnote":"GitHub est en anglais, donc les noms de ses boutons sont indiqués en anglais.","sync.gh.s1":"Crée un dépôt privé nommé {name}. Ouvre {link}, tape le nom, choisis « Private », coche « Add a README file », puis clique sur « Create repository ».","sync.gh.s2":"Crée un jeton qui n'a accès qu'à ce dépôt. Ouvre {link} et nomme-le Kakitori. Sous « Repository access », choisis « Only select repositories » et sélectionne kakitori-progress. Sous « Permissions », donne-lui l'accès « Contents » en « Read and write ». Clique sur « Generate token », puis copie le jeton.","sync.gh.tokenpage":"la page de création de jeton de GitHub","sync.gh.s3":"Colle ici ton dépôt et le jeton.","sync.gh.repo":"Dépôt","sync.gh.repoph":"ton-identifiant/kakitori-progress","sync.gh.token":"Jeton","sync.gh.private":"Le jeton reste sur ce téléphone. Garde-le pour toi et ne le colle jamais dans une discussion ou un e-mail.","sync.gh.other":"Déjà configuré sur ton autre téléphone ? Utilise le même dépôt et le même jeton. GitHub n'affiche un jeton qu'une seule fois : si tu ne l'as pas gardé, crées-en un autre de la même façon.","sync.gs.title":"Synchroniser avec Google","sync.gs.intro":"Tes progrès vont dans un petit script de ton compte Google. La configuration prend environ cinq minutes et se fait plus facilement sur un ordinateur.","sync.gs.labelsnote":"Les noms des boutons peuvent varier un peu selon la langue de ton compte Google.","sync.gs.s1":"Ouvre {link} en étant connecté à Google. Cela crée un nouveau projet Apps Script.","sync.gs.s2":"Supprime le code d'exemple et colle le script de synchronisation Kakitori.","sync.gs.scriptaria":"Script de synchronisation Kakitori","sync.gs.copy":"Copier le script","sync.gs.s3":"Clique sur Déployer, puis sur Nouveau déploiement. Choisis le type Application Web. Règle « Exécuter en tant que » sur Moi et « Qui a accès » sur Tout le monde, puis clique sur Déployer.","sync.gs.s4":"Autorise l'accès quand Google le demande. S'il indique que Google n'a pas validé cette application, clique sur Paramètres avancés, puis sur Accéder au projet. C'est ton propre script.","sync.gs.s5":"Copie l'URL de l'application Web, qui se termine par /exec, et colle-la ici.","sync.gs.urlaria":"URL de l'application Web","sync.gs.other":"Déjà configuré sur un autre téléphone ? Colle l'adresse de synchronisation de ce téléphone à l'étape 5.","sync.choose.intro":"Garde les mêmes progrès sur ton téléphone Android et ton iPhone, et en sécurité si tu réinstalles l'appli. Les deux options sont gratuites.","sync.usegh":"Utiliser GitHub","sync.usegs":"Utiliser Google","sync.choose.note":"GitHub enregistre dans un dépôt privé de ton compte. Google enregistre via un petit script que tu ajoutes à ton compte.","sync.gh.badrepo":"Saisis le dépôt sous la forme ton-identifiant/kakitori-progress.","sync.gh.badtoken":"Colle le jeton de GitHub. Il commence généralement par github_pat_.","sync.gh.on":"La synchronisation GitHub est activée.","sync.gh.onpublic":"La synchronisation GitHub est activée. Ce dépôt est public : tout le monde peut voir tes progrès. Tu peux le rendre privé dans ses réglages GitHub.","sync.gs.copied":"Script copié.","sync.gs.selectscript":"Sélectionne le script et copie-le.","sync.gs.devurl":"C'est une URL de test qui se termine par /dev. Utilise l'URL de l'application Web obtenue avec Déployer, qui se termine par /exec.","sync.gs.badurl":"Colle l'URL de l'application Web d'Apps Script. Elle commence par https://script.google.com et se termine par /exec.","sync.gs.on":"La synchronisation Google est activée.","sync.synced":"Synchronisé.","sync.addrcopied":"Adresse de synchronisation copiée.","sync.addrselect":"Sélectionne l'adresse ci-dessous et copie-la.","sync.offtoast":"La synchronisation {svc} est désactivée sur ce téléphone. Tes progrès enregistrés dans {svc} y restent.","err.offline":"Tu es hors ligne. Kakitori synchronisera quand tu seras de nouveau en ligne.","err.timeout":"{svc} a mis trop de temps à répondre. Kakitori réessaiera bientôt.","err.conflict":"Un autre téléphone enregistrait en même temps. Touche Synchroniser pour réessayer.","err.unreadable":"Impossible de lire les progrès enregistrés. Crée d'abord un code de sauvegarde ci-dessous, puis désactive la synchronisation et configure-la à nouveau.","err.gh.network":"Impossible de joindre GitHub. Vérifie ta connexion et réessaie.","err.gh.401":"GitHub n'a pas accepté le jeton. Il a peut-être expiré, ou une partie a été coupée au moment du collage. Crée un nouveau jeton et colle-le à nouveau.","err.gh.ratelimit":"GitHub a demandé à Kakitori de ralentir. La synchronisation fonctionnera de nouveau d'ici une heure.","err.gh.403":"Le jeton n'a pas le droit de modifier {repo}. Vérifie qu'il a accès à ce dépôt, avec « Contents » réglé sur « Read and write ».","err.gh.404":"Kakitori ne trouve pas {repo}. Vérifie l'orthographe, et que le jeton a bien accès à ce dépôt.","err.gh.owner":"Saisis le dépôt précédé de ton identifiant GitHub, par exemple ton-identifiant/kakitori-progress.","err.gh.other":"GitHub a signalé un problème (erreur {code}). Réessaie dans un instant.","err.gs.network":"Impossible de joindre ton script de synchronisation. Vérifie que « Qui a accès » est réglé sur Tout le monde dans le déploiement, et que tu as copié l'URL de l'application Web qui se termine par /exec.","err.gs.other":"Ton script de synchronisation a signalé un problème ({code}). Essaie de le déployer à nouveau.","backup.title":"Codes de sauvegarde","backup.note":"Un code de sauvegarde contient tous tes progrès sous forme de texte. Utilise-le pour transférer tes progrès entre l'appli pour téléphone et la version Claude, ou garde-en une copie en lieu sûr.","backup.make":"Créer un code de sauvegarde","backup.restore":"Restaurer avec un code","backup.aria":"Code de sauvegarde","backup.making":"Création du code…","backup.copy":"Copier le code","backup.pastearia":"Coller un code de sauvegarde","backup.pasteph":"Colle un code de sauvegarde ici","backup.apply":"Restaurer les progrès","backup.copied":"Code de sauvegarde copié.","backup.select":"Sélectionne le code et copie-le.","backup.pastefirst":"Colle d'abord un code de sauvegarde.","backup.bad":"Ce code n'a pas fonctionné. Copie le code en entier et réessaie.","backup.restored":"Progrès restaurés.","start.title":"Tout recommencer","start.note":"Effacer tous les progrès en kana et en verbes sur cet appareil.","start.notesync":"Effacer tous les progrès en kana et en verbes sur cet appareil. La synchronisation les ramènera, sauf si tu la désactives d'abord.","start.erase":"Effacer tous les progrès","start.arm":"Touche encore pour tout effacer","start.done":"Progrès effacés.","help.title":"Aide","help.tour":"Revoir la visite guidée","about.title":"À propos","about.version":"Kakitori {v}.","about.android":"Kakitori {v} pour Android.","about.ios":"Kakitori {v} pour iPhone.","about.credit":"Données d'ordre des traits : KanjiVG par Ulrich Apel, CC BY-SA 3.0.","about.translations":"Cette traduction et ses aide-mémoire ont été écrits avec l'aide de l'IA et peuvent contenir des erreurs."},"hints":{"あ":"Une croix avec une grande boucle dessous : un arbre aux racines emmêlées. A comme arbre.","い":"Deux traits debout côte à côte : une île avec deux palmiers. I comme île.","う":"Un petit trait au-dessus d'une courbe : l'oreille d'un ours. Se prononce « ou », comme ours.","え":"Un trait, puis un zigzag avec une queue : un escalier qui tourne. É comme escalier.","お":"Comme あ, avec un point qui s'envole : une vague de l'océan qui éclabousse. O comme océan.","か":"Un boomerang avec une étincelle à côté : ka-boum !","き":"Deux barres sur une tige et une boucle en bas : la clé du kiosque. Ki comme kiosque.","く":"Un angle comme « < » : un coude plié. Se prononce « kou », comme coude.","け":"Un poteau et, à côté, une croix à longue queue : un képi accroché au portemanteau. Ké comme képi.","こ":"Deux petits traits l'un au-dessus de l'autre : deux coussins empilés. Ko comme coussin.","さ":"Comme き, avec une barre en moins : un coup de sabre l'a coupée. Sa comme sabre.","し":"Un seul trait en forme d'hameçon : un pêcheur fait « chut ! » pour ne pas effrayer le poisson. Se prononce « chi ».","す":"Une barre et un trait avec un nœud au milieu : la queue d'une souris. Se prononce « sou », comme souris.","せ":"Une longue barre sur deux pieds, dont un courbé : un séchoir à linge. Sé comme séchoir.","そ":"Un zigzag qui finit en courbe : la fumée du chaudron d'une sorcière. So comme sorcière.","た":"Un « t » et deux petits traits à côté : ta comme tasse.","ち":"Une croix au-dessus d'une courbe, comme un 5 à l'envers : on trinque, « tchin-tchin ! ». Se prononce « tchi ».","つ":"Une seule courbe, comme une vague géante : un tsunami. Tsu comme tsunami.","て":"Une barre qui descend en courbe : l'anse d'une théière. Té comme thé.","と":"Un petit trait posé sur une courbe : un toboggan avec son échelle. To comme toboggan.","な":"Une croix et une boucle nouée : un nageur qui fait des remous. Na comme nager.","に":"Un poteau et deux brindilles : un nid dans les branches. Ni comme nid.","ぬ":"Comme め, avec une boucle à la fin : un nœud. Se prononce « nou », comme nouer.","ね":"Un poteau et un ruban qui finit en boucle : la tige d'un nénuphar. Né comme nénuphar.","の":"Un seul tourbillon : une noria qui tourne. No comme noria.","は":"Un poteau, et une croix avec une boucle dessous : un hamac entre deux arbres. Ha comme hamac (avec un h soufflé).","ひ":"Une large courbe comme un sourire : « hi hi ! ». Hi comme un petit rire.","ふ":"Quatre traits séparés : une fourmi et ses pattes. Se prononce « fou », comme fourmi.","へ":"Un seul sommet, comme une pointe de flèche : « hé ! par ici ! ». Hé comme un appel.","ほ":"Comme は, avec une barre de plus en haut : un hôtel avec un étage de plus. Ho comme hôtel (avec un h soufflé).","ま":"Deux barres traversées par un trait, et une boucle en bas : une marionnette au bout de son fil. Ma comme marionnette.","み":"Une boucle avec une queue, barrée d'un trait : un mime qui jongle. Mi comme mime.","む":"Une croix, une boucle et un petit point : une mouette et son œil. Se prononce « mou », comme mouette.","め":"Deux traits croisés et une boucle : une méduse qui nage. Mé comme méduse.","も":"Un hameçon avec deux barres : un mobile suspendu. Mo comme mobile.","や":"Une courbe, un point et un long trait : un kayak et sa pagaie. Ya comme kayak.","ゆ":"Une boucle traversée par une ligne : deux judokas qui s'agrippent. Se prononce « you », comme youpi !","よ":"Une petite barre et un poteau avec une boucle : quelqu'un en posture de yoga. Yo comme yoga.","ら":"Un petit point sur une courbe : un rat assis, prêt à bondir. Ra comme rat.","り":"Deux traits, celui de droite plus long : une rivière et sa berge. Ri comme rivière.","る":"Comme ろ, avec une petite boucle à la fin : une roue. Se prononce « rou », comme roue.","れ":"Un poteau et un trait qui s'étire vers l'extérieur : quelqu'un qui s'étire au réveil. Ré comme réveil.","ろ":"Comme る, mais sans boucle : un rocher qui dévale en zigzag. Ro comme rocher.","わ":"Un poteau et une grande courbe ouverte : un chien qui aboie « ouaf ! ». Se prononce « oua ».","を":"Trois traits qui s'enroulent. Se lit « o » et s'emploie presque uniquement comme particule du complément d'objet.","ん":"Ressemble à un « n » écrit à la main, avec une petite queue.","ア":"Un crochet en haut et un trait qui tombe : une ancre suspendue. A comme ancre.","イ":"Une brindille inclinée, appuyée contre un poteau. I comme incliné.","ウ":"Comme う, mais droit et avec un petit toit : l'ours, maintenant à l'abri.","エ":"Deux barres reliées par un poteau : une poutre d'échafaudage vue de face. É comme échafaudage.","オ":"Une croix avec une jambe penchée : quelqu'un qui dit « oh ! » et trébuche.","カ":"Comme か, sans l'étincelle : juste le boomerang.","キ":"き en lignes droites : la clé du kiosque, version carrée.","ク":"Un crochet avec une petite marque : le bec d'un coucou. Se prononce « kou », comme coucou.","ケ":"Un « k » penché et ouvert : ké.","コ":"Deux côtés d'une boîte ouverte : un coffre sans couvercle. Ko comme coffre.","サ":"Une barre sur deux poteaux, dont un courbé : un sabre posé sur deux crochets. Sa comme sabre.","シ":"Deux points à gauche et un trait qui monte depuis le bas : un clin d'œil et un « chut ». Dans ツ, le long trait descend depuis le haut.","ス":"Une barre et une diagonale avec un petit coup de pied : la queue de la souris de す, version droite. Se prononce « sou ».","セ":"Comme せ, avec un pied en moins.","ソ":"Un petit point et un long trait qui tombe depuis le haut : une goutte de sauce qui coule. So comme sauce. Dans ン, le long trait monte depuis le bas.","タ":"Comme ク, avec un trait à l'intérieur : une tasse et sa cuillère. Ta comme tasse.","チ":"Une barre, puis une croix avec une jambe : on lève son verre, « tchin ! ». Se prononce « tchi ».","ツ":"Trois traits qui tombent depuis le haut : les gouttes d'un tsunami. Dans シ, le long trait monte.","テ":"Deux barres et un trait qui tombe : une antenne de télé. Té comme télé.","ト":"Un poteau avec une brindille : un plant de tomate sur son tuteur. To comme tomate.","ナ":"Une croix avec une longue jambe penchée : un nageur qui plonge. Na comme nageur.","ニ":"Deux traits : en japonais, « ni » veut dire deux (二).","ヌ":"Comme ス, avec un trait qui l'attache : un nœud. Se prononce « nou », comme nouer.","ネ":"Un petit point, un pli et deux jambes : un bonhomme de neige qui marche. Né comme neige.","ノ":"Un seul trait qui barre tout : non ! No comme non.","ハ":"Deux traits qui s'écartent : le souffle quand on dit « ha ! ».","ヒ":"Une barre et un trait coudé : le perchoir d'un hibou. Hi comme hibou.","フ":"Un seul trait coudé : un foulard qui flotte au vent. Se prononce « fou », comme foulard.","ヘ":"Comme へ : un seul sommet.","ホ":"Une croix avec deux petites pattes : un sapin, et le père Noël qui fait « ho ho ho ! ».","マ":"Un pli et un petit point : la tête d'un marteau. Ma comme marteau.","ミ":"Trois traits penchés : vient de 三, trois.","ム":"Un triangle ouvert et un petit point : une mouche sur un toit. Se prononce « mou », comme mouche.","メ":"Un X : les deux rubans croisés d'une médaille. Mé comme médaille.","モ":"Deux barres et un crochet : le mobile de も, version droite.","ヤ":"Comme や, mais droit : le kayak et sa pagaie.","ユ":"Un « U » carré couché sur une base : un youyou, un petit canot, posé sur le quai. Se prononce « you ».","ヨ":"Un E à l'envers, comme dans un miroir : une posture de yoga reflétée. Yo comme yoga.","ラ":"Une barre au-dessus de フ : une raquette vue de côté. Ra comme raquette.","リ":"Comme り, mais droite : la rivière et sa berge.","ル":"Deux traits comme des jambes ; celle de droite remonte d'un coup : une roulade. Se prononce « rou ».","レ":"Un trait qui descend puis remonte, comme une coche ✓ : révisé ! Ré comme révisé.","ロ":"Une boîte carrée : un rocher taillé en bloc. Ro comme rocher.","ワ":"Un coin avec un jet qui tombe : le chien aboie « ouaf ! » depuis le toit.","ヲ":"Comme フ, avec une barre en plus. Se lit « o » et ne s'utilise presque jamais en katakana.","ン":"Comme ソ, mais le long trait monte depuis le bas."},"verbs":["manger","boire","aller","venir","faire","voir, regarder","écrire","lire","parler","écouter, demander","acheter","rentrer (chez soi)","se réveiller","dormir, se coucher","rencontrer, retrouver","attendre","comprendre","fabriquer, faire","utiliser","étudier","jouer, s'amuser","entrer","sortir, partir","enseigner, dire","travailler","se reposer, prendre un jour de congé","tenir, avoir (sur soi)","marcher","nager","courir","monter (dans un véhicule)","descendre (d'un véhicule)","ouvrir (quelque chose)","fermer (quelque chose)","commencer (quelque chose)","finir, se terminer","dire","penser","appeler","mourir","oublier","mémoriser, retenir","porter, mettre (sur le corps)","couper","laver","chanter","apprendre (auprès de quelqu'un)","habi set.lang.auto":"Automatisch ({name})","set.theme":"Design","theme.auto":"Auto","theme.light":"Hell","theme.dark":"Dunkel","set.themenote":"Auto folgt der Hell- oder Dunkel-Einstellung deines Geräts.","set.romaji":"Romaji neben dem Japanischen anzeigen","set.review":"Wiederholungsplan","set.reviewnote":"Kakitori zieht die Abstände auseinander, je öfter du richtig liegst: 10 Minuten, dann 1 Tag, 3 Tage, eine Woche und länger. Leg eine Grenze fest, wenn du alles öfter sehen willst.","set.gaplabel":"Jedes Kana und Verb spätestens wieder zeigen","gap.0":"Automatisch (bis zu 3 Monate)","gap.1440":"Jeden Tag","gap.4320":"Alle 3 Tage","gap.10080":"Jede Woche","gap.20160":"Alle 2 Wochen","gap.43200":"Jeden Monat","gap.toast":"Längster Abstand: {label}.","gap.moved.one":"1 Wiederholung vorgezogen.","gap.moved.other":"{n} Wiederholungen vorgezogen.","gap.auto":"Kakitori verteilt die Wiederholungen selbst.","rem.title":"Erinnerungen","rem.toggle":"Jeden Tag ans Üben erinnern","rem.time":"Uhrzeit","rem.note":"An Tagen, an denen du schon geübt hast, lässt Kakitori die Erinnerung aus, und sie sagt dir, wie viele Wiederholungen warten.","rem.blocked":"Mitteilungen sind für Kakitori ausgeschaltet. Schalte sie in den Einstellungen deines Handys ein und aktiviere dann die Erinnerung erneut.","rem.opensettings":"Mitteilungseinstellungen öffnen","rem.test":"Testmitteilung senden","rem.ios":"Web-Apps auf dem iPhone können keine eigenen Mitteilungen planen. Für einen täglichen Anstoß sag zu Siri: „Erinnere mich jeden Tag um 19 Uhr daran, Japanisch zu üben.“ Du kannst auch in der App Erinnerungen eine wiederholte Erinnerung anlegen.","rem.set":"Erinnerung für {time} eingestellt.","rem.moved":"Erinnerung auf {time} verschoben.","rem.off":"Die tägliche Erinnerung ist aus.","rem.fail":"Die Erinnerung konnte nicht eingestellt werden. Versuch es noch einmal.","rem.testsent":"Testmitteilung gesendet.","notif.title":"Zeit zum Üben","notif.one":"1 Wiederholung wartet. Ein paar Minuten halten sie frisch.","notif.many":"{n} Wiederholungen warten. Ein paar Minuten halten sie frisch.","notif.none":"Ein paar Minuten Schreiben halten deine Kana frisch.","notif.channel":"Übungserinnerungen","sync.title":"Sync","sync.claude.on":"Dein Fortschritt wird in deinem Claude-Konto gespeichert und ist überall dabei, wo du Kakitori in Claude öffnest.","sync.claude.off":"Der Fortschritt wird in diesem Browser gespeichert. Öffne Kakitori angemeldet in Claude, um ihn mit deinem Konto zu synchronisieren.","sync.claude.phones":"Die Handy-Apps synchronisieren separat, über GitHub oder Google. Um Fortschritt zwischen ihnen und dieser Version zu übertragen, nutze unten einen Backup-Code.","sync.busy":"Synchronisiere mit {svc}…","sync.ok":"Mit {svc} synchronisiert, {ago}.","sync.connected":"Mit {svc} verbunden.","ago.now":"gerade eben","ago.min.one":"vor {n} Minute","ago.min.other":"vor {n} Minuten","ago.h.one":"vor {n} Stunde","ago.h.other":"vor {n} Stunden","ago.day.one":"vor {n} Tag","ago.day.other":"vor {n} Tagen","sync.gh.where":"Speichert in {repo} auf GitHub. Um ein weiteres Handy zu synchronisieren, richte dort GitHub-Sync mit demselben Repository und Token ein.","sync.gs.where":"Um ein weiteres Handy zu synchronisieren, füge dieselbe Sync-Adresse in dessen Google-Sync-Einstellungen ein. Wer die Adresse kennt, kann deinen Fortschritt sehen und ändern – halte sie also privat.","sync.gs.addr":"Sync-Adresse","sync.now":"Jetzt synchronisieren","sync.copyaddr":"Sync-Adresse kopieren","sync.off":"Ausschalten","sync.offarm":"Zum Ausschalten nochmal tippen","sync.gh.title":"Mit GitHub synchronisieren","sync.gh.intro":"Dein Fortschritt landet in einem privaten Repository in deinem GitHub-Konto. Die Einrichtung dauert etwa drei Minuten.","sync.gh.labelsnote":"GitHub ist auf Englisch, daher stehen die Namen der Schaltflächen hier auf Englisch.","sync.gh.s1":"Erstelle ein privates Repository namens {name}. Öffne {link}, gib den Namen ein, wähle „Private“, setze den Haken bei „Add a README file“ und klicke auf „Create repository“.","sync.gh.s2":"Erstelle ein Token, das nur auf dieses Repository zugreifen darf. Öffne {link} und nenne es Kakitori. Wähle unter „Repository access“ die Option „Only select repositories“ und dann kakitori-progress. Gib ihm unter „Permissions“ für „Contents“ den Zugriff „Read and write“. Klicke auf „Generate token“ und kopiere das Token.","sync.gh.tokenpage":"die Seite für neue Tokens auf GitHub","sync.gh.s3":"Füge hier dein Repository und das Token ein.","sync.gh.repo":"Repository","sync.gh.repoph":"dein-name/kakitori-progress","sync.gh.token":"Token","sync.gh.private":"Das Token bleibt auf diesem Handy. Halte es geheim und füge es nicht in Chats oder E-Mails ein.","sync.gh.other":"Schon auf deinem anderen Handy eingerichtet? Nimm dasselbe Repository und Token. GitHub zeigt ein Token nur einmal an. Falls du es nicht aufbewahrt hast, erstelle auf dieselbe Weise ein neues.","sync.gs.title":"Mit Google synchronisieren","sync.gs.intro":"Dein Fortschritt landet in einem kleinen Skript in deinem Google-Konto. Die Einrichtung dauert etwa fünf Minuten und geht am Computer am leichtesten.","sync.gs.labelsnote":"Die Namen der Schaltflächen können je nach Sprache deines Google-Kontos etwas abweichen.","sync.gs.s1":"Öffne {link}, während du bei Google angemeldet bist. Dabei entsteht ein neues Apps-Script-Projekt.","sync.gs.s2":"Lösche den Beispielcode und füge das Kakitori-Sync-Skript ein.","sync.gs.scriptaria":"Kakitori-Sync-Skript","sync.gs.copy":"Skript kopieren","sync.gs.s3":"Klicke auf Bereitstellen und dann auf Neue Bereitstellung. Wähle den Typ Web-App. Stelle „Ausführen als“ auf Ich und „Zugriff“ auf Jeder, dann klicke auf Bereitstellen.","sync.gs.s4":"Erlaube den Zugriff, wenn Google fragt. Wenn es heißt, Google habe diese App nicht überprüft, klicke auf Erweitert und dann auf den Link zu deinem Projekt. Es ist dein eigenes Skript.","sync.gs.s5":"Kopiere die URL der Web-App, die auf /exec endet, und füge sie hier ein.","sync.gs.urlaria":"Web-App-URL","sync.gs.other":"Schon auf einem anderen Handy eingerichtet? Füge in Schritt 5 die Sync-Adresse dieses Handys ein.","sync.choose.intro":"Halte deinen Fortschritt auf Android-Handy und iPhone gleich und sicher, auch wenn du neu installierst. Beide Optionen sind kostenlos.","sync.usegh":"GitHub nutzen","sync.usegs":"Google nutzen","sync.choose.note":"GitHub speichert in einem privaten Repository in deinem Konto. Google speichert über ein kleines Skript, das du deinem Konto hinzufügst.","sync.gh.badrepo":"Gib das Repository als dein-name/kakitori-progress ein.","sync.gh.badtoken":"Füge das Token von GitHub ein. Es beginnt meist mit github_pat_.","sync.gh.on":"GitHub-Sync ist an.","sync.gh.onpublic":"GitHub-Sync ist an. Dieses Repository ist öffentlich, also kann jeder deinen Fortschritt sehen. In den GitHub-Einstellungen des Repositorys kannst du es privat machen.","sync.gs.copied":"Skript kopiert.","sync.gs.selectscript":"Markiere das Skript und kopiere es.","sync.gs.devurl":"Das ist eine Test-URL, die auf /dev endet. Nimm die Web-App-URL aus Bereitstellen, die auf /exec endet.","sync.gs.badurl":"Füge die Web-App-URL aus Apps Script ein. Sie beginnt mit https://script.google.com und endet auf /exec.","sync.gs.on":"Google-Sync ist an.","sync.synced":"Synchronisiert.","sync.addrcopied":"Sync-Adresse kopiert.","sync.addrselect":"Markiere die Adresse unten und kopiere sie.","sync.offtoast":"{svc}-Sync ist auf diesem Handy aus. Dein in {svc} gespeicherter Fortschritt bleibt dort.","err.offline":"Du bist offline. Kakitori synchronisiert, sobald du wieder online bist.","err.timeout":"{svc} hat zu lange gebraucht. Kakitori versucht es gleich noch einmal.","err.conflict":"Ein anderes Handy hat gleichzeitig gespeichert. Tippe auf Jetzt synchronisieren, um es erneut zu versuchen.","err.unreadable":"Der gespeicherte Fortschritt ließ sich nicht lesen. Erstelle zuerst unten einen Backup-Code, schalte dann den Sync aus und richte ihn neu ein.","err.gh.networ ack mit einem Bogen am Ende: eine Socke auf der Wäscheleine. So wie Socke, mit scharfem s.","た":"Ein „t“ und zwei kleine Striche daneben: ta wie Tasse.","ち":"Ein Kreuz über einem Bogen, wie eine gespiegelte 5: Jemand niest „hatschi!“. Klingt wie „tschi“.","つ":"Ein einziger Bogen wie eine Riesenwelle: ein Tsunami. Klingt wie das deutsche „zu“.","て":"Ein Balken, der im Bogen nach unten läuft: der Henkel einer Teekanne. Te wie Tee.","と":"Ein kurzer Strich, der an einem Bogen lehnt: ein Tor mit Riegel. To wie Tor.","な":"Ein Kreuz und eine geknotete Schlaufe: eine Nadel mit Faden. Na wie Nadel.","に":"Ein Pfosten und zwei Brettchen daneben: ein Regal in einer Nische. Ni wie Nische.","ぬ":"Wie め, aber mit einer Schlaufe am Ende: Nudeln, auf die Gabel gedreht. Nu wie Nudel.","ね":"Ein Pfosten und ein Band, das in einer Schlaufe endet: eine Nelke mit gebogenem Stiel. Ne wie Nelke.","の":"Ein einziger Wirbel: eine Nougatschnecke. No wie Nougat.","は":"Ein Pfosten und ein Kreuz mit einer Schlaufe darunter: ein Boot, am Poller im Hafen festgebunden. Ha wie Hafen.","ひ":"Ein breiter Bogen wie ein Grinsen: Jemand kichert „hihi!“. Klingt wie „hi“.","ふ":"Vier einzelne Striche: Funken, die vom Lagerfeuer fliegen. Fu wie Funken.","へ":"Ein einziger Gipfel wie eine Pfeilspitze: „He, hier lang!“. He wie „He!“.","ほ":"Wie は, mit einem Balken mehr oben: ein Hotel mit einem Stockwerk mehr. Ho wie Hotel.","ま":"Zwei Balken, von einem Strich gekreuzt, und unten eine Schlaufe: eine Marionette an ihren Fäden. Ma wie Marionette.","み":"Eine Schlaufe mit Schwanz, von einem Strich gekreuzt: eine Mieze, die mit dem Schwanz wedelt. Mi wie Mieze.","む":"Ein Kreuz, eine Schlaufe und ein kleiner Punkt: eine Muschel mit einer Perle. Mu wie Muschel.","め":"Zwei gekreuzte Striche und eine Schlaufe: eine Qualle, die durchs Meer schwimmt. Me wie Meer.","も":"Ein Angelhaken mit zwei Balken: ein Mobile, das von der Decke hängt. Mo wie Mobile.","や":"Ein Bogen, ein Punkt und ein langer Strich: eine Jacht mit Segel und Mast. Ja wie Jacht.","ゆ":"Eine Schlaufe, durch die eine Linie läuft: zwei Judokas, die sich packen. Ju wie Judo.","よ":"Ein kurzer Balken und ein Pfosten mit Schlaufe: ein Löffel im Joghurtbecher. Jo wie Joghurt.","ら":"Ein Punkt über einem Bogen: ein Rabe, der auf einem Ast hockt. Ra wie Rabe.","り":"Zwei Striche, der rechte länger: ein Riese neben einem Kind. Ri wie Riese.","る":"Wie ろ, mit einer kleinen Schlaufe am Ende: eine Rutsche mit Kurve. Ru wie Rutsche.","れ":"Ein Pfosten und ein Strich, der nach außen springt: ein Reh, das davonspringt. Re wie Reh.","ろ":"Wie る, aber ohne Schlaufe: ein Roller. Ro wie Roller.","わ":"Ein Pfosten und ein großer offener Bogen: ein Wal, der auftaucht. Wa wie Wal, nur mit englischem w.","を":"Drei Striche, die sich winden. Wird „o“ gelesen und fast nur als Partikel für das direkte Objekt verwendet.","ん":"Sieht aus wie ein handgeschriebenes „n“ mit Schwänzchen.","ア":"Ein Haken oben und ein Strich, der nach unten fällt: eine Angel. A wie Angel.","イ":"Ein schräger Zweig, der an einem Pfosten lehnt: ein Igelstachel. I wie Igel.","ウ":"Wie う, aber kantig und mit Dach: der Uhu, jetzt in seinem Häuschen.","エ":"Zwei Balken, durch einen Pfosten verbunden: ein Eisenträger von vorne. E wie Eisen.","オ":"Ein Kreuz mit einem schrägen Bein: Jemand stolpert und ruft „Oh!“.","カ":"Wie か, ohne den Funken: nur der Bumerang.","キ":"き mit geraden Linien: der Kioskschlüssel, eckige Version.","ク":"Ein Haken mit einem kleinen Strich: ein Stück Kuchen von der Seite. Ku wie Kuchen.","ケ":"Ein schiefes, offenes „k“: ke.","コ":"Zwei Seiten einer offenen Kiste: ein Koffer ohne Deckel. Ko wie Koffer.","サ":"Ein Balken auf zwei Stützen, eine davon gebogen: ein Sägebock. Sa wie Säge, mit scharfem s.","シ":"Zwei Punkte links und ein Strich, der von unten hochsteigt: ein Zwinkern und ein „schhh“. Bei ツ fällt der lange Strich von oben.","ス":"Ein Balken und eine Schräge mit kleinem Kick: die Biene von す, die davonsummt. Su wie summen, mit scharfem s.","セ":"Wie せ, nur mit einem Bein weniger.","ソ":"Ein Punkt und ein langer Strich, der von oben fällt: eine Socke, die von der Leine rutscht. So wie Socke. Bei ン steigt der lange Strich von unten.","タ":"Wie ク, mit einem Strich darin: eine Tasse mit Löffel. Ta wie Tasse.","チ":"Ein Balken, dann ein Kreuz mit Bein: noch einmal „hatschi!“. Klingt wie „tschi“.","ツ":"Drei Striche, die von oben fallen: die Tropfen eines Tsunamis. Klingt wie „zu“. Bei シ steigt der lange Strich.","テ":"Zwei Balken und ein fallender Strich: eine Telefonleitung am Mast. Te wie Telefon.","ト":"Ein Pfosten mit einem Zweig: eine Tomatenpflanze an ihrem Stab. To wie Tomate.","ナ":"Ein Kreuz mit einem langen, schrägen Bein: eine Nadel mit Faden. Na wie Nadel.","ニ":"Zwei Linien: „ni“ heißt auf Japanisch zwei (二).","ヌ":"Wie ス, mit einem Strich, der es zuknotet: ein Knoten in der Nudel. Nu wie Nudel.","ネ":"Ein Punkt, ein Knick und zwei Beine: ein Vogel, der sein Nest baut. Ne wie Nest.","ノ":"Ein einziger Strich, der alles durchstreicht: „No!“ – nein.","ハ":"Zwei Striche, die auseinandergehen: der Atem beim Lachen, „Ha!“.","ヒ":"Ein Balken und ein abgeknickter Strich: eine Hürde beim Hindernislauf. Hi wie Hindernis.","フ":"Ein einziger geknickter Strich: ein Fuß von der Seite. Fu wie Fuß.","ヘ":"Genau wie へ: ein einziger Gipfel.","ホ":"Ein Kreuz mit zwei kleinen Beinen: ein Baum, Holz zum Hacken. Ho wie Holz.","マ":"Ein Knick und ein kleiner Punkt: ein Fähnchen zum Markieren. Ma wie Markierung.","ミ":"Drei schräge Striche: kommt von 三, drei.","ム":"Ein offenes Dreieck mit Punkt: die Muschel von む, eckige Version. Mu wie Muschel.","メ":"Ein X: die Stelle im Meer, wo der Schatz liegt. Me wie Meer.","モ":"Zwei Balken und ein Haken: das Mobile von も, gerade Version.","ヤ":"Wie や, aber gerade: die Jacht mit ihrem Segel.","ユ":"Ein eckiges, liegendes U auf einer Linie: klingt wie das englische Wort „you“, also „ju“.","ヨ":"Ein gespiegeltes E: der Joghurtlöffel von よ, jetzt mit drei Zinken. Jo wie Joghurt.","ラ":"Ein Balken über フ: eine Rakete beim Start, von der Seite gesehen. Ra wie Rakete.","リ":"Wie り, aber gerade: der Riese und das Kind.","ル":"Zwei Striche wie Beine, das rechte biegt nach oben: ein Kind auf der Rutsche. Ru wie Rutsche.","レ":"Ein Strich, der runter- und wieder hochgeht, wie ein Häkchen ✓: Rechnung geprüft! Re wie Rechnung.","ロ":"Ein eckiger Kasten: der Kopf eines Roboters. Ro wie Roboter.","ワ":"Eine Ecke mit einem fallenden Strich: Wasser, das aus der Dachrinne läuft. Wa wie Wasser, nur mit englischem w.","ヲ":"Wie フ, mit einem zusätzlichen Balken. Wird „o“ gelesen und in Katakana fast nie gebraucht.","ン":"Wie ソ, aber der lange Strich steigt von unten hoch."},"verbs":["essen","trinken","gehen","kommen","machen, tun","sehen, anschauen","schreiben","lesen","sprechen","zuhören, fragen","kaufen","nach Hause gehen","aufwachen","schlafen, ins Bett gehen","treffen","warten","verstehen","herstellen, machen","benutzen","lernen, studieren","spielen, sich vergnügen","hineingehen, betreten","hinausgehen, verlassen","unterrichten, sagen","arbeiten","sich ausruhen, freinehmen","halten, haben","zu Fuß gehen","schwimmen","rennen, laufen","einsteigen, fahren (mit)","aussteigen","(etwas) öffnen","(etwas) schließen","(etwas) beginnen","enden, beenden","sagen","denken","rufen","sterben","vergessen","sich merken, auswendig lernen","anziehen (am Körper)","schneiden","waschen","singen","lernen (von jemandem)","wohnen (irgendwo)","sich setzen","aufstehen, stehen","schicken","(ein Foto) machen","sich beeilen","verleihen","ausleihen","ausgehen","nachdenken über","antworten","zeigen","hineintun","kochen","fahren (Auto)","putzen, sauber machen","telefonieren","spazieren gehen","verkaufen","legen, stellen","(Kleidung) ausziehen","drücken, schieben","suchen","ausschalten, löschen","bitten, bestellen","fliegen, springen","auswählen","weinen","nachschlagen, prüfen","entscheiden","müde werden","glauben","helfen","heiraten","da sein (Menschen, Tiere)","können","duschen (eine Dusche nehmen)","gewinnen"]},"hi":{"ui":{"tab.kana":"काना" r.2.text":"\"कार्ड\" और \"क्विज़\" पढ़ने का अभ्यास कराते हैं। हर कार्ड के बाद खुद को अंक दें: \"फिर से\" उसे एक मिनट में वापस लाता है, \"आसान\" उसे कई दिन आगे भेज देता है। \"पंक्तियाँ\" से चुनें कि किन काना का अभ्यास करना है।","tour.3.title":"क्रियाएँ, एक बार में पाँच","tour.3.text":"\"क्रियाएँ\" में \"सीखें\" एक बार में पाँच क्रियाएँ जोड़ता है। \"रूप बनाएँ\" एक-एक रूप का अभ्यास कराता है, और पिछले 12 में से 10 जवाब सही होने पर अगला रूप खुल जाता है।","tour.4.title":"अपनी प्रगति देखें","tour.4.text":"\"प्रगति\" हर काना को इस हिसाब से रंगती है कि आप उसे कितना जानते हैं। स्ट्रोक देखने के लिए किसी पर टैप करें। ऊपर गियर में भाषा, थीम, रोमाजी, सिंक और बैकअप मिलते हैं।","set.display":"डिस्प्ले","set.language":"भाषा","set.lang.auto":"अपने-आप ({name})","set.theme":"थीम","theme.auto":"अपने-आप","theme.light":"लाइट","theme.dark":"डार्क","set.themenote":"\"अपने-आप\" आपके डिवाइस की लाइट या डार्क सेटिंग के हिसाब से चलता है।","set.romaji":"जापानी के साथ रोमाजी दिखाएँ","set.review":"दोहराव का शेड्यूल","set.reviewnote":"जैसे-जैसे आपके जवाब सही होते हैं, Kakitori दोहराव के बीच का समय बढ़ाता है: 10 मिनट, फिर 1 दिन, 3 दिन, एक हफ़्ता और उससे ज़्यादा। अगर आप सब कुछ ज़्यादा बार देखना चाहते हैं, तो एक सीमा तय करें।","set.gaplabel":"हर काना और क्रिया कम से कम इतने समय में वापस आए","gap.0":"Kakitori तय करे (3 महीने तक)","gap.1440":"हर दिन","gap.4320":"हर 3 दिन","gap.10080":"हर हफ़्ते","gap.20160":"हर 2 हफ़्ते","gap.43200":"हर महीने","gap.toast":"ज़्यादा से ज़्यादा: {label}।","gap.moved.one":"{n} दोहराव पहले कर दिया गया।","gap.moved.other":"{n} दोहराव पहले कर दिए गए।","gap.auto":"Kakitori खुद दोहराव का समय तय करेगा।","rem.title":"रिमाइंडर","rem.toggle":"हर दिन अभ्यास की याद दिलाएँ","rem.time":"समय","rem.note":"जिस दिन आप अभ्यास कर चुके हों, उस दिन Kakitori रिमाइंडर नहीं भेजता, और बताता है कि कितने दोहराव बाकी हैं।","rem.blocked":"Kakitori के लिए सूचनाएँ बंद हैं। फ़ोन की सेटिंग्स में उन्हें चालू करें, फिर रिमाइंडर दोबारा चालू करें।","rem.opensettings":"सूचना सेटिंग्स खोलें","rem.test":"टेस्ट सूचना भेजें","rem.ios":"iPhone के वेब ऐप अपनी सूचनाएँ खुद शेड्यूल नहीं कर सकते। रोज़ याद दिलाने के लिए Siri से कहें: \"Remind me every day at 7 PM to practice Japanese.\" आप Reminders (रिमाइंडर) ऐप में दोहराने वाला रिमाइंडर भी बना सकते हैं।","rem.set":"रिमाइंडर {time} के लिए सेट है।","rem.moved":"रिमाइंडर अब {time} पर है।","rem.off":"रोज़ का रिमाइंडर बंद है।","rem.fail":"रिमाइंडर सेट नहीं हो सका। फिर से कोशिश करें।","rem.testsent":"टेस्ट सूचना भेज दी गई।","notif.title":"अभ्यास का समय","notif.one":"1 दोहराव तैयार है। कुछ मिनट का अभ्यास इसे ताज़ा रखेगा।","notif.many":"{n} दोहराव तैयार हैं। कुछ मिनट का अभ्यास इन्हें ताज़ा रखेगा।","notif.none":"कुछ मिनट लिखने से आपके काना ताज़ा रहते हैं।","notif.channel":"अभ्यास रिमाइंडर","sync.title":"सिंक","sync.claude.on":"आपकी प्रगति आपके Claude खाते में सेव होती है, इसलिए Claude में जहाँ भी आप Kakitori खोलें, वह साथ रहती है।","sync.claude.off":"प्रगति इस ब्राउज़र में सेव है। इसे अपने खाते से सिंक करने के लिए साइन इन करके Claude में Kakitori खोलें।","sync.claude.phones":"फ़ोन ऐप GitHub या Google के ज़रिए अलग से सिंक होते हैं। उनके और इस वर्शन के बीच प्रगति ले जाने के लिए नीचे बैकअप कोड इस्तेमाल करें।","sync.busy":"{svc} से सिंक हो रहा है…","sync.ok":"{svc} से सिंक हुआ, {ago}।","sync.connected":"{svc} से जुड़ा है।","ago.now":"अभी-अभी","ago.min.one":"{n} मिनट पहले","ago.min.other":"{n} मिनट पहले","ago.h.one":"{n} घंटा पहले","ago.h.other":"{n} घंटे पहले","ago.day.one":"{n} दिन पहले","ago.day.other":"{n} दिन पहले","sync.gh.where":"GitHub पर {repo} में सेव हो रहा है। दूसरे फ़ोन को सिंक करने के लिए वहाँ भी इसी रिपॉज़िटरी और टोकन से GitHub सिंक सेट करें।","sync.gs.where":"दूसरे फ़ोन को सिंक करने के लिए उसकी Google सिंक सेटिंग्स में यही सिंक पता पेस्ट करें। जिसके पास यह पता है, वह आपकी प्रगति देख और बदल सकता है, इसलिए इसे निजी रखें।","sync.gs.addr":"सिंक पता","sync.now":"अभी सिंक करें","sync.copyaddr":"सिंक पता कॉपी करें","sync.off":"बंद करें","sync.offarm":"बंद करने के लिए फिर टैप करें","sync.gh.title":"GitHub से सिंक करें","sync.gh.intro":"आ  ते से तेल।","と":"घुमाव पर टिकी छोटी लकीर: डाल पर बैठा तोता। तो से तोता।","な":"एक क्रॉस और बँधा हुआ घेरा: रस्सी से बँधी नाव। ना से नाव।","に":"एक खंभा और दो छोटी टहनियाँ: दीवार पर बना निशान। नि से निशान।","ぬ":"め जैसा, पर आखिर में एक घेरा: काँटे पर लिपटे नूडल्स। नु से नूडल्स।","ね":"एक खंभा और घेरे में खत्म होता फीता: नेवले की मुड़ी हुई पूँछ। ने से नेवला।","の":"एक ही भँवर: गोल लिपटा हुआ नोट। नो से नोट।","は":"एक खंभा, और नीचे घेरे वाला क्रॉस: खूँटे से बँधा हाथी। हा से हाथी।","ひ":"मुस्कान जैसा चौड़ा घुमाव: \"हि-हि!\" वाली हँसी। हि से हि-हि।","ふ":"चार अलग-अलग लकीरें: खिलता हुआ फूल। फ़ु से फूल।","へ":"तीर की नोक जैसी एक ही चोटी: \"हे! इधर देखो!\"। हे से हे!","ほ":"は जैसा, पर ऊपर एक पट्टी ज़्यादा: एक मंज़िल ज़्यादा वाला होटल। हो से होटल।","ま":"एक लकीर से कटी दो पट्टियाँ और नीचे घेरा: रस्सी से लटका मटका। म से मटका।","み":"पूँछ वाला घेरा, एक लकीर से कटा: जलेबी जैसी मिठाई। मि से मिठाई।","む":"एक क्रॉस, एक घेरा और छोटा बिंदु: मुर्गा और उसकी आँख। मु से मुर्गा।","め":"दो कटती लकीरें और एक घेरा: बैठा हुआ मेंढक। मे से मेंढक।","も":"दो पट्टियों वाला मछली का काँटा: मोर की कलगी। मो से मोर।","や":"एक घुमाव, एक बिंदु और लंबी लकीर: पाल और मस्तूल वाला यान। या से यान।","ゆ":"एक घेरा जिसके बीच से लकीर गुज़रती है: एक-दूसरे को पकड़े दो पहलवान, युद्ध में। यु से युद्ध।","よ":"छोटी पट्टी और घेरे वाला खंभा: योग की मुद्रा में बैठा व्यक्ति। यो से योग।","ら":"घुमाव के ऊपर एक बिंदु: मुकुट पहने रानी। रा से रानी।","り":"दो लकीरें, दाईं वाली लंबी: रिक्शे के दो डंडे। रि से रिक्शा।","る":"ろ जैसा, पर आखिर में छोटा घेरा: मुड़ा हुआ रुमाल। रु से रुमाल।","れ":"एक खंभा और बाहर की ओर खिंचती लकीर: पटरी पर दौड़ती रेल। रे से रेल।","ろ":"る जैसा, पर बिना घेरे के: ढलान पर लुढ़कता रोड़ा। रो से रोड़ा।","わ":"एक खंभा और बड़ा खुला घुमाव: तारीफ़ में \"वाह!\"। वा से वाह।","を":"तीन लकीरें जो आपस में लिपटी हैं। इसे \"ओ\" पढ़ते हैं और लगभग हमेशा कर्म बताने वाले कण के रूप में इस्तेमाल करते हैं।","ん":"हाथ से लिखे अंग्रेज़ी \"n\" जैसा, छोटी पूँछ के साथ। आवाज़ न् की।","ア":"ऊपर एक हुक और नीचे गिरती लकीर: हाथी का अंकुश। अ से अंकुश।","イ":"खंभे से टिकी तिरछी टहनी: इमली का पेड़। इ से इमली।","ウ":"う जैसा, पर सीधा और छत के साथ: उल्लू अब घर के अंदर।","エ":"ऊपर-नीचे दो पट्टियाँ, बीच में खंभा: एक मंज़िल वाली इमारत। ए से एक।","オ":"तिरछे पैर वाला क्रॉस: कोई ठोकर खाकर कहता है \"ओह!\"।","カ":"か जैसा, बस चिंगारी के बिना।","キ":"き सीधी लकीरों में: किले की चाबी, चौकोर रूप में।","ク":"एक हुक और छोटा निशान: कुत्ते का मुड़ा कान, सीधी लकीरों में। कु से कुत्ता।","ケ":"झुका हुआ, खुला अंग्रेज़ी \"k\": के।","コ":"खुले डिब्बे की दो दीवारें: कमरे का कोना। को से कोना।","サ":"दो खंभों पर एक पट्टी, एक खंभा मुड़ा: सड़क किनारे लगा बोर्ड। स से सड़क।","シ":"बाईं ओर दो बिंदु और नीचे से ऊपर उठती लकीर: आँख मारकर \"श्श्!\"। ツ में लंबी लकीर ऊपर से नीचे आती है।","ス":"एक पट्टी और छोटी किक वाली तिरछी लकीर: す की सुई, सीधे रूप में। सु से सुई।","セ":"せ जैसा, बस एक पैर कम।","ソ":"एक बिंदु और ऊपर से गिरती लंबी लकीर: पिघले सोने की गिरती बूँद। सो से सोना। ン में लंबी लकीर नीचे से ऊपर जाती है।","タ":"ク जैसा, अंदर एक लकीर: ताले में लगी चाबी। ता से ताला।","チ":"एक पट्टी, फिर पैर वाला क्रॉस: चिड़िया का पंजा। चि से चिड़िया।","ツ":"ऊपर से गिरती तीन लकीरें: सुनामी की बूँदें। इसे \"त्सु\" बोलें। シ में लंबी लकीर ऊपर उठती है।","テ":"दो पट्टियाँ और गिरती लकीर: डिब्बे से टपकता तेल। ते से तेल।","ト":"एक खंभा और उस पर टहनी: डाल पर बैठा तोता। तो से तोता।","ナ":"लंबे तिरछे पैर वाला क्रॉस: नाव की पतवार। ना से नाव।","ニ":"दो लकीरें: जापानी में \"नि\" का मतलब है दो (二)।","ヌ":"ス जैसा, पर एक लकीर उसे बाँधती है: नूडल्स में गाँठ। नु से नूडल्स।","ネ":"एक बिंदु, एक मोड़ और दो पैर: दो पैरों पर खड़ा नेवला। ने से नेवला।","ノ":"सब कुछ काटती एक ही लकीर: नहीं! इसे \"नो\" बोलें, जैसे अंग्रेज़ी का no।","ハ":"अलग होती दो लकीरें: हाथी के दो दाँत। हा से हाथी।","ヒ":"एक पट्टी और मुड़ी हुई लकीर: बैठा हुआ हिरन। हि से हिरन।","フ":"एक ही मुड़ी लकीर: फूल की झुकी पंखुड़ी। फ़ु से फूल।","ヘ":"बिल्कुल へ जैसा: एक ही चोटी।","ホ":"दो छोटे पैरों वाला क्रॉस: पिचकारी लिए खड़ा आदमी, होली खेलता हुआ। हो से होली।","マ":"एक मोड़ और छोटा बिंदु: मटके का मुँह। म से मटका।","ミ":"तीन तिरछी लकीरें: 三 यानी तीन से बना।","ム":"एक खुला त्रिकोण और ब
