<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kakitori</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#EDF0EE; --surface:#FAFBFA; --sunk:#E0E5E2; --ink:#1A2130; --ink-2:#465063; --ink-3:#7A8496; --line:#CBD3CF;
  --grid:#79AC96; --grid-faint:#B9D6C9; --guide:#98A2B3;
  --ai:#2B4878; --ai-ink:#FFFFFF; --ai-soft:#DCE4F1;
  --pen:#C1372C; --pen-soft:#F5DDD9; --good:#2D6E44; --good-ink:#FFFFFF; --good-soft:#D8EADC; --warn:#B26A00;
  --lv0-line:#7E8A85; --lv1:#9CB3DD; --lv1-ink:#1A2130; --lv2:#698AC7; --lv2-ink:#1A2130; --lv3:#2B4878; --lv3-ink:#FFFFFF;
  --scrim:rgba(8,12,18,.5);
  --kana:"Klee One","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --ui:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10141B; --surface:#181E28; --sunk:#222A36; --ink:#E6E9EF; --ink-2:#AEB6C4; --ink-3:#7B8495; --line:#2B3442;
    --grid:#4E8471; --grid-faint:#2C4A40; --guide:#5B6577;
    --ai:#93ACE2; --ai-ink:#0E1420; --ai-soft:#223150;
    --pen:#F0796C; --pen-soft:#3A2225; --good:#7DC28F; --good-ink:#0E1A12; --good-soft:#1C3024; --warn:#E3A23B;
    --lv0-line:#56637A; --lv1:#344F81; --lv1-ink:#E6E9EF; --lv2:#5A84D4; --lv2-ink:#0E1420; --lv3:#B8D2FF; --lv3-ink:#0E1420;
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10141B; --surface:#181E28; --sunk:#222A36; --ink:#E6E9EF; --ink-2:#AEB6C4; --ink-3:#7B8495; --line:#2B3442;
  --grid:#4E8471; --grid-faint:#2C4A40; --guide:#5B6577;
  --ai:#93ACE2; --ai-ink:#0E1420; --ai-soft:#223150;
  --pen:#F0796C; --pen-soft:#3A2225; --good:#7DC28F; --good-ink:#0E1A12; --good-soft:#1C3024; --warn:#E3A23B;
  --lv0-line:#56637A; --lv1:#344F81; --lv1-ink:#E6E9EF; --lv2:#5A84D4; --lv2-ink:#0E1420; --lv3:#B8D2FF; --lv3-ink:#0E1420;
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
:root:lang(zh-Hans){--ui:"PingFang SC","Noto Sans SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif}
:root:lang(zh-Hant){--ui:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
:root:lang(hi){--ui:"Noto Sans Devanagari","Kohinoor Devanagari","Nirmala UI","Mangal",system-ui,sans-serif}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.tabs,.kc,.flash{-webkit-touch-callout:none}
@supports (-webkit-touch-callout:none){input,textarea{font-size:16px!important}}
[lang="ja"]{font-family:var(--kana)}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:0 16px calc(88px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 0 8px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand-jp{font-size:22px;font-weight:600}
.brand-en{font-size:14px;color:var(--ink-2)}
.today{font-size:13px;color:var(--ink-2);text-align:right}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:none;padding:6px 0 8px;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--ink-3);min-height:58px;position:relative}
.tab-glyph{font-size:19px;line-height:1.35}
.tabs button[aria-current="page"]{color:var(--ai)}
.tabs button[aria-current="page"] .tab-glyph{font-weight:600}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;background:var(--ai);border-radius:2px}

.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px;max-width:100%}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 12px;font-size:14px;color:var(--ink-2);min-height:36px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 0 0 1px var(--line)}
.seg.modes{display:flex;width:100%}
.seg.modes button{flex:1;font-size:15px}
.seg.small button{font-size:13px;padding:4px 10px;min-height:32px}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:8px 0}
.rows-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:42px;padding:0 12px;display:inline-flex;gap:8px;align-items:center;font-size:14px}
.rows-btn .rows-sum{font-size:17px;letter-spacing:.08em}
.muted{color:var(--ink-2)}
.rows-panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
.rows-panel h3{font-size:13px;font-weight:500;color:var(--ink-2);margin:0 0 6px}
.rowchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.rowchip{min-width:44px;min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:20px}
.rowchip[aria-pressed="true"]{background:var(--ai);color:var(--ai-ink);border-color:var(--ai)}
.presets{display:flex;gap:6px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:16px}
.btn.primary{background:var(--ai);border-color:var(--ai);color:var(--ai-ink)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--good-ink)}
.btn.bad{background:var(--pen-soft);border-color:transparent;color:var(--pen)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ai);padding:0 8px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn.suggest{outline:3px solid var(--ink);outline-offset:2px}

.prompt{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 0}
.pl{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.sound{font-size:44px;line-height:1.05;font-weight:700}
.in-script{font-size:14px;color:var(--ink-2);margin-top:6px}
.pl .in-script{margin-top:0}
.new-tag{display:inline-block;margin-left:6px;padding:0 8px;border-radius:999px;background:var(--pen-soft);color:var(--pen);font-size:12px;font-weight:500}
.hint{margin:4px 0 0;font-size:15px;color:var(--ink-2);max-width:60ch}
.cell-wrap{display:flex;justify-content:center;margin:10px 0 8px}
.cell{position:relative;width:min(100%,max(240px,40vh),360px);aspect-ratio:1/1;background:var(--surface);border:2px solid var(--grid);border-radius:3px}
.cell svg,.cell canvas{position:absolute;inset:0;width:100%;height:100%}
.cell svg{pointer-events:none}
.cell .grid line{stroke:var(--grid-faint);stroke-width:.7;stroke-dasharray:2.4 2.4}
.cell canvas{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:crosshair}
.guide path{fill:none;stroke:var(--guide);stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round;opacity:.42}
.guide path.anim{stroke:var(--ink-3);opacity:.8}
.guide text{fill:var(--ink-3);font-size:7px;font-family:var(--ui)}
.answer path{fill:none;stroke:var(--pen);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.answer text{fill:var(--pen);font-size:8px;font-weight:700;font-family:var(--ui)}
.answer text.flag{font-size:10px}
.tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tool{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;font-size:14px;min-height:38px}
.tool[aria-pressed="true"]{background:var(--ai-soft);border-color:var(--ai);color:var(--ai)}
.tool:disabled{opacity:.4;cursor:default}
.feedback{min-height:1.5em;text-align:center;margin:8px 0;font-size:15px}
.feedback.ok{color:var(--good)}
.feedback.off{color:var(--pen)}
.actions{display:flex;gap:10px}
.actions .btn{flex:1}

.flash{display:block;width:100%;border:0;padding:0;background:none;perspective:1200px;margin-top:12px;text-align:center}
.flash-inner{position:relative;height:min(48vh,330px);transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:6px}
.face.back{transform:rotateY(180deg)}
.face .corner{position:absolute;top:10px;left:14px;font-size:13px;color:var(--ink-3)}
.glyph{font-size:clamp(108px,30vw,156px);line-height:1}
.glyph.sm{font-size:64px}
.sound-big{font-size:40px;font-weight:700;line-height:1.1}
.mn{margin:6px 0 0;color:var(--ink-2);font-size:15px;max-width:34ch}
.other{margin:4px 0 0;font-size:14px;color:var(--ink-3)}
.other [lang="ja"]{font-size:20px;color:var(--ink)}
.tap-note{text-align:center;color:var(--ink-3);font-size:14px;margin:10px 0 0}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.grades .btn{flex-direction:column;gap:0;line-height:1.2;min-height:54px;padding:0 6px}
.grades small{font-size:12px;font-weight:400;opacity:.8}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-height:min(30vh,220px);display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:12px;padding:16px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.choice{min-height:64px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:22px;padding:8px;line-height:1.25}
.choice [lang="ja"]{font-size:24px}
.choice .rom{display:block;font-size:13px}
.choice.long [lang="ja"]{font-size:18px}
.choice.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.choice.wrong{background:var(--pen-soft);border-color:var(--pen);color:var(--pen)}
.choice:disabled{cursor:default}
.after{margin-top:12px;min-height:3em}
.after p{margin:0 0 10px;color:var(--ink-2)}

.vcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-top:12px}
.vk{font-size:40px;font-weight:600;line-height:1.15}
.vr{font-size:17px;color:var(--ink-2);margin-left:8px}
.rom{color:var(--ink-3);font-size:.9em;font-family:var(--ui)}
.vp-mean{color:var(--ink-2);margin-top:2px}
.vp-to{margin-top:14px;padding-top:12px;border-top:1px dashed var(--grid);display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.form-name{font-weight:700;font-size:19px}
.form-jp{font-size:19px;color:var(--ai)}
.form-gloss{width:100%;color:var(--ink-3);font-size:14px}
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 6px;margin:10px -16px 0;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 12px;font-size:13px;white-space:nowrap;min-height:34px;color:var(--ink-2)}
.chip [lang="ja"]{font-size:14px}
.chip[aria-pressed="true"]{background:var(--ai-soft);border-color:var(--ai);color:var(--ai)}
.chip.next{border-style:dashed;color:var(--ink-3);background:transparent}
.unlock-note{font-size:13px;color:var(--ink-2);margin:2px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.meter{display:inline-flex;gap:2px;vertical-align:middle}
.meter i{width:7px;height:7px;border-radius:2px;background:var(--sunk)}
.meter i.on{background:var(--good)}
.type-row{display:flex;gap:8px;margin-top:12px}
.type-row input{flex:1;min-width:0;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:18px;background:var(--surface)}
.preview{min-height:1.7em;font-size:21px;margin-top:6px;color:var(--ai)}
.result{margin-top:12px;padding:12px 16px;border-radius:6px;border-left:4px solid var(--good);background:var(--good-soft)}
.result.off{border-left-color:var(--pen);background:var(--pen-soft)}
.verdict{margin:0;font-weight:700}
.result.ok .verdict{color:var(--good)}
.result.off .verdict{color:var(--pen)}
.ans-line{margin:4px 0 0}
.ans-big{font-size:28px;font-weight:600}
.rule{margin:6px 0 0;font-size:14px;color:var(--ink-2)}
.next-row{margin-top:12px}

.lead{font-size:17px;max-width:46ch}
.empty{padding:28px 4px;display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.learn-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.learn-head p{margin:0;color:var(--ink-2);font-size:14px}
.meaning{font-size:28px;font-weight:700;line-height:1.2}
.gtag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;border:1px solid currentColor;font-family:var(--ui)}
.gtag.r{color:var(--ai)} .gtag.u{color:var(--good)} .gtag.s,.gtag.k{color:var(--pen)}
.ex{margin:6px 0 0;font-size:15px;color:var(--ink-2)}
.ex [lang="ja"]{font-size:20px;color:var(--ink)}
.trap{margin:4px 0 0;font-size:13px;color:var(--pen)}
.batch{list-style:none;padding:0;margin:12px 0}
.batch li{padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:baseline}
.batch .vk{font-size:30px}
.batch .bmeta{font-size:15px}
.batch .bmeta div{color:var(--ink-2)}

.search{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface);margin-top:12px}
.vlist{list-style:none;margin:6px 0 0;padding:0}
.vrow{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:0 12px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 2px}
.vrow .vk-s{font-size:22px;font-weight:600}
.vrow .meta{color:var(--ink-2);font-size:14px;line-height:1.35}
.vrow .meta .r{color:var(--ink)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:middle}
.scroll-x{overflow-x:auto;margin:0 -16px;padding:0 16px}
.ctable{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 14px}
.ctable th,.ctable td{text-align:left;padding:6px 8px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.ctable th{font-weight:500;color:var(--ink-2)}
.ctable td [lang="ja"]{font-size:17px}
.ctable .rom{display:block;font-size:12px}
.ctable.wide td,.ctable.wide th{white-space:nowrap;padding-right:14px}
.ctable.te td:nth-child(-n+2){white-space:nowrap}
details.rules{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;margin-top:12px}
details.rules summary{min-height:48px;display:flex;align-items:center;font-weight:500;cursor:pointer}
details.rules h3{font-size:15px;margin:14px 0 4px}
details.rules p{margin:0 0 8px;font-size:15px;color:var(--ink-2);max-width:62ch}
details.rules .scroll-x{margin:0 -14px;padding:0 14px}

.p-sec{margin-top:20px}
.p-sec h2{font-size:18px;margin:0 0 8px}
.p-sec .bar{margin:0 0 8px}
.stat-line{margin:0;color:var(--ink-2)}
.stat-line b{color:var(--ink);font-size:20px}
.k-note{margin:8px 0 0;font-size:13px;color:var(--ink-2);max-width:52ch}
.kgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px;max-width:420px}
.kc{aspect-ratio:1/1.06;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;border-radius:8px;border:1.5px dashed var(--lv0-line);background:transparent;color:var(--ink-2)}
.kc .kg{font-size:22px;line-height:1.15}
.kc .kr{font-size:12px;line-height:1.1;font-family:var(--ui)}
.kc:active{transform:scale(.95)}
.kc.l1{background:var(--lv1);border:1.5px solid var(--lv1);color:var(--lv1-ink)}
.kc.l2{background:var(--lv2);border:1.5px solid var(--lv2);color:var(--lv2-ink)}
.kc.l3{background:var(--lv3);border:1.5px solid var(--lv3);color:var(--lv3-ink)}
.lv-legend{display:grid;grid-template-columns:repeat(2,max-content);gap:6px 24px;margin:2px 0 0;padding:0;list-style:none;font-size:14px;color:var(--ink-2)}
@media (min-width:480px){.lv-legend{grid-template-columns:repeat(4,max-content)}}
.lv-legend li{display:flex;align-items:center;gap:6px}
.lv-legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.sw{flex:none;width:16px;height:16px;border-radius:4px;border:1.5px dashed var(--lv0-line)}
.sw.l1{background:var(--lv1);border:1.5px solid var(--lv1)} .sw.l2{background:var(--lv2);border:1.5px solid var(--lv2)} .sw.l3{background:var(--lv3);border:1.5px solid var(--lv3)}
.kgap{grid-column:1/-1;height:6px}
.fprog{list-style:none;padding:0;margin:8px 0 0}
.fprog li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.fprog .st{color:var(--ink-2);font-size:14px;white-space:nowrap}
.switch{display:flex;gap:10px;align-items:center;min-height:44px}
.switch input{width:20px;height:20px;accent-color:var(--ai)}
.credit{font-size:13px;color:var(--ink-3);margin:4px 0 0}
.top-r{display:flex;align-items:center;gap:10px}
.gear{flex:none;width:44px;height:44px;margin-right:-8px;border:0;border-radius:50%;background:transparent;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center}
.gear svg{width:22px;height:22px}
.gear[aria-pressed="true"]{background:var(--ai-soft);color:var(--ai)}
.back-btn{display:inline-flex;align-items:center;gap:2px;min-height:44px;margin-left:-8px;padding:0 10px 0 4px;border:0;background:none;color:var(--ai);font-size:16px;font-weight:500}
.back-btn svg{width:22px;height:22px}
.set-title{font-size:20px;font-weight:700}
.set-sec{margin-top:22px}
.set-sec h2{font-size:18px;margin:0 0 6px}
.set-sec p{max-width:60ch}
.set-sec .note{margin:6px 0 0;font-size:14px;color:var(--ink-2)}
.steps{margin:12px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:15px;max-width:60ch}
.steps li::marker{font-weight:700;color:var(--ai)}
.steps a{color:var(--ai);font-weight:500}
.field-row{display:flex;gap:8px;margin-top:12px}
.field-row input{flex:1;min-width:0;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--surface);font-size:15px}
.gs-state{margin:8px 0 0;padding:10px 12px;border-radius:10px;font-size:15px;border-left:4px solid var(--line);background:var(--surface)}
.gs-state.ok{border-left-color:var(--good)}
.gs-state.err{border-left-color:var(--pen);background:var(--pen-soft)}
.gs-state.busy{border-left-color:var(--ai)}
.script-box{height:120px}
.bk{width:100%;min-height:96px;margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);font:13px/1.4 ui-monospace,monospace;color:var(--ink);word-break:break-all;resize:vertical}
.bk-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

.lvchip{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;border:1.5px dashed var(--lv0-line);background:transparent;color:var(--ink);vertical-align:1px;margin-left:6px}
.lvchip.l1{background:var(--lv1);border:1.5px solid var(--lv1);color:var(--lv1-ink)} .lvchip.l2{background:var(--lv2);border:1.5px solid var(--lv2);color:var(--lv2-ink)} .lvchip.l3{background:var(--lv3);border:1.5px solid var(--lv3);color:var(--lv3-ink)}
.sheet-bg{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.sheet-bg.on{opacity:1}
.sheet{width:100%;max-width:560px;max-height:calc(100% - 24px);overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(28px);transition:transform .24s cubic-bezier(.2,.7,.2,1)}
.sheet-bg.on .sheet{transform:none}
.sh-top{display:flex;align-items:center;gap:16px}
.sh-glyph{font-size:84px;line-height:1;min-width:92px;text-align:center}
.sh-rom{font-size:34px;font-weight:700;line-height:1.1}
.sh-meta{font-size:14px;color:var(--ink-2);margin-top:4px}
.sh-other{border:1px solid var(--line);background:var(--paper);border-radius:10px;min-height:36px;padding:0 10px;font-size:14px;color:var(--ink-2);margin-top:6px}
.sh-other [lang="ja"]{font-size:20px;color:var(--ink)}
.sh-close{margin-left:auto;align-self:flex-start;flex:none;width:44px;height:44px;border:0;border-radius:50%;background:var(--sunk);font-size:24px;line-height:1;color:var(--ink-2)}
.sh-mn{margin:12px 0 0;font-size:15px;color:var(--ink-2)}
.sh-mid{display:grid;grid-template-columns:136px 1fr;gap:16px;margin-top:14px;align-items:start}
.sh-cell{position:relative;width:136px;aspect-ratio:1;border:2px solid var(--grid);border-radius:3px;background:var(--paper)}
.sh-cell svg{position:absolute;inset:0;width:100%;height:100%}
.sh-cell .grid line{stroke:var(--grid-faint);stroke-width:.7;stroke-dasharray:2.4 2.4}
.sh-cell .order path{fill:none;stroke:var(--ink);stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round}
.sh-cell .order text{fill:var(--pen);font-size:9px;font-weight:700;font-family:var(--ui)}
.sh-strokes{display:flex;align-items:center;justify-content:space-between;width:136px;margin-top:4px;font-size:14px;color:var(--ink-2)}
.sh-stat{margin-bottom:12px}
.sh-stat p{margin:2px 0 0;font-size:14px;color:var(--ink-2)}
.sh-actions{display:flex;gap:10px;margin-top:14px}
.sh-actions .btn{flex:1;padding:0 10px}
@media (max-width:359px){.sh-mid{grid-template-columns:1fr}}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;min-height:44px}
.sel,.time-in{min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--surface);color:var(--ink);font-size:16px;max-width:100%}
.sel{flex:1 1 220px}
.tour-bg{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));opacity:0;transition:opacity .2s}
.tour-bg.on{opacity:1}
.tour{width:100%;max-width:400px;max-height:100%;overflow:auto;background:var(--surface);border-radius:18px;padding:12px 18px 14px;transform:translateY(14px);transition:transform .24s cubic-bezier(.2,.7,.2,1);touch-action:pan-y}
.tour-bg.on .tour{transform:none}
.tour-top{display:flex;justify-content:space-between;align-items:center;min-height:40px}
.tour-vis{height:176px;display:flex;align-items:center;justify-content:center;gap:16px;background:var(--paper);border-radius:12px;margin:4px 0 14px;overflow:hidden;padding:0 12px}
.tour-step.in{animation:tourIn .22s ease-out}
@keyframes tourIn{from{opacity:0;transform:translateX(var(--tour-dx,12px))}to{opacity:1;transform:none}}
.tour-title{font-size:22px;line-height:1.25;margin:0 0 6px;text-wrap:balance}
.tour-text{margin:0;color:var(--ink-2);font-size:15px;line-height:1.5;min-height:6em}
.tour-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.tour-foot .btn{min-height:44px;white-space:nowrap}
.tour-foot .next{margin-left:auto}
.tour-dots{display:flex;gap:6px}
.tour-dots i{width:7px;height:7px;border-radius:4px;background:var(--line);transition:width .2s}
.tour-dots i.on{width:20px;background:var(--ai)}
.t-cell{position:relative;width:132px;height:132px;flex:none;border:2px solid var(--grid);border-radius:3px;background:var(--surface)}
.t-cell svg{position:absolute;inset:0;width:100%;height:100%}
.t-cell .grid line{stroke:var(--grid-faint);stroke-width:.7;stroke-dasharray:2.4 2.4}
.t-cell .order path{fill:none;stroke:var(--ink);stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round}
.t-cell .order text{fill:var(--pen);font-size:9px;font-weight:700;font-family:var(--ui)}
.t-prompt{display:flex;flex-direction:column;align-items:flex-start}
.t-prompt .sound{font-size:40px}
.t-card{width:104px;height:132px;flex:none;border:1px solid var(--line);border-radius:8px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.t-card .g{font-size:52px;line-height:1}
.t-card .r{font-size:22px;font-weight:700}
.t-grades{display:flex;flex-direction:column;gap:6px;width:112px}
.t-grades span{display:flex;justify-content:space-between;align-items:center;border-radius:8px;padding:5px 9px;font-size:13px;font-weight:500;background:var(--surface);border:1px solid var(--line)}
.t-grades span small{font-weight:400;opacity:.8}
.t-grades .a{background:var(--pen-soft);border-color:transparent;color:var(--pen)}
.t-grades .e{background:var(--good);border-color:var(--good);color:var(--good-ink)}
.t-verbs{display:flex;flex-direction:column;gap:8px;align-items:stretch;width:100%;max-width:300px}
.t-verbs div{display:flex;align-items:baseline;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.t-verbs [lang="ja"]{font-size:20px}
.t-verbs small{font-size:13px;color:var(--ink-2);text-align:right}
.t-verbs .lock{border-style:dashed;color:var(--ink-3)}
.t-prog{display:flex;flex-direction:column;align-items:center;gap:10px}
.t-prog .row{display:grid;grid-template-columns:repeat(4,52px);gap:6px}
.t-prog .kc{min-height:0;height:56px;aspect-ratio:auto;pointer-events:none}
.t-prog .lv-legend{font-size:13px;gap:4px 18px}
.toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;transition:opacity .25s,transform .25s;pointer-events:none;z-index:20;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.measure{position:absolute;width:0;height:0;overflow:hidden;visibility:hidden}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

// Every visible string comes from I18N[lang].ui by key, with English as the fallback.
const I18N = /*I18N*/null;
const LANGS=[['en','English'],['es','Español'],['fr','Français'],['de','Deutsch'],['hi','हिन्दी'],['zh-Hans','简体中文'],['zh-Hant','繁體中文']];
let LANG='en', PR=null;
function detectLang(){
  const list=(navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language||'en'];
  for(const l of list){
    const x=String(l).toLowerCase();
    if(x.startsWith('zh')) return /hant|-tw|-hk|-mo/.test(x) ? 'zh-Hant' : 'zh-Hans';
    const b=x.split('-')[0];
    if(I18N[b]) return b;
  }
  return 'en';
}
function langName(code){ const f=LANGS.find(l=>l[0]===code); return f ? f[1] : code; }
function applyLang(){
  const want=S.set.lang;
  LANG = (want && want!=='auto' && I18N[want]) ? want : detectLang();
  document.documentElement.lang = LANG;
  try{ PR=new Intl.PluralRules(LANG); }catch(e){ PR=new Intl.PluralRules('en'); }
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent=t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>{ el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  pushNotifyText();
}
function t(k, v){
  const L=I18N[LANG] && I18N[LANG].ui;
  let str = (L && L[k]!=null) ? L[k] : I18N.en.ui[k];
  if(str==null){ try{ console.warn('Kakitori: missing text', k); }catch(e){} str=k; }
  if(v) str=str.replace(/\{(\w+)\}/g, (m,n)=> v[n]!=null ? v[n] : m);
  return str;
}
// Plural-aware: picks k.one / k.other (or whatever the language needs) from the count n.
function tn(k, n, v){
  const L=(I18N[LANG] && I18N[LANG].ui) || {};
  let cat=PR ? PR.select(n) : (n===1?'one':'other');
  if(L[k+'.'+cat]==null && I18N.en.ui[k+'.'+cat]==null) cat='other';
  return t(k+'.'+cat, Object.assign({n}, v||{}));
}

function mnemonic(it){
  const row=rowOf(it.row);
  if(row.from){
    const base=rowOf(row.from); const bch=[...(it.s==='h'?base.h:base.k)][it.i]; const br=base.r[it.i];
    let m = t(row.maru?'mn.handakuten':'mn.dakuten', {base:bch, br, r:it.r});

function kataToHira(s){ return s.replace(/[\u30A1-\u30F6]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60)); }
function toRomaji(str){
  const s=kataToHira(str); const syl=[];
  for(let i=0;i<s.length;i++){
    const c=s[i], n=s[i+1];
    if(c==='っ'){ syl.push('*'); continue; }
    if(c==='ー'){ syl.push('-'); continue; }
    let r=H2R[c];
    if(r===undefined){ syl.push(c); continue; }
    if(n && 'ゃゅょ'.includes(n) && r.length>1 && r.endsWith('i')){
      const v={'ゃ':'a','ゅ':'u','ょ':'o'}[n]; const b=r.slice(0,-1);
      r=(b==='sh'||b==='ch'||b==='j')? b+v : b+'y'+v; i++;
    }
    syl.push(r);
  }
  let out='';
  for(let i=0;i<syl.length;i++){
    if(syl[i]==='*'){ const nx=syl[i+1]||''; out += nx.startsWith('ch') ? 't' : (/^[a-z]/.test(nx) ? nx[0] : ''); }
    else out+=syl[i];
  }
  return out;
}
const R2H=(()=>{
  const m={}; const V='aiueo';
  const B={'':'あいうえお',k:'かきくけこ',g:'がぎぐげご',s:'さしすせそ',z:'ざじずぜぞ',t:'たちつてと',d:'だぢづでど',n:'なにぬねの',h:'はひふへほ',b:'ばびぶべぼ',p:'ぱぴぷぺぽ',m:'まみむめも',r:'らりるれろ'};
  for(const c in B) for(let i=0;i<5;i++) m[c+V[i]]=B[c][i];
  Object.assign(m,{ya:'や',yu:'ゆ',yo:'よ',wa:'わ',wo:'を',shi:'し',chi:'ち',tsu:'つ',fu:'ふ',ji:'じ',
    sha:'しゃ',shu:'しゅ',sho:'しょ',she:'しぇ',sya:'しゃ',syu:'しゅ',syo:'しょ',cha:'ちゃ',chu:'ちゅ',cho:'ちょ',che:'ちぇ',
    tya:'ちゃ',tyu:'ちゅ',tyo:'ちょ',cya:'ちゃ',cyu:'ちゅ',cyo:'ちょ',ja:'じゃ',ju:'じゅ',jo:'じょ',je:'じぇ',jya:'じゃ',jyu:'じゅ',jyo:'じょ',
    zya:'じゃ',zyu:'じゅ',zyo:'じょ',dya:'ぢゃ',dyu:'ぢゅ',dyo:'ぢょ',
    xa:'ぁ',xi:'ぃ',xu:'ぅ',xe:'ぇ',xo:'ぉ',la:'ぁ',li:'ぃ',lu:'ぅ',le:'ぇ',lo:'ぉ',
    xya:'ゃ',xyu:'ゅ',xyo:'ょ',lya:'ゃ',lyu:'ゅ',lyo:'ょ',xtu:'っ',ltu:'っ',xtsu:'っ',ltsu:'っ'});
  for(const c of ['k','g','n','h','b','p','m','r']){ const i=B[c][1]; m[c+'ya']=i+'ゃ'; m[c+'yu']=i+'ゅ'; m[c+'yo']=i+'ょ'; }
  return m;
})();
function toKana(str){
  const s=str.toLowerCase(); let out='', i=0;
  while(i<s.length){
    const c=s[i], n1=s[i+1];
    if(!/[a-z'\-]/.test(c)){ out+=c; i++; continue; }
    if(c==='-'){ out+='ー'; i++; continue; }
    if(c==="'"){ i++; continue; }
    if(c==='n'){
      if(n1===undefined){ out+='ん'; i++; continue; }
      if(n1==="'"){ out+='ん'; i+=2; continue; }
      if(n1==='n'){ const n2=s[i+2]; out+='ん'; i += (n2!==undefined && 'aiueoy'.includes(n2)) ? 1 : 2; continue; }
      if(!'aiueoy'.includes(n1)){ out+='ん'; i++; continue; }
    }
    if(c===n1 && /[bcdfghjkmpqrstvwxyz]/.test(c)){ out+='っ'; i++; continue; }
    if(c==='t' && n1==='c'){ out+='っ'; i++; continue; }
    let hit=false;
    for(let L=4;L>=1;L--){ const k=s.substr(i,L); if(k.length===L && R2H[k]){ out+=R2H[k]; i+=L; hit=true; break; } }
    if(!hit){ out+=c; i++; }
  }
  return out;
}

const I_ROW={'う':'い','く':'き','ぐ':'ぎ','す':'し','つ':'ち','ぬ':'に','ぶ':'び','む':'み','る':'り'};
const A_ROW={'う':'わ','く':'か','ぐ':'が','す':'さ','つ':'た','ぬ':'な','ぶ':'ば','む':'ま','る':'ら'};
function tePart(last, iku, ta){
  const T=ta?'た':'て', D=ta?'だ':'で';
  if(iku) return 'っ'+T;
  if('うつる'.includes(last)) return 'っ'+T;
  if('むぶぬ'.includes(last)) return 'ん'+D;
  if(last==='く') return 'い'+T;
  if(last==='ぐ') return 'い'+D;
  if(last==='す') return 'し'+T;
  return T;
}
function conjWord(w, type, iku, form, isReading){
  let ms, ns, te, ta;
  if(type==='r'){ const b=w.slice(0,-1); ms=b; ns=b; te=b+'て'; ta=b+'た'; }
  else if(type==='u'){ const b=w.slice(0,-1), l=w.slice(-1); ms=b+I_ROW[l]; ns=b+A_ROW[l]; te=b+tePart(l,iku,false); ta=b+tePart(l,iku,true); }
  else if(type==='s'){ const b=w.slice(0,-2); ms=b+'し'; ns=b+'し'; te=b+'して'; ta=b+'した'; }
  else { if(isReading){ ms='き'; ns='こ'; te='きて'; ta='きた'; } else { const b=w.slice(0,-1); ms=b; ns=b; te=b+'て'; ta=b+'た'; } }
  switch(form){
    case 'dict': return w;
    case 'masu': return ms+'ます';
    case 'mashita': return ms+'ました';
    case 'masen': return ms+'ません';
    case 'masendeshita': return ms+'ませんでした';
    case 'nai': return ns+'ない';
    case 'ta': return ta;
    case 'nakatta': return ns+'なかった';
    case 'te': return te;
    case 'mashou': return ms+'ましょう';
    case 'tai': return ms+'たい';
  }
  return w;
}
function conj(v, form){ return {k:conjWord(v.k, v.t, v.iku, form, v.k===v.r), r:conjWord(v.r, v.t, v.iku, form, true)}; }
function formOk(v, fid){ return !(v.nv && NV_SKIP.includes(fid)); }
function wrongs(v, fid){
  const out=[]; const r=v.r; const c=conj(v,fid).r;
  if(v.t==='u'){
    out.push(conjWord(r,'r',false,fid,true));
    if(fid==='te'||fid==='ta'){
      const b=r.slice(0,-1), l=r.slice(-1);
      ['う','む','く','ぐ','す'].forEach(alt=>{ if(alt!==l) out.push(b+tePart(alt,false,fid==='ta')); });
      if(v.iku) out.push(b+tePart('く',false,fid==='ta'));
    }
    if(r.slice(-1)==='う' && (fid==='nai'||fid==='nakatta')) out.push(r.slice(0,-1)+'あ'+(fid==='nai'?'ない':'なかった'));
  } else if(v.t==='r'){
    out.push(conjWord(r,'u',false,fid,true));
  } else if(v.t==='k'){
    const rest=c.slice(1); ['く','こ','き'].forEach(s=>out.push(s+rest));
  } else {
    const p=r.slice(0,-2); const rest=c.slice(p.length+1); ['さ','す'].forEach(s=>out.push(p+s+rest));
  }
  return [...new Set(out)].filter(x=>x!==c);
}

function queueRemote(){ if(!remoteRef) return; clearTimeout(rTimer); rTimer=setTimeout(flushRemote, 2500); }
async function flushRemote(){
  clearTimeout(rTimer); rTimer=null;
  if(!remoteRef) return;
  if(rWriting){ rDirty=true; return; }
  rWriting=true;
  try{ await remoteRef.set({json:JSON.stringify(S), t:S.t}); }
  catch(e){
    const code=e&&e.code;
    if(code==='unavailable' || code==='resource_exhausted'){ setTimeout(queueRemote, 4000+Math.random()*4000); }
    else { remoteRef=null; synced=false; }
  }
  rWriting=false;
  if(rDirty){ rDirty=false; flushRemote(); }
}
async function connectRemote(){
  try{
    if(!window.claude || typeof window.claude.use!=='function') return;
    const [db,user]=await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const ref=db.doc('data/users/'+id+'/progress');
    const snap=await ref.get();
    remoteRef=ref; synced=true;
    let rs=null;
    if(snap.exists){ const d=snap.data()||{}; try{ rs=JSON.parse(d.json); }catch(e){} }
    if(rs){
      const merged=mergeStates(S, rs);
      if(!sameProgress(merged, S)){ S=merged; writeLocal(); resetRuntime(); render(); }
      if(!sameProgress(merged, rs)) flushRemote();
    } else if(S.t>0) flushRemote();
    if(S.set.tab==='progress' || S.set.tab==='settings') render();
  }catch(e){}
}

/* ================= Merging progress from two devices ================= */
function pd(s){ if(!s) return 0; const a=String(s).split('-').map(Number); return (a[0]||0)*10000+(a[1]||0)*100+(a[2]||0); }
function mergeStates(a, b){
  const o=JSON.parse(JSON.stringify(a));
  o.srs={};
  const A=a.srs||{}, B=b.srs||{};
  new Set([...Object.keys(A), ...Object.keys(B)]).forEach(k=>{
    const x=A[k], y=B[k];
    o.srs[k] = !x ? y : !y ? x : (y.n>x.n || (y.n===x.n && y.d>x.d)) ? y : x;
  });
  o.verbs=Math.max(a.verbs||0, b.verbs||0);
  o.forms=Math.max(a.forms||1, b.forms||1);
  const newer=(b.t||0)>(a.t||0)?b:a, older=newer===a?b:a;
  o.recent=Object.assign({}, older.recent||{}, newer.recent||{});
  o.off=(newer.off||[]).slice();
  const da=a.day||{}, dbb=b.day||{};
  if(pd(da.date)===pd(dbb.date)) o.day={date:da.date||'', count:Math.max(da.count||0, dbb.count||0), streak:Math.max(da.streak||0, dbb.streak||0)};
  else o.day=Object.assign({}, pd(da.date)>pd(dbb.date)?da:dbb);
  o.t=Math.max(a.t||0, b.t||0);
  o.set=Object.assign({}, a.set||{});
  return migrate(o);
}
function canon(v){
  if(Array.isArray(v)) return '['+v.map(canon).join(',')+']';
  if(v && typeof v==='object') return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';
  return JSON.stringify(v===undefined?null:v);
}
function progressOf(st){ return {srs:st.srs||{}, verbs:st.verbs||0, forms:st.forms||1, recent:st.recent||{}, off:st.off||[], day:st.day||{}}; }
function sameProgress(a, b){ return canon(progressOf(a))===canon(progressOf(b)); }

function parseRepo(v){

// ---- Google: a small Apps Script the person deploys in their own account
async function gsCall(body){
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(), 25000);
  let res;
  try{
    res = body
      ? await fetch(G.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body, cache:'no-store', redirect:'follow', signal:ctl.signal})
      : await fetch(G.url+'?r='+Date.now(), {cache:'no-store', redirect:'follow', signal:ctl.signal});
  } catch(e){ throw new Error(ctl.signal.aborted?'timeout':'network'); }
  finally{ clearTimeout(to); }
  if(!res.ok) throw new Error('http');
  let j; try{ j=JSON.parse(await res.text()); }catch(e){ throw new Error('notjson'); }
  if(!j || !j.ok) throw new Error('script:'+((j&&j.error)||'unknown'));
  return j;
}
// ---- GitHub: one file in a private repository, through the contents API
async function ghFetch(path, opt){
  opt=opt||{};
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(), 25000);
  const headers=Object.assign({'Accept':'application/vnd.github+json', 'Authorization':'Bearer '+G.token}, opt.headers||{});
  try{ return await fetch('https://api.github.com'+path, {method:opt.method||'GET', headers, body:opt.body, cache:'no-store', signal:ctl.signal}); }
  catch(e){ throw new Error(ctl.signal.aborted?'timeout':'network'); }
  finally{ clearTimeout(to); }
}
function ghErr(res){
  if((res.status===403 || res.status===429) && res.headers.get('x-ratelimit-remaining')==='0') return new Error('gh:ratelimit');
  return new Error('gh:'+res.status);
}
function ghRepoPath(){ return '/repos/'+encodeURIComponent(G.owner)+'/'+encodeURIComponent(G.repo); }
async function ghGet(){
  const res=await ghFetch(ghRepoPath()+'/contents/'+GH_FILE);
  if(res.status===404){ G.sha=''; return ''; }
  if(!res.ok) throw ghErr(res);
  const j=await res.json();
  if(j.encoding!=='base64' || typeof j.content!=='string') throw new Error('unreadable');
  G.sha=j.sha||'';
  try{ return atob(j.content.replace(/\s+/g,'')); }catch(e){ throw new Error('unreadable'); }
}
async function ghPut(data){
  const body={message:'Update Kakitori progress', content:btoa(data)};
  if(G.sha) body.sha=G.sha;
  const res=await ghFetch(ghRepoPath()+'/contents/'+GH_FILE, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  if(res.status===409 || res.status===422) throw new Error('conflict');
  if(!res.ok) throw ghErr(res);
  const j=await res.json(); G.sha=(j && j.content && j.content.sha) || '';
}

function syncErrText(e){
  const m=String(e&&e.message||e), gh=G.kind==='github';
  const repo=(G.owner?G.owner+'/':'')+G.repo, svc=syncName();
  if(m==='network' && !navigator.onLine) return t('err.offline');

  if(m==='unreadable') return t('err.unreadable');
  if(gh){
    if(m==='network') return t('err.gh.network');
    if(m==='gh:401') return t('err.gh.401');

    if(m==='gh:404') return t('err.gh.404', {repo});

}
async function encodeState(obj){
  const raw=new TextEncoder().encode(JSON.stringify(obj));
  try{ if(typeof CompressionStream==='function') return 'RENSHU1Z:'+b64(await pipe(raw, new CompressionStream('gzip'))); }catch(e){}
  return 'RENSHU1:'+b64(raw);
}
// full=true reads the other phones' progress first. full=false only pushes this phone's changes,
// and on GitHub skips the read when nothing else has written since (the file's sha still matches).
async function gsync(full){
  full = full!==false;
  if(!syncOn()) return false;
  if(G.busy){ G.again=true; if(full) G.againFull=true; return false; }
  clearTimeout(G.timer); G.timer=null;
  if(!full && G.pushed && G.pushed===canon(progressOf(S))) return true;
  G.busy=true; G.lastTry=Date.now(); G.status='busy'; paintSync();
  let ok=false;
  try{
    for(let attempt=0; ; attempt++){
      try{
        if(!full && G.kind==='github' && G.sha){
          await remoteWrite(S);
          G.pushed=canon(progressOf(S));
        } else {
          const data=await remoteRead();
          const remote = data ? await readBackup(data) : null;
          if(data && !remote) throw new Error('unreadable');
          const merged = remote ? mergeStates(S, remote) : S;
          if(remote && !sameProgress(merged, S)){
            S=merged; writeLocal(); queueRemote();
            renderToday(); if(S.set.tab==='progress') render();
          }
          if(!remote || !sameProgress(merged, remote)) await remoteWrite(merged);
          G.pushed=canon(progressOf(merged));
        }
        break;
      } catch(e){
        if(e.message==='conflict' && attempt<2){ full=true; G.sha=''; continue; }
        throw e;
      }
    }
    G.last=Date.now(); G.status='ok'; G.err=''; syncStore(); ok=true;
  } catch(e){ G.status='err'; G.err=syncErrText(e); }
  G.busy=false; paintSync();
  if(G.again){ const f=G.againFull; G.again=false; G.againFull=false; setTimeout(()=>gsync(f), 1500); }
  return ok;
}
function ago(when){
  const sec=Math.round((Date.now()-when)/1000);
  if(sec<45) return t('ago.now');
  const m=Math.round(sec/60); if(m<60) return tn('ago.min', m);
  const h=Math.round(m/60); if(h<24) return tn('ago.h', h);
  return tn('ago.day', Math.round(h/24));
}

const SYNC_SCRIPT = "// Kakitori sync. Keeps your Kakitori progress in your own Google account.\n// Paste this into a new Apps Script project (script.new), then\n// Deploy > New deployment > Web app, Execute as: Me, Who has access: Anyone.\n// Paste the Web app URL (ending in /exec) into Kakitori > Settings > Google sync.\n\nvar CHUNK = 8000; // Script properties hold up to 9 KB per value.\n\nfunction doGet(e) {\n  return handle_(null);\n}\n\nfunction doPost(e) {\n  return handle_(e && e.postData ? e.postData.contents : '');\n}\n\nfunction handle_(body) {\n  var lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    var props = PropertiesService.getScriptProperties();\n    var all = props.getProperties();\n    var oldCount = Number(all.n || 0);\n\n    if (body) {\n      var msg = JSON.parse(body);\n      var data = String(msg.data || '');\n      if (!data) return json_({ ok: false, error: 'empty' });\n      var count = Math.ceil(data.length / CHUNK);\n      var update = { n: String(count), t: String(Number(msg.t) || Date.now()) };\n      for (var i = 0; i < count; i++) update['c' + i] = data.substr(i * CHUNK, CHUNK);\n      props.setProperties(update);\n      for (var j = count; j < oldCount; j++) props.deleteProperty('c' + j);\n      return json_({ ok: true, t: Number(update.t) });\n    }\n\n    var parts = [];\n    for (var k = 0; k < oldCount; k++) parts.push(all['c' + k] || '');\n    return json_({ ok: true, t: Number(all.t || 0), data: parts.join('') });\n  } catch (err) {\n    return json_({ ok: false, error: String(err && err.message || err) });\n  } finally {\n    lock.releaseLock();\n  }\n}\n\nfunction json_(obj) {\n  return ContentService.createTextOutput(JSON.stringify(obj))\n    .setMimeType(ContentService.MimeType.JSON);\n}\n";

const IV=[1, 10, 1440, 4320, 10080, 23040, 50400, 129600]; // minutes
function ivLabel(m){ if(m<60) return tn('iv.min', m); if(m<1440) return tn('iv.h', Math.round(m/60)); return tn('iv.day', Math.round(m/1440)); }
// Longest gap allowed between reviews, in minutes (0 = no limit). Set in Settings → Review schedule.
const GAP_OPTS=[0,1440,4320,10080,20160,43200];
function capIv(m){ const c=+S.set.maxGap||0; return c ? Math.min(m, c) : m; }
function nextIv(key, g){ const s=S.srs[key]; const b=s?s.b:0; if(g===0) return IV[0]; return capIv(IV[Math.min(IV.length-1, b+g)]); }
function grade(key, g){
  const s=S.srs[key]||{b:0,d:0,n:0,c:0};
  s.n++; if(g>0) s.c++;
  s.b = g===0 ? 0 : Math.min(IV.length-1, s.b+g);
  s.d = Date.now()+capIv(IV[s.b])*60000;
  S.srs[key]=s; tickDay(); save();
}
function tickDay(){
  const t=today();
  if(S.day.date!==t){
    const y=dayStr(new Date(Date.now()-864e5));
    S.day.streak = (S.day.date===y) ? (S.day.streak||0)+1 : 1;
    S.day.date=t; S.day.count=0;
  }
  S.day.count++;
}
function pickKey(keys, avoid, randomFresh){
  const now=Date.now(); let c=keys.filter(k=>k!==avoid); if(!c.length) c=keys;
  const due=[], fresh=[], later=[];
  for(const k of c){ const s=S.srs[k]; if(!s) fresh.push(k); else if(s.d<=now) due.push(k); else later.push(k); }
  if(due.length){ due.sort((a,b)=>S.srs[a].d-S.srs[b].d); return rnd(due.slice(0,3)); }
  if(fresh.length) return randomFresh ? rnd(fresh) : fresh[0];
  later.sort((a,b)=>(S.srs[a].b-S.srs[b].b)||(S.srs[a].d-S.srs[b].d));
  return rnd(later.slice(0,Math.min(4,later.length)));
}
function level(key){ const s=S.srs[key]; if(!s) return 0; if(s.b>=4) return 3; if(s.b>=2) return 2; return 1; }

const N_PTS=24;
const tplCache={};
function tplPts(ch){
  if(tplCache[ch]) return tplCache[ch];
  const mp=document.getElementById('mp');
  const res=STROKES[ch].p.map(d=>{ mp.setAttribute('d',d); const L=mp.getTotalLength(); const pts=[]; for(let i=0;i<N_PTS;i++){ const p=mp.getPointAtLength(L*i/(N_PTS-1)); pts.push([p.x,p.y]); } return pts; });
  tplCache[ch]=res; return res;
}
function resample(pts,n){
  if(pts.length<2) return Array.from({length:n},()=>pts[0].slice());
  const d=[0]; for(let i=1;i<pts.length;i++) d.push(d[i-1]+Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
  const Lt=d[d.length-1]; if(Lt<1e-6) return Array.from({length:n},()=>pts[0].slice());
  const out=[]; let j=0;
  for(let k=0;k<n;k++){ const t=Lt*k/(n-1); while(j<d.length-2 && d[j+1]<t) j++; const sg=(d[j+1]-d[j])||1; const a=Math.min(1,Math.max(0,(t-d[j])/sg)); out.push([pts[j][0]+(pts[j+1][0]-pts[j][0])*a, pts[j][1]+(pts[j+1][1]-pts[j][1])*a]); }
  return out;
}
function normAll(strokes){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  strokes.forEach(s=>s.forEach(([x,y])=>{ x0=Math.min(x0,x); y0=Math.min(y0,y); x1=Math.max(x1,x); y1=Math.max(y1,y); }));
  const w=x1-x0, h=y1-y0, sc=Math.max(w,h,1e-3), cx=x0+w/2, cy=y0+h/2;
  return strokes.map(s=>s.map(([x,y])=>[(x-cx)/sc+.5,(y-cy)/sc+.5]));
}
function sdist(a,b){ let t=0; for(let i=0;i<a.length;i++) t+=Math.hypot(a[i][0]-b[i][0], a[i][1]-b[i][1]); return t/a.length; }
const TH=0.14;
function compareStrokes(user, ch){
  const tpl=tplPts(ch), need=tpl.length;
  if(!user.length) return {pass:false, marks:null, msg:t('cmp.model', {strokes:tn('strokes', need)})};
  if(user.length!==need) return {pass:false, marks:null, msg:t('cmp.count', {strokes:tn('strokes', need), n:user.length})};
  const U=normAll(user.map(s=>resample(s,N_PTS))), T=normAll(tpl);
  const marks=[]; let first=-1, reason='';
  const plen=a=>{ let len=0; for(let k=1;k<a.length;k++) len+=Math.hypot(a[k][0]-a[k-1][0], a[k][1]-a[k-1][1]); return len; };
  for(let i=0;i<need;i++){
    const th = plen(T[i])<0.3 ? TH*1.45 : TH;
    if(sdist(U[i],T[i])<th){ marks.push(true); continue; }
    marks.push(false);
    if(first<0){
      first=i;
      if(sdist(U[i].slice().reverse(),T[i])<TH) reason='dir';
      else { const j=T.findIndex((tt,k)=>k!==i && sdist(U[i],tt)<TH); reason = j>=0 ? 'order:'+j : 'shape'; }
    }
  }
  if(first<0) return {pass:true, marks, msg: need>1 ? t('cmp.allright', {n:need}) : t('cmp.oneright')};
  const n=first+1; let msg;
  if(reason==='dir') msg=t('cmp.dir', {n});
  else if(reason.startsWith('order')) msg=t('cmp.order', {n, m:+reason.split(':')[1]+1});
  else msg=t('cmp.off', {n});
  return {pass:false, marks, msg};
}

      : `<button class="btn primary" data-act="check">${esc(t(W.strokes.length?'check':'showme'))}</button>`}</div>`;
  mountCanvas();
}
function mountCanvas(){
  const cell=$('#cell'), cv=$('#ink'); if(!cell||!cv) return;
  W.cv=cv; W.ctx=cv.getContext('2d');
  const size=()=>{ const r=cell.getBoundingClientRect(); if(!r.width) return; const dpr=window.devicePixelRatio||1; cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); W.sc=cv.width/109; drawInk(); };
  size();
  W.ro=new ResizeObserver(size); W.ro.observe(cell);
  cv.addEventListener('pointerdown', pDown);
  cv.addEventListener('pointermove', pMove);
  cv.addEventListener('pointerup', pUp);
  cv.addEventListener('pointercancel', pUp);
  cv.addEventListener('contextmenu', e=>e.preventDefault());
  renderGuide();
  if(W.checked) renderAnswer();
  else if(W.isNew && !W.introPlayed){ W.introPlayed=true; playOrder(); }
}
function guidePaths(cls){ const d=STROKES[W.item.ch]; return d.p.map(p=>`<path class="${cls}" d="${p}"/>`).join(''); }
function guideNums(){ const d=STROKES[W.item.ch]; return d.n.map((p,i)=>`<text x="${p[0]}" y="${p[1]}">${i+1}</text>`).join(''); }
function renderGuide(){
  const g=$('#guide'); if(!g) return;
  if(W.checked){ g.innerHTML=''; return; }
  g.innerHTML = guideOn() ? guidePaths('g')+guideNums() : '';
}
function playOrder(){
  const g=W.checked ? $('#answer') : $('#guide'); if(!g||!W.item) return;
  const token=++W.anim; const d=STROKES[W.item.ch];
  g.innerHTML = d.p.map(p=>`<path class="anim" d="${p}"/>`).join('');
  W.orderShown=true;
  const paths=[...g.querySelectorAll('path')];
  const addNum=i=>{ const t=document.createElementNS('http://www.w3.org/2000/svg','text'); t.setAttribute('x',d.n[i][0]); t.setAttribute('y',d.n[i][1]); t.textContent=i+1; g.appendChild(t); };
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ paths.forEach((p,i)=>addNum(i)); return; }
  paths.forEach(p=>{ const L=p.getTotalLength(); p.style.strokeDasharray=L; p.style.strokeDashoffset=L; });
  let t=200;
  paths.forEach((p,i)=>{
    const L=p.getTotalLength(); const dur=Math.max(380, L*9);
    setTimeout(()=>{ if(token!==W.anim) return; p.style.transition=`stroke-dashoffset ${dur}ms ease-in-out`; p.style.strokeDashoffset='0'; addNum(i); }, t);
    t+=dur+200;
  });
}
function renderAnswer(){
  const a=$('#answer'); if(!a) return;
  const d=STROKES[W.item.ch];
  a.innerHTML = d.p.map(p=>`<path d="${p}"/>`).join('') + d.n.map((p,i)=>`<text x="${p[0]}" y="${p[1]}">${i+1}</text>`).join('');
}
function evPt(e){ const r=W.cv.getBoundingClientRect(); return [(e.clientX-r.left)*109/r.width, (e.clientY-r.top)*109/r.height]; }
function pDown(e){
  if(W.checked || W.cur) return;
  if(e.pointerType==='mouse' && e.button!==0) return;
  e.preventDefault();
  try{ W.cv.setPointerCapture(e.pointerId); }catch(_){}
  W.pid=e.pointerId; W.cur=[evPt(e)]; W.strokes.push(W.cur);
  if(W.orderShown && !guideOn()){ W.anim++; W.orderShown=false; $('#guide').innerHTML=''; }
  else if(W.orderShown){ W.anim++; W.orderShown=false; renderGuide(); }
  drawInk();
  const btn=$('[data-act="check"]'); if(btn) btn.textContent=t('check');
}
function pMove(e){
  if(!W.cur || e.pointerId!==W.pid) return;
  e.preventDefault();
  const evs=(e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
  evs.forEach(ev=>W.cur.push(evPt(ev)));
  drawInk();
}
function pUp(e){ if(!W.cur || e.pointerId!==W.pid) return; W.cur=null; W.pid=null; drawInk(); }
function drawInk(){
  if(!W.ctx||!W.sc) return;
  const c=W.ctx, s=W.sc; c.clearRect(0,0,W.cv.width,W.cv.height);
  const cs=getComputedStyle(document.documentElement);
  const ink=cs.getPropertyValue('--ink').trim(), warn=cs.getPropertyValue('--warn').trim();
  c.lineCap='round'; c.lineJoin='round'; c.lineWidth=4.4*s;
  (W.strokes||[]).forEach((st,i)=>{
    c.strokeStyle=c.fillStyle=(W.marks && W.marks[i]===false)?warn:ink;
    if(st.length===1){ c.beginPath(); c.arc(st[0][0]*s, st[0][1]*s, 2.2*s, 0, Math.PI*2); c.fill(); return; }
    c.beginPath(); c.moveTo(st[0][0]*s, st[0][1]*s);
    for(let j=1;j<st.length-1;j++){ const mx=(st[j][0]+st[j+1][0])/2, my=(st[j][1]+st[j+1][1])/2; c.quadraticCurveTo(st[j][0]*s, st[j][1]*s, mx*s, my*s); }
    const last=st[st.length-1]; c.lineTo(last[0]*s, last[1]*s); c.stroke();
  });
}

/* ----- Quiz ----- */
function makeKanaChoices(it,pool){
  const ok=x=>x.s===it.s && x.ch!==it.ch && x.r!==it.r;
  const same=pool.filter(ok);
  const picks=[];
  const add=x=>{ if(x && !picks.includes(x) && !picks.some(p=>p.r===x.r) && picks.length<3) picks.push(x); };
  shuffle(same.filter(x=>(CONF[it.ch]||'').includes(x.ch))).slice(0,2).forEach(add);
  shuffle(same).forEach(add);
  if(picks.length<3) shuffle(KANA.filter(x=>ok(x) && BASIC_ROWS.includes(x.row))).forEach(add);
  return shuffle([it,...picks]);
}
function nextQuiz(pool){
  clearTimeout(Q.timer);
  const keys=pool.map(it=>'kr:'+it.ch);
  const k=pickKey(keys, Q.key, true);
  Q.key=k; Q.item=KBY[k.slice(3)]; Q.choices=makeKanaChoices(Q.item,pool); Q.picked=null;
}
function renderQuiz(stage,pool){
  if(!Q.item || !pool.includes(Q.item) || !Q.choices) nextQuiz(pool);
  const it=Q.item; const k2r=S.set.dir==='k2r'; const done=Q.picked!=null;
  const prompt = k2r ? ja(it.ch,'glyph') : `<span class="sound-big">${esc(it.r)}</span><span class="in-script">${esc(t(it.s==='h'?'in.h':'in.k'))}</span>`;
  const choices = Q.choices.map((c,i)=>{
    let cls=''; if(done){ if(c===it) cls=' right'; else if(i===Q.picked) cls=' wrong'; }
    return `<button class="choice${cls}" data-act="qpick" data-i="${i}" ${done?'disabled':''}>${k2r?esc(c.r):ja(c.ch)}</button>`;
  }).join('');
  let after='';
  if(done){
    const right=Q.choices[Q.picked]===it;
    after = right ? `<p>${t('quiz.yes',{kana:ja(it.ch), r:esc(it.r)})}</p>` : `<p>${t('quiz.no',{kana:ja(it.ch), r:esc(it.r)})}${esc(t('mn.sep'))}${esc(mnemonic(it))}</p><button class="btn primary wide" data-act="qnext">${esc(t('next'))}</button>`;
  }
  stage.innerHTML = `
    ${seg('dir',[['k2r',t('dir.k2r')],['r2k',t('dir.r2k')]],S.set.dir,'small')}
    <div class="qcard">${prompt}</div>
    <div class="choices">${choices}</div>
    <div class="after" aria-live="polite">${after}</div>`;
}

/* ----- Drill ----- */
function activeForms(){ return FORMS.slice(0,S.forms).filter(f=>!S.off.includes(f.id)); }
function drillKeys(){
  const fs=activeForms(); const keys=[];
  for(let i=0;i<S.verbs;i++) for(const f of fs){ if(formOk(VERBS[i],f.id)) keys.push(`vf:${i}:${f.id}`); }
  return keys;
}
function makeVerbChoices(v,fid){
  const c=conj(v,fid).r; const picks=[];
  const add=x=>{ if(x && x!==c && !picks.includes(x) && picks.length<3) picks.push(x); };
  const wr=shuffle(wrongs(v,fid));
  const near=shuffle(FORMS.slice(0,Math.max(S.forms,4)).filter(f=>f.id!==fid && formOk(v,f.id)).map(f=>conj(v,f.id).r));
  const far=shuffle(FORMS.filter(f=>f.id!==fid && formOk(v,f.id)).map(f=>conj(v,f.id).r));
  add(wr[0]); near.forEach(add); wr.forEach(add); far.forEach(add);
  return shuffle([c,...picks]);
}
function nextDrill(){
  let keys=drillKeys(); if(!keys.length){ D.key=null; return; }
  const newest=FORMS[S.forms-1].id;
  if(!S.off.includes(newest) && Math.random()<0.4){ const nk=keys.filter(k=>k.endsWith(':'+newest)); if(nk.length) keys=nk; }
  const k=pickKey(keys, D.key, true);
  const [,vi,fid]=k.split(':');
  D.key=k; D.vi=+vi; D.fid=fid; D.choices=makeVerbChoices(VERBS[D.vi],fid); D.picked=null; D.done=false; D.ok=null; D.typed='';
}
function unlockStatus(){
  if(S.forms>=FORMS.length) return null;
  const cur=FORMS[S.forms-1], nxt=FORMS[S.forms];
  const rec=(S.recent[cur.id]||[]).slice(-UNLOCK_N);
  const right=rec.reduce((a,b)=>a+b,0);
  return {cur,nxt,rec,right};
}
function maybeUnlock(){
  const u=unlockStatus(); if(!u) return;
  if(u.rec.length>=UNLOCK_N && u.right>=UNLOCK_OK){ S.forms++; save(); toast(t('unlocked',{form:fName(u.nxt)+' '+u.nxt.jp})); }
}
function rule(v,fid){
  const l=v.r.slice(-1), T=v.t;
  const suf={masu:'ます',mashita:'ました',masen:'ません',masendeshita:'ませんでした',mashou:'ましょう',tai:'たい'}[fid];
  if(suf){
    if(T==='r') return t('rule.ru', {ru:J('る'), suf:J(suf)});
    if(T==='u') return t('rule.u.i', {l:J(l), i:J(I_ROW[l]), suf:J(suf)});
    if(T==='s') return t('rule.then', {a:J('する'), b:J('し'), suf:J(suf)});
    return t('rule.then', {a:J('くる'), b:J('き'), suf:J(suf)});
  }
  if(fid==='nai'||fid==='nakatta'){
    const s2=fid==='nai'?'ない':'なかった';
    const tail = fid==='nakatta' ? t('rule.nakatta', {nai:ja('ない'), nakatta:ja('なかった')}) : '';
    if(T==='r') return t('rule.ru', {ru:J('る'), suf:J(s2)})+tail;
    if(T==='u') return t('rule.u.a', {l:J(l), a:J(A_ROW[l]), suf:J(s2)}) + (l==='う' ? t('rule.u.wa', {u:ja('う'), wa:ja('わ'), aa:ja('あ')}) : '');
    if(T==='s') return t('rule.becomes', {a:J('する'), b:J('し'+s2)});
    return t('rule.becomes', {a:J('くる'), b:J('こ'+s2)});
  }
  if(fid==='te'||fid==='ta'){
    const ta=fid==='ta';
    if(T==='r') return t('rule.ru', {ru:J('る'), suf:J(ta?'た':'て')});
    if(T==='s') return t('rule.becomes', {a:J('する'), b:J(ta?'した':'して')});
    if(T==='k') return t('rule.becomes', {a:J('くる'), b:J(ta?'きた':'きて')});
    if(v.iku) return t('rule.iku', {iku:ja('行く'), right:J(ta?'いった':'いって'), wrong:ja(ta?'いいた':'いいて')});
    const grp='うつる'.includes(l)?'うつる':'むぶぬ'.includes(l)?'むぶぬ':l;
    return t('rule.u.te', {ends:[...grp].map(x=>ja(x)).join(' '), te:J(tePart(l,false,ta))});
  }
  return '';
}
function renderDrill(stage){

  if(!D.key){ stage.innerHTML=`<div class="strip">${strip}</div>${unlockNote}<div class="empty"><p class="lead">${esc(t('drill.noforms'))}</p></div>`; return; }
  const v=VERBS[D.vi], f=FBY[D.fid], ans=conj(v,D.fid);

    }
  } else {
    if(S.set.input==='choose'){
      body = `<div class="choices">${D.choices.map((c,i)=>{ let cls=''; if(c===ans.r) cls=' right'; else if(i===D.picked) cls=' wrong'; return `<button class="choice${cls}${c.length>6?' long':''}" disabled>${ja(c)}${S.set.romaji?`<span class="rom">${esc(toRomaji(c))}</span>`:''}</button>`; }).join('')}</div>`;

    body += `<div class="result ${D.ok?'ok':'off'}">

      <div class="next-row"><button class="btn primary wide" data-act="dnext" id="dnext">${esc(t('next'))}</button></div>`;
  }
  stage.innerHTML = `
    <div class="strip" role="group" aria-label="${esc(t('drill.forms'))}">${strip}</div>
    ${unlockNote}
    <div class="bar">${seg('input',[['choose',t('input.choose')],['type',t('input.type')]],S.set.input,'small')}</div>
    <div class="vcard">
      <div>${verbHead(v)}</div>
      <div class="vp-mean">${esc(vm(v))} <span class="gtag ${v.t}">${esc(groupName(v))}</span></div>
      <div class="vp-to"><span class="form-name">${esc(fName(f))}</span>${ja(f.jp,'form-jp')}<span class="form-gloss">${esc(fGloss(f))}</span></div>
    </div>
    ${body}`;
  if(!D.done && S.set.input==='type'){ const inp=$('#ans'); inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); drillCheckTyped(); } }); if(D.focus){ inp.focus(); D.focus=false; } }
  if(D.done && D.focusNext){ D.focusNext=false; const b=$('#dnext'); if(b){ b.focus({preventScroll:true}); requestAnimationFrame(()=>b.scrollIntoView({block:'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})); } }
}
function drillAnswer(ok){
  D.done=true; D.ok=ok;
  grade(D.key, ok?1:0);
  const r=S.recent[D.fid]||(S.recent[D.fid]=[]); r.push(ok?1:0); if(r.length>20) r.splice(0,r.length-20);
  save(); maybeUnlock(); render();
}
function drillCheckTyped(){
  const inp=$('#ans'); if(inp) D.typed=inp.value;
  if(!D.typed.trim()) { toast(t('drill.typefirst')); return; }
  const a=toKana(D.typed.trim()).replace(/[\s。、．.,!！?？]/g,'');
  const ans=conj(VERBS[D.vi],D.fid);
  D.focusNext=true;
  drillAnswer(a===ans.r || a===ans.k);
}

function verbMatches(v,q){

function verbTable(v){

/* ================= Progress ================= */
function renderProgress(v){
  const isToday=S.day.date===today();
  const y=dayStr(new Date(Date.now()-864e5));
  const streak=(isToday||S.day.date===y)?S.day.streak:0;
  const sc=S.set.pscript, pre=S.set.pskill==='w'?'kw:':'kr:';
  let grid=''; let due=0; const counts=[0,0,0,0]; const now=Date.now();
  ROWS.forEach((row,ri)=>{
    const chars=[...(sc==='k'?row.k:row.h)];
    const cols = chars.length===5 ? [1,2,3,4,5] : [1,3,5];
    if(row.id==='ga') grid+='<div class="kgap"></div>';
    chars.forEach((ch,i)=>{
      const it=KBY[ch], lv=level(pre+ch), st=S.srs[pre+ch];
      counts[lv]++; if(st && st.d<=now) due++;
      grid+=`<button class="kc l${lv}" data-act="kopen" data-ch="${ch}" style="grid-column:${cols[i]}" aria-label="${esc(t('prog.cell',{ch, r:it.r, level:lvName(lv)}))}"><span class="kg" lang="ja">${ch}</span>${S.set.romaji?`<span class="kr">${it.r}</span>`:''}</button>`;
    });
  });
  const legend=`<ul class="lv-legend" aria-label="${esc(t('prog.legend',{skill:t(S.set.pskill==='w'?'writing':'reading'), script:t(sc==='k'?'script.k':'script.h')}))}">${[0,1,2,3].map(i=>`<li><i class="sw l${i}" aria-hidden="true"></i>${esc(lvName(i))} <b>${counts[i]}</b></li>`).join('')}</ul>`;
  const forms=FORMS.map((f,i)=>{
    let st;
    if(i>=S.forms) st=t('prog.locked');
    else { const r=S.recent[f.id]||[]; st = r.length ? t('prog.pct',{p:Math.round(100*r.reduce((a,b)=>a+b,0)/r.length), n:r.length}) : t('prog.notyet'); }
    return `<li><span>${esc(fName(f))} ${ja(f.jp)}</span><span class="st">${esc(st)}</span></li>`;
  }).join('');
  const nToday=isToday?S.day.count:0;
  const a=tn('prog.reviews', nToday, {n:`<b>${nToday}</b>`});
  const line = streak>1 ? t('prog.line2',{a, b:tn('prog.streak', streak, {n:`<b>${streak}</b>`})}) : t('prog.line1',{a});
  v.innerHTML = `
    <section class="p-sec"><h2>${esc(t('prog.today'))}</h2>
      <p class="stat-line">${line}</p></section>
    <section class="p-sec"><h2>${esc(t('prog.kana'))}</h2>
      <div class="bar">${seg('pscript',[['h',t('script.h')],['k',t('script.k')]],sc,'small')}${seg('pskill',[['r',t('reading')],['w',t('writing')]],S.set.pskill,'small')}</div>
      ${legend}
      <p class="k-note">${due?tn('prog.due', due, {n:`<b>${due}</b>`})+t('mn.sep'):''}${esc(t('prog.note'))}</p>
      <div class="kgrid">${grid}</div></section>
    <section class="p-sec"><h2>${esc(t('prog.verbs'))}</h2>
      <p class="stat-line">${t('prog.verbsline',{n:`<b>${S.verbs}</b>`, total:VERBS.length})}</p>

`;
}

const reducedMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function statBlock(key,label){
  const s=S.srs[key], lv=level(key);
  let txt;
  if(!s) txt=t('stat.notyet');
  else {
    const m=(s.d-Date.now())/60000;
    txt=tn('stat.seen', s.n, {c:s.c})+t('mn.sep')+(m<=0 ? t('stat.due') : t('stat.next',{iv:ivLabel(Math.max(1,Math.round(m)))}));
  }
  return `<div class="sh-stat"><b>${esc(label)}</b>${s?`<span class="lvchip l${lv}">${esc(lvName(lv))}</span>`:''}<p>${esc(txt)}</p></div>`;
}
function sheetOrder(g, ch){ strokeAnim(g, ch, 'sheetAnim'); }
function strokeAnim(g, ch, key){
  const token=++R[key]; const d=STROKES[ch];
  g.innerHTML=d.p.map(p=>`<path d="${p}"/>`).join('');
  const paths=[...g.querySelectorAll('path')];
  const addNum=i=>{ const t=document.createElementNS('http://www.w3.org/2000/svg','text'); t.setAttribute('x',d.n[i][0]); t.setAttribute('y',d.n[i][1]); t.textContent=i+1; g.appendChild(t); };
  if(reducedMotion()){ paths.forEach((p,i)=>addNum(i)); return; }
  paths.forEach(p=>{ const L=p.getTotalLength(); p.style.strokeDasharray=L; p.style.strokeDashoffset=L; });
  let t=250;
  paths.forEach((p,i)=>{
    const L=p.getTotalLength(), dur=Math.max(380,L*9);
    setTimeout(()=>{ if(token!==R[key]) return; p.style.transition=`stroke-dashoffset ${dur}ms ease-in-out`; p.style.strokeDashoffset='0'; addNum(i); }, t);
    t+=dur+200;
  });
}
function openSheet(ch){
  const it=KBY[ch]; if(!it) return;
  const wasOpen=!!R.sheet; R.sheet=ch;
  const n=strokeCount(ch), scr=t(it.s==='h'?'script.h':'script.k'), otherScr=t(it.s==='h'?'script.k':'script.h');
  const html=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(ch)} ${esc(it.r)}" data-act="noop">
      <div class="sh-top">
        <span class="sh-glyph" lang="ja" aria-hidden="true">${esc(ch)}</span>
        <div><div class="sh-rom">${esc(it.r)}</div><div class="sh-meta">${esc(scr)}</div>

(function(){

/* ================= Theme: auto, light or dark ================= */
const ROOT=document.documentElement;
let hostTheme=ROOT.getAttribute('data-theme');
const darkMQ=matchMedia('(prefers-color-scheme: dark)');
function effectiveDark(){ const a=ROOT.getAttribute('data-theme'); return a==='dark' || (a!=='light' && darkMQ.matches); }
function applyTheme(){
  const t=S.set.theme||'auto';
  if(t==='auto'){ if(hostTheme) ROOT.setAttribute('data-theme', hostTheme); else ROOT.removeAttribute('data-theme'); }
  else ROOT.setAttribute('data-theme', t);
  paintThemeChrome();
}
function paintThemeChrome(){
  const dark=effectiveDark(), forced=(S.set.theme||'auto')!=='auto';
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{
    if(m.dataset.orig==null) m.dataset.orig=m.getAttribute('content')||'';
    m.setAttribute('content', forced ? (dark?'#10141B':'#EDF0EE') : m.dataset.orig);
  });
  try{ if(window.KakitoriNative && typeof window.KakitoriNative.setDark==='function') window.KakitoriNative.setDark(dark); }catch(e){}
  if(W.ctx) drawInk();
}
// The page host (like Claude) may set its own data-theme. Keep a forced choice on top of it.
new MutationObserver(()=>{
  const cur=ROOT.getAttribute('data-theme'), t=S.set.theme||'auto';
  if(t==='auto'){ hostTheme=cur; paintThemeChrome(); }
  else if(cur!==t){ hostTheme=cur; ROOT.setAttribute('data-theme', t); }
}).observe(ROOT, {attributes:true, attributeFilter:['data-theme']});
try{ darkMQ.addEventListener('change', paintThemeChrome); }catch(e){ try{ darkMQ.addListener(paintThemeChrome); }catch(_){} }

/* ================= Backup ================= */
function b64(bytes){ let s=''; for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(s); }
function unb64(str){ const s=atob(str); const a=new Uint8Array(s.length); for(let i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }
async function pipe(bytes, stream){ const out=new Response(new Blob([bytes]).stream().pipeThrough(stream)); return new Uint8Array(await out.arrayBuffer()); }
async function makeBackup(){
  const raw=new TextEncoder().encode(JSON.stringify(Object.assign({}, S, {set:Object.assign({}, S.set)})));
  try{ if(typeof CompressionStream==='function') return 'RENSHU1Z:'+b64(await pipe(raw, new CompressionStream('gzip'))); }catch(e){}
  return 'RENSHU1:'+b64(raw);
}
async function readBackup(code){
  try{
    code=code.replace(/\s+/g,'');
    let bytes;
    if(code.startsWith('RENSHU1Z:')){ bytes=await pipe(unb64(code.slice(9)), new DecompressionStream('gzip')); }
    else if(code.startsWith('RENSHU1:')){ bytes=unb64(code.slice(8)); }
    else return null;
    const o=JSON.parse(new TextDecoder().decode(bytes));
    return (o && typeof o==='object' && o.srs) ? o : null;
  }catch(e){ return null; }
}

  q(t){ R.query=t.value; R.open=null; $('#vlist').innerHTML=lookList(); }
};
const CHG={
  romaji(el){ S.set.romaji=el.checked; writeLocal(); render(); const c=$('[data-chg="romaji"]'); if(c) c.focus({preventScroll:true}); },
  lang(el){ S.set.lang=el.value||'auto'; applyLang(); writeLocal(); render(); const c=$('#set-lang'); if(c) c.focus({preventScroll:true}); },
  maxgap(el){
    const v=+el.value||0; S.set.maxGap=v;
    if(v){
      const lim=Date.now()+v*60000; let moved=0;
      for(const k in S.srs){ const x=S.srs[k]; if(x && x.d>lim){ x.d=lim; moved++; } }
      toast(t('gap.toast',{label:t('gap.'+v)})+(moved?t('mn.sep')+tn('gap.moved', moved):''));
    } else toast(t('gap.auto'));
    save(); render(); const c=$('#set-gap'); if(c) c.focus({preventScroll:true});
  },
  remon(el){
    if(!HAS_REM) return;
    const tv=(($('#rem-time')||{}).value||'19:00').split(':'); const h=+tv[0]||0, m=+tv[1]||0;
    pushNotifyText();
    let r; try{ r=NATIVE.setReminder(el.checked, h, m); }catch(e){ r='error'; }
    R.remErr='';
    if(r==='scheduled') toast(t('rem.set',{time:fmtTime(h,m)}));
    else if(r==='off') toast(t('rem.off'));
    else if(r==='asking') R.remBusy=true;
    else if(r==='blocked') R.remErr=remBlocked();
    else R.remErr=t('rem.fail');
    render(); const c=$('#rem-on'); if(c && !c.disabled) c.focus({preventScroll:true});
  },
  remtime(el){
    if(!HAS_REM) return;
    const tv=String(el.value||'').split(':'); if(tv.length<2) return;
    const h=+tv[0], m=+tv[1]; if(!Number.isFinite(h) || !Number.isFinite(m)) return;
    const st=remState(); let r; try{ r=NATIVE.setReminder(st.on && !st.blocked, h, m); }catch(e){ r='error'; }
    if(r==='scheduled') toast(t('rem.moved',{time:fmtTime(h,m)}));
  }
};

document.addEventListener('click', e=>{
  const tab=e.target.closest('.tabs button');
  if(tab){ if(S.set.tab!==tab.dataset.tab){ S.set.tab=tab.dataset.tab; R.rowsOpen=false; save(); render(); window.scrollTo(0,0); } return; }
  const b=e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const fn=ACT[b.dataset.act]; if(fn) fn(b,e);
});
document.addEventListener('input', e=>{ const t=e.target; if(t.dataset && t.dataset.inp && INP[t.dataset.inp]) INP[t.dataset.inp](t); });
document.addEventListener('change', e=>{ const t=e.target; if(t.dataset && t.dataset.chg && CHG[t.dataset.chg]) CHG[t.dataset.chg](t); });

applyTheme();
render();
nativeStudyPush();
connectRemote();
if(!S.set.tour) setTimeout(()=>{ if(R.tour==null) openTour(0); }, 350);
if(syncOn()) setTimeout(()=>gsync(true), 800);
try{ if(IS_APP && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
})();
</script>
</body>
</html>
